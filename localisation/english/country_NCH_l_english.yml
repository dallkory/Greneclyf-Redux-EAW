NCH_blosmport_economic_org:0 "Centralized Fund of the River Coalition"
NCH_blosmport_economic_org_desc:0 "The creation of an international fund allows resources to be directed where they are needed most. Despite dissatisfaction among taxpayers, a unified system of subsidies lays a solid foundation for stability and economic growth."

NCH_Basalt_Shaw:0 "Lord-Protector Basalt Shaw"
NCH_Basalt_Shaw_desc:0 "The living embodiment of the unity of Greneclyf’s oldest houses, a descendant of both noble bloodlines. Lord Shaw combines the discipline of an officer with the cold courage of a duelist, being the finest swordspony in the kingdom, whose honor has never been stained by defeat. However, the Lord-Protector’s greatest virtue is his unconditional loyalty to the Oir and Lehmann royal dynasties. In recent times, he has not only served as the Queen’s personal bodyguard but has also taken direct command of the Royal Guard of Greneclyf."

NCH_Overpopulation:0 "Overpopulation"
NCH_Overpopulation_desc:0 "Overpopulation on the island has led to an imbalance between the number of its inhabitants and the capacity of the environment. The industrialization of Enya’s era brought not only economic growth, but also a sincere belief among subjects—who tasted prosperity for the first time—that life was truly improving. As a result, the kingdom found itself in a position where keeping track of everyone became almost impossible…"
NCH_Overpopulation_2:0 "Moderate Birth Control"

NCH_FBK_pact:0 "The Great Treaties"
NCH_FBK_pact_desc:0 "The ancient friendship between Farbrook and Greneclyf is symbolized by two pairs of tapestries, each woven by one of the peoples. The first tapestry depicts the First Exchange, carried out approximately 800 years ago, while the other portrays the Frozen Refuge. Both events are of great significance to both nations.\n\nKnown collectively as the \"Great Treaties,\" these masterpieces stand as testimony to the historic friendship and cooperation between the two peoples. They blur biological barriers and prove the universality of the idea of harmony."

NCH_idyllic_society_1:0 "Pacifist Isolationism"
NCH_idyllic_society_1_desc:0 "As changelings, the people of Greneclyf are naturally inclined toward military affairs and, during Enya’s reforms, eagerly sought information and knowledge about the state of armies across the Griffonian continent. However, the kingdom has long lived in isolation, maintaining contact only with a handful of tribes, and as a result its populace is far from warlike in spirit."


