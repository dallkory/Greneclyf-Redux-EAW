NCH_queen_plan:0 "Queen Gytha’s Royal Decrees"
NCH_queen_plan_desc:0 "Queen Gytha Lehmann is known for her pragmatism and decisiveness. Her decrees are aimed at stabilizing the internal situation after the crisis in Greneclyf and ensuring the well-being of all subjects of the kingdom. The royal plan requires significant resources and effort, but it appears to be necessary for Greneclyf’s future prosperity.\n\nThe fulfillment of the royal decrees will grant substantial bonuses across various spheres of the kingdom’s life, including the economy, social stability, and military strength."
