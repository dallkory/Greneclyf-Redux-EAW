greneclyf_base.1.t:0 "Legacy"
greneclyf_base.1.d:0 "Gytha slowly leafed through last year’s reports and old newspapers, trying to form the most accurate picture possible of the country that had fallen into her hooves.\n\n‘Luddites, luddites, luddites… there weren’t this many of them when I was younger, were there?’, the queen glanced wistfully out the window, frowning at the gathering clouds.\n\n‘I suppose that is the price of progress. What was the earliest record of machine dissent? The 90s? Holy Matron, I was barely a hatchling back then! In just a single generation, Enya managed to so radically reshape society…’, Gytha studied the raindrops forming on the glass, reflecting on how the old country of collective labor had so swiftly turned into a divided society of guilds, manufactories, elites, and the poor.\n\n‘Your Majesty?’, Lord Protector of the realm Basalt Shaw entered the study, awkwardly tapping a hoof against the open door. ‘Something troubles you?’\n\n‘It appears industrialization is not an unmitigated blessing. I never imagined that machinery from Griffonia would strip away so many jobs! And the luddites…’\n\n‘At your word, the guard will deal with them, Lady Gytha.’\n\n‘No. Under no circumstances. They are my little subjects — innocent and hungry workers who were robbed of their means to find purpose. No force must ever be used against the suffering. We took their work from them — it is for us to fix this. I… I will come up with something at the convocation of the Eryahtas. This is our first and most pressing issue,’ Gytha declared resolutely, her eyes darting across lines describing how unemployment had enriched new industrialists while impoverishing ordinary drones. ‘By the way, why did you come? Some matter of business?’\n\nShaw nodded with a neutral expression. ‘The Royal Guard. As the new Commander-in-Chief, I have several concepts for modernizing our army, but since you mentioned the Eryahtas, that is where it shall be decided. I will trouble you no further,’ the Lord Protector turned to leave, but paused as if recalling something. ‘Her Excellency, Supreme Judge Oyren, asked me to convey that she would like to meet you in the library this evening. What should I tell her?’\n\nGytha was still processing the thought that she would soon be involved in military modernization, when a familiar name pulled her from her trance. ‘Oyren?’, the queen’s face softened slightly."

greneclyf_base.1.a:0 "‘I will be there. Tell her to bring that Hindian tea again.’"


greneclyf_base.2.t:0 "The Convocation of the Eryahtas"
greneclyf_base.2.d:0 "Both chambers of the representative parliament gathered within the ancient halls of Blosmport Abbey, just as they and their predecessors had done for over eight hundred years. Yet today’s session was unusual: every prefect, cardinal, officer, and bureaucrat present sensed the weight of unprecedented change. The shouts and aggressive disputes typical of the Abbey during sessions gave way to excited whispers, abruptly silenced by the sharp strike of Supreme Judge Oyren of Oir’s gavel.\n\n‘Order!’, she took a deep breath and continued in her commanding tone. ‘The First Convocation of the Eryahtas under the blessed reign of Her Majesty Gytha of Lemann is hereby declared open! The floor is granted to the monarch herself.’\n\nOyren fixed her expectant and stern gaze upon Gytha, and only the queen could perceive, within that expression, the gentleness and encouragement of a sworn sister urging her to begin.\n\n‘I… ahem, am honored to greet the representatives of all estates of our proud community under one roof for the first time. The age now dawning is the beginning of history’s making, for which the Glorious Enya sowed seeds throughout her life with the sweat and blood of our nation. The time has come to reap the fruits of her efforts and multiply them, without dishonoring the legacy of the previous queen — and for that, I and all of us will give our utmost,’ Gytha continued, her voice growing more emotional. ‘Much work lies ahead: bringing the Guard to a state worthy of the 11th century, providing work to our people whose livelihoods were taken by machines, poverty returning to our streets for the first time since the First Great Famine,’ — she pressed on — ‘even the Abbey itself! The pretors tear at one another over the correct interpretation of the Matron’s word; how did we come to this?!’\n\nThe queen met Oyren’s gaze once more, who subtly signaled the need to shift the direction of the speech.\n\n‘But… but there are also things that have worked flawlessly since Enya’s time — like Skyfall clocks. Our new legal system, whose Charter was written at the start of this century, and the introduction of the prefecture system, which has proven vastly more effective than the old feudal holdings. Today, as I expect, Prefect Carrion of our glorious capital will share his experience with the Eryahtas, after which other opinions and questions will be heard, so that together we may decide which path our country must walk. I thank you all sincerely.’\n\nThe assembled representatives greeted the queen with applause as she returned to her seat beside Oyren.\n\n‘You did well,’ the Supreme Judge whispered with a barely noticeable smile, before resuming her authoritative tone as tradition demanded. ‘Order! The floor is granted to Apex Carrion, Prefect of Blosmport.’\n\nA tall, imposing changeling of noble bearing adjusted his monocle as he stepped to the podium and answered in a loud, gravelly voice:"

greneclyf_base.2.a:0 "‘Thank you for the opportunity, Your Majesty Gytha and Your Excellency Oyren.’"


# Gytha Jorney #
greneclyf_base.3.t:0 "The Beginning of the Journey"
greneclyf_base.3.d:0 "Prefect Carrion had assembled part of the city guard specifically for this day to hold a parade, wishing to show Gytha the state of affairs in Blosmport. The general was visibly proud of himself, craning his neck and baring a grin at the marching guards.\n\nToday, Gytha was not merely inspecting the city, but officially announcing the beginning of a royal tour across the entire island — an occasion the prefect chose to celebrate with a citywide festival. Subjects of the Crown wandered in family groups from one street vendor to another, while the crowd watched the officers with delight and enjoyed live music.\n\n‘What do you think of the parade, Your Majesty?’, Carrion asked Gytha as she waved a hoof to the crowd.\n\n‘I must admit,’ she began, ‘the way Blosmport has transformed since my childhood is astonishing. When I was a foal, our pier held only wooden boats — and look at it now. It is an entire shipyard, where our first ship already awaits me!’\n\nCarrion adjusted his monocle, approvingly eyeing the steel leviathan. ‘Yes, Her Majesty Enya truly was great, if she could introduce our people to such marvels. However, I must warn you, my Queen — other parts of our nation are… not so advanced. You may even be shocked by how starkly the capital differs from the rest of the country,’ Carrion said, furrowing his brow.\n\nGytha shrugged. ‘Then that is precisely what I shall see, Prefect. In the end, it is I who must raise our country to an entirely new level, not someone else. And I am ready for it.’\n\nThe prefect allowed himself a faint smile, clearly admiring the queen’s resolve. She might be naïve, but there was undeniable potential in her for great deeds — given a more pragmatic approach."

greneclyf_base.3.a:0 "‘I wish you luck on your journey, Your Majesty.’"

greneclyf_base.4.t:0 "Beyond the Golden Cage"
greneclyf_base.4.d:0 "Setting hoof on Aisling for the first time, Gytha gasped in surprise as she descended the gangway from the ship. This too was her country? This backwater?\n\nHer thoughts were interrupted by a modest welcoming ceremony, which quickly filled her heart with warmth when she saw her soot-stained subjects joyfully greeting their queen. At the center stood a tall changeling with a stern expression that softened into a weary smile upon seeing the two most important figures in the kingdom.\n\n‘Your Majesty, Your Excellency — may the wisdom of the Matron illuminate your paths,’ the changeling bowed deeply.\n\n‘It is good to see you, Pretor Onychion. Or do you prefer being addressed by your secular title of prefect?’, Oyren asked.\n\nGytha studied him closely. ‘Onychion? You have… aged so much since we last met. It is hard to believe you are the same changeling who conducted our initiation rite years ago.’\n\n‘Time flows, my Queen. The capital’s pretor and most likely future cardinal is now Actino. As for me, I have found my strength in service here — where I am needed by our brothers and sisters in faith as a prefect, not only as a spiritual guide,’ Onychion said, turning his gaze toward the people of Aisling.\n\nOver the following days, Gytha and Oyren studied local life firsthand. Daily conversations with Onychion revealed just how unevenly modernization had spread across the island: some changelings here could not even read, and competent bureaucratic administration had only begun under Enya, after a priest was appointed prefect.\n\nBidding farewell to Aisling, the queen and her retinue departed for their next destination."

greneclyf_base.4.a:0 "Zhukomyr awaits!"

greneclyf_base.5.t:0 "The City of Steel"
greneclyf_base.5.d:0 "When Gytha arrived in Zhukomyr, the sight before her was wholly unexpected. In the middle of the square, a crowd surrounded a stout changeling who, sweating, pleaded for calm. Upon spotting the queen, her eyes widened and she spoke into the microphone once more. ‘Your Majesty! Zhukomyr welcomes you!’\n\nThe crowd froze, turning as one to face Gytha. She smiled awkwardly and waved to her subjects — and moments later they overwhelmed her with endless complaints. ‘Queen, they took our jobs!’, ‘We have nothing left to eat, Your Majesty!’, ‘Matron, have mercy on us!’\n\nOyren stepped forward before the stunned Gytha and shouted, ‘ORDER!’, silencing the crowd. ‘I see that my home hive is going through difficult times. Rejoice — not only has Her Majesty arrived for an inspection, but so has your Supreme Judge. I will gladly hear your grievances to determine our course of action. And our esteemed Prefect Berylla will assist me in this, will she not?’, Oyren bared her fangs at the nervously swallowing official in the center of the square.\n\nOver the next several days, the queen and the Supreme Judge inspected manufactories and mines, repeatedly hearing accounts of labor conditions from factory workers, owners, the prefect, miners, and even the luddites — with whose leader Gytha shared tea under the watchful eye of her loyal Lord Protector, Shaw.\n\nThough Oyren did not show it outwardly, her heart ached at the sight of what the ancestral home of House Oir had become. Basalt sensed her sorrow and took upon himself part of the duties and conversations with citizens, sparing the judge from despair.\n\nOne evening, the Supreme Judge visited her family nest. The same respectfully bowing gatekeeper, the same richly decorated walls, and the same sense of order amid chaos.\n\n‘Oyri, is that you?’, asked an elderly noblewoman seated by the fireplace. Her eyes opened, revealing the familiar cloudy haze.\n\n‘Yes, mother… it has been a long time,’ Oyren approached her ancestress, sat beside her, and allowed her to embrace her daughter. After several moments of silence, Oyren spoke again. ‘How fares our house, mother?’\n\nThe old noblewoman frowned slightly, as if recalling recent events.\n\n‘Foolish as ever. The elders care only for money and pleasure, the younger ones refuse to come to their senses. Though your nephew Kyanite is pushing his way into the prefecture, taking part in city affairs,’ the judge’s mother took a sip of a pungent herbal tincture before continuing. ‘You two are the hope for true change within the house, Oyren. Your grandmother’s rule tipped the scales, and now we are either corrupted — like Isoviy, no doubt spoiling city mares again…’ she turned her blind gaze toward her daughter, ‘or the noble hope of our great family — like you and Kyanite. How tragic that the queen is Gytha, and not you, my dear,’ the ancestress smiled, a tear tracing its way down her face.\n\nThe following morning, as the nervously chattering Berylla and representatives of every social estate saw the leaders of the state off, hope was kindled in each of their hearts — hope for the changes embodied by a new generation of power. Changes that would rein in Enya’s reforms and guide the country onto the proper path."

greneclyf_base.5.a:0 "The rumble of the train faded into the distance..."

greneclyf_base.6.t:0 "The Road Home"
greneclyf_base.6.d:0 "‘I am still surprised that for security you took only Basalt and a couple of guards, Gytha,’ Oyren snorted, gazing through the locomotive window at the forests of Greneclyf. ‘As you can see, the lives of ordinary drones are far from ideal, and it would take only one enraged fanatic to plunge this country into a crisis beyond anything it has ever imagined.’\n\nGytha merely smiled in response, reading one of the reports from Aisling. ‘Oyren, I appreciate your concern, but I am certain my subjects would never try to kill me. I am not afraid of them — I love each and every one of them, and I want them to see that. Besides, even if some… peculiar element does emerge among them, our tireless Lord Protector will deal with it in an instant!’\n\nA shadow of uncertainty crossed Oyren’s face as she considered her reply. In the end, she simply exhaled loudly. ‘Gytha… do you remember the drones in Aisling? While you were speaking with Onychion about their lives, I spoke with the youth — illiteracy is universal. The education system can no longer cope; there are simply too many of us.’\n\n‘Add it to the list of problems we must solve,’ Gytha replied with a bitter smile. ‘Or recall what Zhukomyr looks like now… It pains me to see what it has become. Imagine it — once the first city of our people, now a dusty concrete sack.’\n\nOyren turned away, openly revealing sorrow for the state of her native hive for the first time. Yet moments later she concealed those feelings and looked at the queen with a smile. ‘And what of Llir? What caused all that shouting in the office — did my Gytha scold someone over the poor harvest?’, the judge asked with a smirk.\n\nGytha hesitated. ‘Vixit is… old-fashioned, though it is difficult to say that about someone who fills her home with so many mechanisms. She knows what she is doing, she is wise — but she must adapt to the fact that we live in a new era. As for the harvest issues…’ the queen sighed, ‘I have some rather radical ideas related to… well, we will speak of it later. The peasants have also begun a witch hunt.’ Oyren looked at the queen inquisitively, but said nothing.\n\nGytha took a deep sip of tea, watching as darkness slowly swallowed the island landscapes beyond the window.\n\n‘I am glad you are here with me, Oyren. It truly means a great deal to me,’ the queen said softly.\n\n‘I know. We have been inseparable since childhood — even wearing a royal mantle will not free you from me, Leman,’ the judge chuckled.\n\n‘Yes…’ Gytha murmured dreamily, settling more comfortably beside her and closing her eyes in exhaustion. ‘May it always be so.’\n\nOyren wrapped a foreleg around her, then drifted into thoughts of how she would help the softly breathing queen beside her achieve, at any cost, a Greneclyf worth living in."

greneclyf_base.6.a:0 "‘Sleep peacefully, my Queen. You have earned a little rest.’"

greneclyf_base.7.t:0 "Report of the Graduates of 277"
greneclyf_base.7.d:0 "‘### Top Secret. For Her Majesty’s eyes only,’ Gytha grimaced at the formality, yet continued reading the yellowed parchment.\n\nAfter some time, she gently lowered the page onto the desk with her horn and pondered. So the market does not regulate itself after all, and the republican economists of Kemera were mistaken — and sometimes state intervention is not such a terrible thing?\n\n‘This Biccolini is certainly eccentric, but there is something to his ideas,’ Gytha drawled, examining the spider brought from Deponia, sealed within glass."

greneclyf_base.7.a:0 "‘Perhaps we should adapt some of his methods.’"

greneclyf_base.8.t:0 "The Apartment of the Future"
greneclyf_base.8.d:0 "When the time came to present her project, the blue-eyed changeling beamed widely and greeted the queen with a strong Aquellian accent:\n\n‘Bonjour, Votre Majesté! I am absolutely delighted to present to you a miniature model of housing that will one day stand in every corner of our glorious homeland — cheap, practical, and adorable, oui!’, the young architect chirped, nearly bouncing in place.\n\n‘Miss Xylocopa Valga, to the point,’ Oyren snorted skeptically.\n\n‘Oui, oui! Please!’, Valga replied, magically lifting a velvet cloth to reveal a small building model. Gytha stepped closer, examining it carefully.\n\n‘This is… what exactly, dear Valga?’\n\n‘This, Your Majesty, is what in Aquellia is called “construction modulaire”. The idea is that such a building is not constructed on site, but assembled from panel blocks manufactured in factories in advance! The savings are incredible — and look!’, Xylocopa stepped closer, eyes blazing with excitement as she removed the model’s top to reveal the interior.\n\n‘Here, here, ma Reine, do you see? The space is fully optimized so that future residents can comfortably perform all household tasks. Do you realize how many kilometers an average homemaker walks while cooking stew and caring for offspring? Of course it is exhausting — but not in a home like this, where everything is close at hoof,’ she said, laying out a blueprint showing the dimensions of a standard apartment.\n\n‘The space seems rather small. I would even say, bordering on uncomfortable,’ the Supreme Judge remarked. ‘Are you certain this is not excessive?’\n\n‘Non, non, non, not at all! Everything is precisely calculated. I did not merely defend my thesis on this subject — I lived in such a building myself. This is called rational efficiency, exactly what our island needs in such difficult times,’ Xylocopa replied with another dazzling smile.\n\nAfter a brief discussion and a nod from Oyren, Gytha responded:"

greneclyf_base.8.a:0 "‘Miss Valga, congratulations. Your project is approved.’"

greneclyf_base.9.t:0 "A Letter from the Baroness"
greneclyf_base.9.d:0 "Sweating slightly, Gytha read the beautifully penned letter, marked with a vulgar lipstick kiss upon the paper — clearly revealing its author.\n\n‘Esteemed Queen and dear niece,\n\nTo my great misfortune, the harvest problems began even earlier than I had anticipated. An unexpected northern storm destroyed the meager crops we already had. The Sacred Grove is forced to introduce a rationing system for food, and by my decree as prefect I am imposing a curfew upon the streets to prevent unrest at its root. I earnestly ask you to take action and remain ever ready to assist.\n\nYours always,\n\nBaroness Vixit Lemann, Prefect of Llir’"

greneclyf_base.9.a:0 "‘Damn it…’"

greneclyf_base.10.t:0 "Reality Hit"
greneclyf_base.10.d:0 "‘Sorry, could you repeat that?’, Gytha asked her Lord Protector, an eye twitching.\n\n‘Famine, Your Majesty. Farbrook has had a failed fishing season. We hoped to purchase what we lack from Bakara, but the River Coalition tariffs are beyond what our treasury can bear. I fear the country stands on the brink of what happened eight hundred years ago…’\n\nGytha slammed her hooves onto the desk, snorting with anger. ‘We still have time! We still have room to maneuver! Shaw, convene the Eryahtas at once! Summon Oyren!’\n\nBasalt nodded, grasping the gravity of the situation, bowed, and hurried away to contact the state’s leading figures.\n\nGytha collapsed into her chair, staring at her trembling hooves. She knows what hunger is; the entire island learned the lesson of the First Great Famine eight centuries ago, ensuring that descendants would never forget the horrific images of emaciated drones devouring one another with revulsion on their faces. The mere thought made Gytha shed a tear, gasping for air in panic, until she forced herself to draw a deep breath and exhale.\n\n‘I will not let this horror happen again. Whatever the cost, my little subjects will not witness a second nightmare.’"

greneclyf_base.10.a:0 "‘Or I am no queen of House Lemann!’\n§CThe Second Great Famine has begun…§!"
greneclyf_base.10.b:0 "§RPerhaps surrender is not the worst outcome…§!"


greneclyf_base.15.t:0 "A Formal Dinner"
greneclyf_base.15.d:0 "Oyren utterly despised the idea of hosting any sort of reception under the looming threat of famine, yet she understood it was vital for the nation’s survival. Anything was better than cannibalism, ruin, or revolution.\n\nStill, when she entered the hall in her strict service jacket, escorting Gytha and Shaw, irritation did not leave her stony face as she caught the wide-eyed stares of several ponies. Throughout the evening’s conversations, it was painfully clear that these arrogant riverlanders considered her bloodline savages — crude fools to be deceived and led by the nose.\n\nAnd being dependent on them was humiliating.\n\nWhen the dinner ended and Gytha, exhausted by endless attempts to placate those snobs, dragged herself to her room, Oyren once again heard her muffled ночные sobs.\n\nAnd then and there she swore to do everything in her power to hold back the vultures from the continent."
greneclyf_base.15.a:0 "‘In the name of Greneclyf, and for the honor of our blood.’"


greneclyf_base.16.t:0 "The Zone of Sin"
greneclyf_base.16.d:0 "After signing countless onerous contracts and agreements, Gytha paused at the last one, staring at the representative of river capital as if she had just told the least funny joke in a very long time.\n\n‘A gambling zone? What does that even mean?’, the queen threw a questioning glance at the fidgeting Bakaran pony.\n\n‘You see, Your Majesty,’ the pony coughed and began cautiously, ‘in many riverland countries casinos are either banned or left uncontrolled, turning into breeding grounds for all sorts of riffraff. And so… my patrons propose that you open the first legal casino in Saor, where money from every land would flow.’\n\nOnychion, present at the meeting as Prefect of Aisling, sprang up in fury.\n\n‘You want to open in our religious country this den of lust and sin?!’, he roared, glaring at the trade representative, who shrank deeper into her chair.\n\n‘Your Majesty, even as a representative of the schismatics, I cannot approve this in any way. It is vile!’\n\n‘And you think I don’t know that?!’, Gytha herself snapped, slamming a hoof on the table. ‘Spare me your sermons about Matrona, Onychion — our people may end up eating one another! What are they supposed to feed on?! Your speeches?!’, she added sharply, sinking back into her chair.\n\n‘I-if you permit…’, the representative raised a trembling hoof, forcing a tight smile. ‘From the fees alone your treasury will receive a great deal of money. I guarantee demand will be enormous. Y-yes — and it will also improve the investment appeal for tourism!’\n\nOnychion looked like a scolded child and exhaled heavily. Meanwhile, with a swift stroke of her pen, Gytha authorized the venture, then lifted her gaze sharply toward the pony.\n\n‘What is your name?’\n\n‘S-Sweet Sprinkle,’ she stammered, adjusting her glasses.\n\n‘From now on, Miss Sprinkle, you will be accountable лично to me for everything that happens in Saor. Understood? You are dismissed.’\n\nThe queen turned away, clearly unwilling to continue the conversation.\n\nThe Bakaran’s eyes widened. She bowed meekly, turned, and hurried out, carefully closing the door behind her."

greneclyf_base.16.a:0 "‘I’m just a broker…’"


greneclyf_base.17.t:0 "A Bored Captain"
greneclyf_base.17.d:0 "The pony in a peaked cap smirked with satisfaction as he noticed Her Majesty’s Lord Protector approaching. He finished his cider, removed his cap, and nodded amicably.\n\n‘Lord Protector! A great honor to meet you. How can I help?’\n\nBasalt gave him a skeptical once-over, but got to the point all the same:\n\n‘Greetings, Captain Butler. I am here on behalf of Her Excellency the Supreme Judge. She wishes to know why the URC sent its own police regiment here instead of relying on the Guard.’\n\nThe captain’s smile dimmed slightly.\n\n‘To be honest, my lord, they simply don’t trust you,’ he said, looking at the changeling. ‘The formal reason is ‘ensuring the safety of all international guests’ and other vague wording. But in practice it’s about trust. Or rather — the lack of it, he-he-he.’\n\n‘You are… remarkably candid, Captain. While that deserves respect, the situation itself is dispiriting.’\n\nThe pony nodded with understanding, lazily eyeing the rumps of passing mares, then looked back at Lord Shaw.\n\n‘Your Lordship, I’ll be frank: I don’t give a damn about politics. In my life I have three passions — drink, mares, and martial valor. I can find all three here with ease. And I offer you, as a representative of the last, my friendship. I respect you as an officer respects a commander, and I guarantee I will quietly keep you informed about what’s happening in Saor — behind the General Staff’s back. Provided, of course, you don’t вмешиваться in the zone’s affairs directly, so as not to scare off the merchants, he-he-he. Agreed?’\n\nThe pony grinned again, but in that grin Shaw saw no threat. Before him sat more of a mischievous colt, eager to cause a little trouble for his superiors for reasons unknown to Basalt.\n\nBasalt exhaled.\n\n‘Very well. If the only alternative is storming this so-called zone with the Guard and severing ties with the Coalition, I have no choice. But I expect absolute honesty, Captain.’"

greneclyf_base.17.a:0 "‘From now on, there will be both open law — and hidden law.’"

# Magic Hoof
greneclyf_base.19.t:0 "The Magic Hoof"
greneclyf_base.19.d:0 "Vixit stared at the field where crops from the riverlands were sprouting. They looked stunted and misshapen, growing too tall in some places and too low in others. But the real problem lay elsewhere: no one had planted anything on this plot.\n\nAs was her habit, the Prefect lit a thin cigarette through an elegant holder while rereading an old envelope with an unusual seal and no sender’s address. She looked up from it again, standing before a manifestation of a miracle.\n\n‘Dear Baroness,\n\nWe love Llir and wish to help you and all its inhabitants. Please accept our humble gift on plot A113 of your lands. Distribute it among the poor drones and the children, among all those in need — we will assist you as our means allow.\n\nThe Sisters’\n\nAt the bottom of the letter was a symbol familiar to Vixit, one that guards and locals had already reported."

greneclyf_base.19.a:0 "‘Who are you…?’"

# Hierarchy of Consumption
greneclyf_base.20.t:0 "The Hierarchy of Consumption"
greneclyf_base.20.d:0 "‘So then!’, Kyanite clopped his hooves together, flipping through yet another chart before the Prefect Berilla and Queen Gytha.\n\n‘As you can see, we do indeed have a certain surplus of food. And the question is acute: to whom should it be distributed? Anticipating your question, Your Majesty, I will say at once — Berilla and I have calculated everything. Equal distribution is impossible, and it will satisfy no one. Therefore,’ the Zhukomir prefect’s protégé switched the slide, ‘we have identified three target consumer groups. Group A — officials and administration; Group B — the workforce; Group C — the lumpen.’\n\n‘One might say that in the name of harmony everything should go to Group C. But, Your Majesty, what is the point of that?’, Kyanite added, not hiding his skepticism.\n\nGytha glanced at him, scarcely believing her ears. ‘The point is that otherwise they will simply die, Kyanite.’\n\n‘And so what?’, the deputy prefect blurted out shamelessly.\n\nThe Queen felt a surge of anger and was about to rise, but Berilla stopped her. ‘Y-Your Majesty, allow me to explain this a little differently. Forgive my protégé’s bluntness.’\n\nThe official stood, stepping toward the charts and gently moving Kyanite aside. ‘The matter is that allocating the surplus to Group A will improve the efficiency of the administrative apparatus and speed our way out of the crisis. Allocating rations to Group B — our workers — will allow them to produce more, buying us time and yielding more food in the future. As for allocating to Group C…’, the Prefect hesitated slightly. ‘The only reason to increase rations for the poor is to prevent an uprising. It is a way to pacify the masses, but at the cost of workers and ourselves going hungry. Of course, there is a certain logic to this, but…’\n\n‘But strategically it is far more advantageous to increase rations for workers and suppress poverty with force!’, Kyanite interjected, not letting Berilla finish. ‘Your Majesty, one must be rational here. Please consider everything as carefully as possible. Feed the parasites — and you risk everything else; feed the soldiers — and they will leap into Tartarus for you, eliminating threats along the way.’\n\nGytha pondered this. Her gaze was icy, yet she could not deny the rationality of the proposal. After long deliberation, she said:"

greneclyf_base.20.a:0 "‘Group A, the officials’"
greneclyf_base.20.b:0 "‘Group B, the workers’"
greneclyf_base.20.c:0 "‘Group C, the poor’"

# Fear and Loathing in Saor
greneclyf_base.21.t:0 "Fear and Loathing in Saor"
greneclyf_base.21.d:0 "‘So, what do we have here?’, Butler squeezed past several officers examining the hotel room.\n\n‘Dismemberment. And a bad one,’ drawled the security officer sitting by the body. ‘One of the local unfortunates. Took up night work — it’s popular these days. They get affection and money, and the clients are delighted — they can take on any form. And then…’, the officer blew a ring of smoke toward the corpse.\n\nButler grimaced. Someone would be very unhappy about this news — not to mention the headache it would cause him personally.\n\n‘Alright. What about the room? Who called her here? Who was staying here?’\n\n‘Check the registry. You’ll be quite surprised.’\n\nAt the reception desk, the captain requested the guest records, and when his eyes stopped on room 217, he nervously scratched the back of his head.\n\n‘Shine Spark. Ambassador of Wittenland. Of course. That explains the nature of the injuries, too.’"
greneclyf_base.21.a:0 "‘Someone is going to be very, very angry…’"

# A Vile Report
greneclyf_base.22.t:0 "A Vile Report"
greneclyf_base.22.d:0 "Basalt spent a long time reading the report sent by Butler, studying the photographs of the murdered Greneclyf citizen as closely as possible — limited as it was, since the Guard would not be allowed into the investigation due to the humiliating status of the Saor Zone.\n\nEventually, he brought the matter to the Supreme Judge.\n\n‘Our own citizens are becoming whores, and at such a young age as this Lucilia. And in the end they are beaten to death like cattle, without consequence,’ Oyren grew more furious with every word.\n\n‘An entire country has become a cheap mare for the riverlands. This poor girl — she is all of us, Basalt.’\n\nShaw stood stone-faced, unsure how to respond. At last, he spoke:\n\n‘Your Excellency, as changelings of the law, we can respond in two ways. The first is to allow Captain Butler to conduct the investigation and deal with the culprit himself.’\n\n‘And rely on them not covering for one another and not continuing to kill our citizens?’, Oyren scoffed.\n\n‘…Or the second, which I propose to you as a Greneclyfer. Leave them a message. I will handle it personally, if that is your order, Lady Oyren. Retribution will be guaranteed.’\n\nThe Supreme Judge reflected. On the one hoof, one could proceed according to the law — albeit one imposed from outside — so that everything ran smoothly. On the other, humiliation could not be endured, and anyone who sinned against the subjects she had sworn to protect had to know that retribution was inevitable.\n\nAt last, she decided:"

greneclyf_base.22.a:0 "‘Assist the police however you can’"
greneclyf_base.22.b:0 "‘Make an example of Shine Spark’"

# Saorian Noir
greneclyf_base.23.t:0 "Saorian Noir"
greneclyf_base.23.d:0 "The festive atmosphere in the VIP hall was abruptly shattered by the thunder of a police regiment sealing off the room. When the bewildered guests were ordered to remain in place and the security detail was disarmed, Butler strode stiffly toward the stunned Shine Spark.\n\n‘Mr. Ambassador of Wittenland, the Police Department of the Saor SEZ possesses incontrovertible evidence of your involvement in a murder committed two months ago in this very casino. Please accompany us to the station while the circumstances are clarified.’\n\nThe unicorn looked the captain up and down with contempt and snorted:\n\n‘First, I have diplomatic immunity. Second, a filthy earth pony does not give me orders. Begone, serf.’\n\nButler’s smile tightened. He leaned toward the suspect’s ear and hissed:\n\n‘Your choices are limited, Wittenland rat: either you come with me, or—doing a favor to a veeeery angry royal regime—I shoot you during the arrest. This is not the slave magocracy of your native dump. Don’t get cocky, hee-hee-hee…’\n\nThe chuckle sounded especially vile to the ambassador. In the end, he agreed to be escorted and was soon convicted and extradited to a prison back home. Of course, through connections he could well secure his release in Wittenland, but today the Saor police demonstrated that violence against Greneclyfers is also punished by law."

greneclyf_base.23.a:0 "‘The triumph of law?’"
greneclyf_base.23.b:0 "‘Justice has been done’"

# Vendetta
greneclyf_base.24.t:0 "Sharing the Pain"
greneclyf_base.24.d:0 "Shaw chose the perfect day for revenge: when the ambassador had gone out to sea aboard his ship. The Lord Protector personally infiltrated the vessel with a small detachment of the Royal Guard. Eliminating only Shine Spark would have looked suspicious, so the order was simple: kill everyone encountered and loot the ship.\n\nThe waiter returned to his native changeling form:\n\n‘Aside from security and crew, the vessel is full of… uh, escorts of indeterminate gender, revelers, and elements tied to narcotics trafficking. Spark himself is on the upper deck, at least four armed subjects there as well, the remaining twelve scattered below. Execute?’\n\nShaw pulled on a balaclava and charged his Wingbardian SMG.\n\n‘Stage it as a pirate attack. Remember: no witnesses. For Greneclyf!’\n\nA week later the ship washed ashore near Bakara, where the coast guard examined it, suppressing retches at the stench of sun-rotted, bullet-riddled bodies. They found Spark last—his face frozen in a foolish expression, a bullet hole gaping in his skull.\n\nIn light of the news, the ORC declared the sea region dangerous, reducing the flow of clients. Some representatives guessed the real issue and ordered their subordinates to behave with restraint in Saor. They got the message. However, the kingdom will clearly suffer from the reduced visitor traffic to the Zone."

greneclyf_base.24.a:0 "‘It’s about the message’"

greneclyf_base.32.t:0 "Messages from the Family Nest"
greneclyf_base.32.d:0 "‘You’ve got to be kidding me!’, Oyren barked at her nephew. ‘How did you manage to allow a strike?!’\n\n‘Yelling won’t help, Oiry,’ Kyanite said, tie loosened, sipping coffee and tapping the table with a hoof. ‘The workers were at the limit. After your visit they even started believing all their problems had been magically solved. Poor Berilla has already ended up in the hospital from stress, so I’m acting prefect for now. Quite the job, I’ll tell you…’\n\nOyren buried her face in her hooves and exhaled loudly. They were so close to life finally becoming normal—and of course it all had to be ruined at the very last moment.\n\n‘Prepare for the introduction of martial law.’\n\nKyanite hiccupped in surprise. ‘Are you sure? And what will Gytha say?’"

greneclyf_base.32.a:0 "‘I’ll think of something’"

greneclyf_base.26.t:0 "A Sacred Place"
greneclyf_base.26.d:0 "On the way to Llir, Gytha was visibly nervous. When she was little, she had nearly disrupted her initiation into the Church of Matrona there by sneezing on the priest. The mere memory of his look and her aunt’s ringing laughter made Gytha’s cheeks flush, and she stepped into the train vestibule to clear her head.\n\nBasalt Shaw was there as well, reading an encrypted report on regional security status, and without looking up said: ‘Nervous, my lady?’\n\nGytha sighed and admitted: ‘I’m already a monarch, yet I still fear Vixit’s laughter. And did Enya really have to appoint her prefect?’\n\nShaw replied thoughtfully: ‘If I recall correctly, this branch of House Lemann has held these lands almost since Ulysses’ expedition a century ago. It’s hardly surprising a relative of yours was chosen as prefect.’\n\n‘Yes, yes… know-it-all,’ the queen pouted.\n\nUpon arrival, the state’s first figures were escorted by richly dressed guards past vast fields worked by peasants to a large white manor. From the outside it looked like a feudal estate with slaves, but in truth the city—the kingdom’s agrarian hub—lay slightly below. The manor served as both administration and residence of its prefect—Baroness Vixit of House Lemann, famed for her eccentricity and love of inventions. Inside, Gytha asked her retinue to wait and went alone to speak with the baroness through strange mechanical doors.\n\n‘It’s been far too long since I last saw your charming little face, dear,’ purred a thin changeling with long black hair uncharacteristic of House Lemann, her face hidden behind a red, embroidered Kirian fan. ‘What brings you here?’\n\nGytha gave a nervous smile: ‘An inspection of the kingdom ahead of reforms, aunt. Your prefecture was the last remaining, so…,’ she sat opposite the pair of studying pink eyes:\n\n"

greneclyf_base.26.a:0 "‘Let us discuss the state of affairs’"

greneclyf_base.261.t:0 "A Sacred Place"
greneclyf_base.261.d:0 "Vixit brightened, elegantly arching an eyebrow. ‘It is gratifying to see such resolve. Well then, there are two pieces of news, and neither is good.’ The baroness laid printed lists on the table, the numbers on them steadily shrinking.\n\n‘Yields are falling? But why?’ Gytha asked.\n\n‘The experiments of the agrarians who lived in Brodfeld,’ Vixit drawled. ‘Failure after failure. Do not worry, my dear queen, I have already had them executed.’\n\n‘Wh—’ Gytha choked. ‘I-is that not too radical, dear baroness?’\n\n‘Not in the slightest. They placed us on the brink of famine that could cost thousands of lives through negligence. They were obliged to pay for it,’ the baroness’s face grew sterner. ‘Mistakes of this magnitude must never be forgiven, my monarch. I ask you to remember this throughout your reign.’\n\nA swarm of thoughts buzzed in Gytha’s head. On the one hoof, there was truth in Vixit’s words; on the other, execution for merely trying to help the country and failing?\n\nThe prefect set down her fan and lit a thin cigarette through a long holder. ‘Power is responsibility. And responsibility for a future tragedy lay with them. I will accept any punishment you deem fit for allowing this to happen, my queen.’\n\nGytha slammed her hooves on the table, shouting at her relative. ‘Enough! We live in a new age without aristocratic arbitrariness. The Supreme Judge is sitting in your corridor right now, shaping a system of law under which all are equal. I do not want to hear of any self-rule or extrajudicial reprisals again, Vixit!’ she snapped, trembling slightly.\n\nVixit said nothing, slowly drawing in the bluish smoke and placing another paper on the table—a drawn symbol. ‘And this is the second piece of news,’ she said with closed eyes. ‘The peasants claim a witches’ coven has settled in the Sacred Grove. Likely tales, but the guard found these symbols in several places across Llir. I will make efforts to identify them, though I suspect it is a waste of time. We simply need to calm the peasants that there is no blasphemy against Matrona in a holy place.’\n\nThe queen examined the curious symbol and tucked it among the other documents in her bag. The baroness opened her eyes again, looking at Gytha with respect and severity.\n\n‘If you wish to rule a truly new kingdom, first you must create it, Gytha.’"

greneclyf_base.261.a:0 "‘I will remain here, watching what you give us’"

greneclyf_base.27.t:0 "A Curious Order"
greneclyf_base.27.d:0 "‘#DESTROY AFTER READING#\n\nDear G. O. Gagat,\n\nthe services of your institution are required to ensure social and informational order within the kingdom. Payment will be made promptly. Participation in information campaigns is not subject to discussion. Await further instructions in similar envelopes marked by the Information and Propaganda Department of Her Majesty’s Chancellery.\n\nGlory to Greneclyf!’"

greneclyf_base.27.a:0 "The letter was swiftly burned"

greneclyf_base.28.t:0 "Matrona Loves Us"
greneclyf_base.28.d:0 "‘Praetor Actino,’ Gytha bowed before the elderly changeling, who inclined his head in return.\n\n‘Your Majesty, how heartening it is to see you today. May Matrona bless you—how may I help?’\n\n‘Praetor, my request is quite simple. I ask you to calm the citizens. Let the Church make them feel loved, warm them with Matrona’s grace.’\n\n‘Oh, Your Majesty, of course— the doors of the Church are always open to the suffering. Where Matrona’s temple stands, the word of great goodness will be heard.’\n\n‘Thank you. I will allocate some funding for the Church to organize free meals,’ Gytha reflected. ‘Perhaps you personally need anything, Actino?’\n\nThe old changeling merely shook his head.\n\n‘I need the peace of my flock, dear queen. My greatest joy and gift would be, before Matrona takes me to her, to remind even more drones of her love. Go in peace, and thank you for remembering Her word.’\n\nGytha departed in silence, fixing one thought in her mind: if—no, when—the crisis is overcome, she will appoint Actino cardinal of the Church and end the schism."

greneclyf_base.28.a:0 "‘Her foals are weak, but her strength is great’"

greneclyf_base.29.t:0 "The Queen Speaks"
greneclyf_base.29.d:0 "Numerous changelings from all walks of life stood before the Blosmport Palace, holding portraits of Gytha and chanting her name.\n\n‘What do you want?’ Apex Carrion asked loudly, looming over the demonstrators with armed Royal Guard soldiers.\n\n‘Let us speak to the queen! We guarantee we will not touch her with a hoof!’\n\n‘That’s right! We only want her to hear us!’ the crowd roared even louder, making the guards tense.\n\nCarrion stepped closer and shouted into the loudspeaker:\n\n‘Final warning! I order you to disperse immediately if you do not want blood to be shed here today! Go home!’\n\n‘Silence!’ The argument between prefect and crowd was cut short by Gytha herself as she stepped forward, meeting the eyes of the loudest among them as an equal.\n\n‘You wished to speak with me. Speak.’\n\nThe crowd stared at her in silence, as did Carrion, who instantly recovered and began scanning the assembly for snipers to protect Her Majesty if needed.\n\n‘Why have you fallen silent? Speak! Is this not what you wanted—an audience with your queen? Here I stand before you. SPEAK!’ Her commanding voice, reminiscent of Supreme Judge Oyren’s tone, made the crowd falter.\n\nThe shouter stared at her, then, stumbling, found his voice again. ‘A-and we will speak! And—well—here!’ He hastily pulled out a bundle and handed it to Gytha.\n\nShe unfolded it, read aloud before all, then let out a light, bell-like laugh. ‘Did you write these “popular demands” yourself? They sound incredibly Skynavian, I must note. Do you even understand a word of this?’\n\n‘Queen, we love you!’ someone cried from the crowd, others joining in, but Gytha stopped them with a hoof gesture, continuing to look at the shouter.\n\n‘Quiet, friends. Tell me instead, who put you up to this? The situation in the country is improving—you feel it yourselves. The entire Chancellery, the whole Eryahtas, is working at its limits, and you see the results. Yes, the process is not smooth. Yes, we had to adapt. But is this a reason to riot and cause trouble?’\n\nShe turned to the crowd. ‘So tell me, where did this idea of unrest come from?’\n\nTurning back to the shouter, she found only empty space where he had stood and allowed herself a faint smile.\n\n‘Very well, my little subjects, return to your homes. In a week we will hold a festival so you may see the solutions with your own eyes. I will be waiting for you there.’\n\nThe crowd dispersed amid pleased chatter, praising the queen, when Carrion, adjusting his monocle, approached her again.\n\n‘I am amazed. How did you manage that?’\n\nGytha smiled gently. ‘Just a little love, Apex. But for you and the Guard, I have a task.’"

greneclyf_base.29.a:0 "‘Shaw will convey all the details’"


