# Заседение комитета по обороне
greneclyf_forces.5.t:0 "Meeting of the Defense Committee"
greneclyf_forces.5.d:0 "At midday, the Defense Committee of Oireachtas gathered: senior military leaders, members of Parliament, and the Queen herself. A long and arduous debate lay ahead — one not to be resolved by royal decree alone, for the magnitude of this decision was too great.\n\nThe generals pressed for the introduction of universal conscription across the Kingdom. Lady Chief Justice Oiren called upon Aphex Carrion, Prefect of Blosmport and General of the Royal Guard. Carrion swept the chamber with a stern gaze and began: “Honorable Deputies. Your Majesty. We face a question of grave consequence: What should form the bedrock of our army? The answer is plain — we need a strong, disciplined, and numerous force built upon mandatory military service.\n\nFirst, the safety of the realm cannot rely on a handful of elite warriors. Wars are won by armies, not heroes. We must ensure thousands of trained hooves stand ready to defend our borders. Second, conscription shall forge a stronger nation. Military service is a school of discipline, unity, and civic spirit. One who serves becomes not merely a soldier, but a patriot, prepared to rise when the realm is in danger. We cannot entrust national defense to a narrow circle of chosen few. We need a nation under arms, not a court of privileged knights. I urge you to support the doctrine of a regular army and the establishment of mandatory conscription. Only thus can we guarantee our people’s safety and our Kingdom’s sovereignty.”\n\n“Your view is noted, Prefect. Your time,” Oiren concluded, striking the gavel. Carrion bowed and withdrew.\n\nNext, General of the Leib Guard Bermondt Latreau approached the podium. A striking figure in the black uniform of his regiment, insignias gleaming, he removed his peaked cap and raised it high in salute. “Honored Deputies. Beloved Queen. The world has changed, and so has war. This is no age of numbers, but of precision. The army of tomorrow is not made of masses, but of elite, highly trained, rapid-response units. They strike fast, strike true, and complete missions beyond the comprehension of ordinary infantry.\n\nElites bring results — measured, surgical, effective. A regular army is a lumbering mass that must be fed, clothed, armed; it burdens the kingdom’s bureaucracy and breeds corruption, mismanagement, and stagnation. Modern conflict is no longer about endless frontlines. It is special operations, sabotage, speed. Who is more suited: an elite who has trained for years, or a conscript barely able to hold a rifle? Discipline cannot be beaten into the unwilling. Within every conscripted herd lies the thug, the coward, the traitor. My doctrine leads to victory, not to wasteful loss.”\n\nWith both visions set before them, the chamber prepared to vote. The deciding voice belonged to Lord Shaw, who chose..."

greneclyf_forces.5.a:0 "Carrion's Doctrine of the Regular army"
greneclyf_forces.5.b:0 "Latreau’s Doctrine of the Elite army"

# Нарушитель
greneclyf_forces.6.t:0 "The Offender"
greneclyf_forces.6.d:0 "Dusk Lauri stood half-asleep in formation, weary after a sleepless night on sentry duty. Some recruit had thought it funny to raise a false alarm, throwing the entire camp into chaos. Suddenly, a modestly dressed commissar approached the platoon sergeant, dragging behind him a trembling youth. At a nod, he turned to the assembled troops. “Attention!” His voice cracked like a whip, snapping many awake. “Comrades-in-training! There is disorder in the regiment. Saboteurs sow confusion. And it is your duty, as seniors, to judge and correct this wayward soul — so that no one dares ever again to mock something as sacred as a combat alert. Count off: ones and twos.” The commissar ordered the conscripts to form two lines and handed out rifle cleaning rods to each. The soldiers exchanged nervous glances, uncertain. The trembling recruit’s knees buckled. “For depriving comrades of rest and staging a false alarm that, in real battle, could have gotten them killed, conscript Elen Bromum is hereby sentenced to 200 lashes by spießrute. The sentence is to be carried out immediately. Any who refuse will receive fifteen lashes themselves.” Bromum whimpered and staggered back, but the commissar kicked him forward. The others raised their rods, some hesitating, others resigned. Lauri paused. But then he remembered the sleepless night, the panic, the exhaustion. His grip tightened. Gritting his teeth, he struck a blow perhaps stronger than the rest. In time, soldiers began to see commissars not as wardens, but as senior comrades — stern, yes, but just. Hazing was eradicated, and the Code became the sacred manual of every recruit."
greneclyf_forces.6.a:0 "Honor and Conscience of the Nation"

# Псы войны
greneclyf_forces.7.t:0 "Dogs of War"
greneclyf_forces.7.d:0 "Orb Seller made quite an impression. While he puffed on his cigar and grinned like a wolf, Latreau remained composed and unreadable.\n\n“So,” the pony exhaled a cloud of smoke, “I assume you wanted to discuss something, Your Grace?” Latreau glanced at his watch. One minute had passed — it felt like an hour.\n\n“Yes. I’m aware of your company’s methods. I’ve seen what your soldiers become, and I find it logical to invite your professionals to train our future forces. We have lived in peace for too long. We need practitioners, not theorists.”\n\nSeller lowered his sunglasses, studying the general with curious eyes. “Ha. I thought you were planning a coup. But this? Low-priority contract, then. We can arrange it. But!” — he laid out the papers. “My fighters require constant deployment. They won’t sit idle training your rookies forever. They need to fight, as such is their nature.”\n\nLatreau raised an eyebrow as he reviewed the terms. “Are you not concerned that this rotation will prevent proper bonds between instructors and recruits?”\n\nSeller chuckled darkly. “And what if those bonds go rotten? Don’t worry. We know what we’re doing.”\n\nAfter a long pause, Latreau signed. For a moment, it felt like making a pact with a demon. Orb Seller smiled, as if reading his thoughts."
greneclyf_forces.7.a:0 "“We’ll Meet Again, General”"

# Мысли о божественном
greneclyf_forces.8.t:0 "Thoughts on the Divine"
greneclyf_forces.8.d:0 "The general once again found himself conversing with Seller, pacing slowly across the takeoff range while the pony watched him.\n\n“An idea, Seller,” Latreau began, “must live in the soul of every soldier. Even as a mercenary, you understand this better than most. So tell me — what idea can truly unite the Guard? Homeland? Family?”\n\nSeller flicked an ear. “I believe in war, Latreau. Homeland? That’s a flag that’ll abandon you the moment it’s convenient. Family? It doesn’t last. The Queen is mortal. War is a test — of your will and that of others, all beneath a greater Will. War is the final, absolute game. It turns existence into a single, unified truth.”\n\nLatreau paused, thoughtful. “That’s an ideal philosophy for a warhound — but not for a national army. We’re tied to Greneclyf. It is our home. We believe in the Queen... and in the Matron.”\n\nSeller raised an eyebrow. “The Matron?”\n\n“Our goddess. Lady Matron — the giver of love and protection. Our sacred guardian and patron.”\n\nThe head of the PMC tilted his head upward. “My god is War itself. But I see your point. Religion... can unite soldiers, if presented well. God is eternal. God is immortal. God does not betray.”\n\nLatreau allowed himself a rare smile."
greneclyf_forces.8.a:0 "“And God is with us”"

