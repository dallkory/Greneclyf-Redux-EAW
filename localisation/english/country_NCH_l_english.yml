  greneclyf_redux.N.a:0 ""


  greneclyf_redux.1.t:0 "A Foggy Evening"
  greneclyf_redux.1.d:0 "Гита медленно просматривала отчёты за прошлый год и старые газеты, чтобы иметь максимально точное представление, какую страну получила в свои копыта.\n\n«Луддиты, луддиты, луддиты... кажется, когда я была младше, то их не было так много, не так ли?», - королева с тоской глянула в окно, хмурясь на собирающиеся тучи.\n\n«Вероятно, такова цена прогресса. Какая там самая ранняя запись о появлении недовольных машинами? 90-е? Святая Матрона, я ведь была совсем крохой! Всего за одно поколение Энья смогла настолько радикально поменять облик общества...», - Гита задумчиво изучала появляющиеся на окне капли, размышляя, как старая страна совместного труда быстро сменилась разделенным обществом гильдий, мануфактур, элиты и бедняков.\n\n«Ваше Величество?» - зашёл в кабинет лорд-протектор королевства Базальт Шоу, неловко постучав копытом по открытой двери. «Что-то тяготит вас?»\n\n«По всей видимости, индустриализация – это не только благо. Я даже не думала, что станки из Грифонии отобрали такое огромное количество работы! И луддиты...»\n\n«Ваше слово, и стража займётся ими, леди Гита»\n\n«Нет. Ни в коем случае, они мои маленькие подданные, невинные и голодные рабочие, у которых отобрали способ реализоваться. Никакая сила не должна быть использована против страждущих. Мы отобрали у них работу – нам это и исправлять. Я... я что-нибудь точно придумаю на созыве Эряхтаса. Это наша первая и наиболее актуальная проблема», - решительно выпалила Гита, глаза которой бегали по строкам, говорящих о том, как безработица привела к богатству новых промышленников и обнищанию рядовых дронов. «Ты, кстати, для чего пришел? Какое-то дело?»\n\nШоу кивнул с нейтральным выражением лица. «Королевская гвардия. Как новый главнокомандующий, у меня есть некоторые концепты для модернизации нашей армии, но, поскольку вы упомянули Эряхтас, то там это и решится. Не смею вас больше тревожить,» - лорд-протектор было повернулся, чтобы уйти, но остановился, будто бы что-то вспомнил: «Её Превосходительство верховная судья Ойрен просила передать, что хотела бы встретить вас в библиотеке этим вечером. Что мне ей ответить?»\n\nГита переваривала мысль о том, что ей предстоит как-то участвовать в вопросах модернизации армии, пока знакомое имя не вывела её из транса: «Ойрен?» - лицо королевы слегка расслабилось"

  greneclyf_redux.1.a:0 "Я буду там. Передай ей снова взять с собой тот хиндийский чай"


  greneclyf_redux.2.t:0 "The Summoning of the Oireachtas"
  greneclyf_redux.2.d:0 "Both houses of parliament had gathered in the ancient building of the Blosmport Abbey, just as they and their predecessors had done for over 800 years. However, today's session was somewhat unusual: the Abbey, typically filled with shouting and aggressive debates during assemblies, was instead filled with excited whispers — until they were silenced by the loud strike of the gavel from Lady Chief Justice Oiren of Óir.\n\n“Order!” She took a deep breath and continued in her commanding manner: “The First Assembly of the Oireachtas under the blessed reign of Her Majesty Gytha of Leamhan is hereby declared open! The floor is given to the Monarch.”\n\nOiren directed her expectant and stern gaze at Gytha, yet only the queen, out of everyone in the hall, could see the softness and encouragement hidden within the expression of her sworn sister.\n\n“I... Ahem. I am pleased to welcome representatives of all estates of our glorious society under one roof for the first time. A new era is the beginning of history in the making, the seeds of which the Glorious Eithne nurtured with the sweat and blood of our nation throughout her life. The time has come to reap the fruits of her labors and multiply them, without disgracing the legacy of the late queen, and for that, I, and all of us, shall exert our utmost efforts! Much work lies ahead: bringing the Guard to a state worthy of the 11th century, our people cry out for the work that was taken from them by the looms, poverty has returned to the streets for the first time since the First Great Famine,”— Gytha continued, becoming slightly more impassioned — “Even the Abbey! The cardinals tear at each other for the right to interpret the Matron’s word; how have we come to this!?”\n\nThe queen’s eyes met Oiren’s once more, who subtly signaled to her the need to shift the direction of her speech.\n\n“But... but there are also things that, since the days of Eithne, function like Skyfall clocks—our new system of laws, whose Charter was written at the beginning of this century, and the introduction of the prefecture system, which has proven far more effective than the former feudal divisions. Today, as I expect, Prefect Carrion of our glorious capital will share his experience with the Oireachtas, after which we shall hear other opinions and questions, from which we shall collectively decide what path our nation must take. I sincerely thank you all.”\n\nThe representatives seated in the Abbey saw the queen off with applause as she returned to her place beside Oiren.\n\n“Well done,” the Lady Chief Justice whispered, allowing herself the faintest smile, before authoritatively calling out, as was custom, “Order!”\n\n“The floor is given to Aphex Carrion, Prefect of Blosmport.”\n\nA stately, tall changeling of noble bearing adjusted his monocle as he stepped toward the podium and, in a creaky voice, loudly responded:"

  greneclyf_redux.2.a:0 "“I thank you for this opportunity, Your Majesty Gytha, and Your Excellency Oiren.”"

  # Gytha Jorney #
  greneclyf_redux.3.t:0 "Начало пути"
  greneclyf_redux.3.d:0 "Префект Кэррион специально для сегодняшнего дня собрал часть городской стражи для проведения парада, чтобы показать Гите, как проходят дела в Блосмпорте. Генерал был крайне горд собой, вытягивая шею и оскалом улыбаясь марширующим гвардейцам.\n\nСегодня Гита не просто осматривала город, но объявила о начале королевского тура по всему острову, что префект решил отметить городским праздником. Подданные короны целыми семьями сновали от одного уличного торговца к другому, пока толпа с восторгом смотрела на офицеров и наслаждалась живой музыкой.\n\n«Как вам парад, Ваше Величество?» - спросил Кэррион Гиту, машущую копытом толпе.\n\n«Должна признать», - начала она – «То, как обновился Блосмпорт со времён моего детства – просто поражает воображение. Когда я была жеребенком, то на нашей пристани были лишь деревянные лодки, и посмотри на неё сегодня – это целая верфь, где меня ждёт наш первый корабль!»\n\nКэррион поправил монокль, одобрительно оглядывая стального левиафана. «Да, Её Величество Энья действительно великая, что смогла познакомить наш народ с этими чудесами. Но вынужден предупредить, моя Королева, другие части нашего нации...не столь продвинуты. Быть может, вас даже ждёт шок от того, насколько разительно отличаются столица и другие места страны» - произнес Кэррион, хмуря брови.\n\nГита пожала плечами – «Что ж, тогда я это и увижу, префект. В конце концов, это мне вытягивать нашу страну на совершенно новый уровень, а не кому-то другому. И я к этому готова»\n\nПрефект еле заметно улыбнулся, явно наслаждаясь силой воли королевы. Может быть она и наивна, но в ней явно есть потенциал для великих дел при более прагматичном подходе."

  greneclyf_redux.3.a:0 "«Желаю удачи в пути, Ваше Величество»"

  greneclyf_redux.4.t:0 "Вне Золотой Клетки"
  greneclyf_redux.4.d:0 "Впервые оказавшись в Эйслинге, Гита удивленно ахнула, пока сходила по тропу с корабля. Это тоже её страна? Это захолустье?\n\nИз мыслей её вывела скромно организованная церемония приветствия, которая сразу наполнила её сердце радостью, когда она увидела своих чумазых подданных, счастливо приветствующих королеву. Центральной фигурой среди них был рослый чейнджлинг с серьезным выражением лица, которое сразу приняло вид усталой улыбки при виде двух самых важных фигур в королевстве.\n\n«Ваше Величество, Ваше Превосходительство – да осветит мудрость Матроны ваши пути», - чейнджлинг низко полконился.\n\«Рада видеть тебя, претор Онихион. Или ты предпочитаешь, когда тебя зовут по светской должности префекта?», - спросила его Ойрен.\n\nГита изучала фигуру: «Онихион? Вы так...постарели с того момента, как мы виделись последний раз. Мне трудно поверить, что вы тот же чейнджлинг, который проводил с нами обряд посвящения годы назад»\n\n«Время течет, моя Королева. Теперь столичный претор и наиболее вероятный кардинал – это Актино. Я же нашёл свою силу в служении здесь, где я нужен нашим братьям и сёстрам по вере как префект, не только как духовное лицо», - Онихион перевёл глаза на жителей Эйслинга.\n\nСледующие пару дней Гита и Ойрен провели на практике изучая, как выглядит жизнь в этом крае. Ежедневные беседы с Онихионом открывали глаза на то, насколько неравно распределилась модернизация острова: некоторые чейнджлинги здесь даже не умеют читать, а грамотная работа чиновников началась только при Энье с назначением священника префектом.\n\nПопрощавшись с Эйслингом, королева и сопровождающие её особы отправились в дальнейший пункт назначения"

  greneclyf_redux.4.a:0 "Жукомир ждёт!"

  greneclyf_redux.5.t:0 "Стальной город"
  greneclyf_redux.5.d:0 "Когда Гита появилась в Жукомире, картина города оказалась для неё совершенно неожиданной: посреди площади толпа окружила плотную чейнджлинга, которая, потея, просила всех успокоиться. Увидев королеву, её глаза округлились, и она снова заговорила в микрофон: «Ваше Величество! Жукомир приветствует вас!»\n\nТолпа замерла, поворачиваясь на 180 градусов, и устремляя глаза на Гиту. Она неловко улыбнулась, помахав своим подданным, и через несколько минут они начали заваливать её бесконечными жалобами: «Королева, у нас отняли работу!», «Нам становится не на что есть, ваше Величество!», «Матрона, помилуй нас!».\n\nВперёд ошалевшей Гиты сделала шаг Ойрен, громко крикнув в толпу «ПОРЯДОК!», заткнув подданных. «Я так понимаю, мой родной улей переживает не лучшие дни. Что ж, возрадуйтесь – с инспекцией прибыла не только Её Величество, но и ваша Верховная Судья, и я с радостью выслушаю ваши претензии, чтобы определить курс действий далее. И наш уважаемый префект Берилла мне в этом посодействует, не так ли?» - Ойрен оскалилась на нервно сглатывающую чиновницу посреди площади.\n\nВ течение следующих нескольких дней королева и верховная судья проводили инспекции мануфактур и шахт, то и дело слушая о рабочей ситуации от рабочих, владельцев фабрик, префектов, шахтеров и даже от луддитов, с лидером которых Гита выпила чай под строгим взглядом лорда Шоу.\n\nВозможно, по Ойрен не было это видно, но её сердце пребывало в печали от зрелища того, чем стал её дом. Базальт ощутил её скорбь, взвалив на себя часть дел и общение с гражданами, помогая судье избежать тоски.\n\nКогда Берилла и представители самых разных сословий города проводили первых лиц государства, в сердце каждого из них зарождалась надежда, что именно Гите под силу исправить кризисную ситуацию не только дошедшего до трущоб Жукомира, но и всего королевства."

  greneclyf_redux.5.a:0 "Гул поезда удалялся от города..."

  greneclyf_redux.6.t:0 "Дорога домой"
  greneclyf_redux.6.d:0 "«Я всё ещё удивлена, что для обеспечения безопасности ты взяла только Базальта и пару гвардейцев, Гита» - фыркнула Ойрен, глядя из окна локомотива на леса Гринклифа. «Как видишь, жизнь дронов далека от идеала, и всего одного озлобленного фанатика хватит, чтобы устроить этой стране такой кризис, который ей и не снился»\n\nГита в ответ лишь улыбнулась, читая один из документов из Эйслинг : «Ойрен, я ценю обеспокоенность, но я уверена, что мои подданные не будут пытаться убить меня. Я не боюсь их, я люблю каждого из них и хочу, чтобы они это видели. К тому же, даже если среди них и объявится некий...особый элемент, то наш неустанный лорд-протектор вмиг с ним разделается!»\n\nЛицо Ойрен омрачила тень неуверенности, пока она думала, что ответить. В конце концов, она лишь громко выдохнула\n\n«Гита...помнишь дронов из Эйслинга? Пока ты разговаривала с Онихионом об их жизни, я побеседовала с молодёжью – безграмотность поголовная. Образовательная система не справляется, нас теперь слишком много»\n\n«Добавь это в список наших проблем, которые предстоит решить» - горько усмехнулась Гита. «Или вспомни, как теперь выглядит Жукомир... Мне жаль видеть, чем он стал. Подумать только, некогда первый город нашего народа стал пыльным бетонным мешком»\n\nОйрен вздохнула, впервые открыто показав грусть по состоянию своего родного улья, отреченно глянув в окно.\n\n«Я рада, что ты рядом, Ойрен. Это правда много для меня значит» - сказала королева.\n\n«Я знаю. Мы и так неразлучны с детства, даже в королевской мантии ты от меня не отвяжишься, Леманка» - слабо ухмыльнулась судья.\n\n«Да...» – мечтательно протянула Гита, поудобнее располагаясь рядом и прикрывая глаза от усталости – «и пусть так будет вечно»\n\nОйрен чуть улыбнулась, после чего снова глянула в окно на активно заходящее солнце и погрузилась в мысли о том, что она любой ценой поможет сопящей рядом королевской особе достигнуть того, чтобы в Гринклифе было приятно жить."

  greneclyf_redux.6.a:0 "«Спи спокойно, ты заслужила немного отдыха»"

  greneclyf_redux.7.t:0 "Отчет выпускников 277"
  greneclyf_redux.7.d:0 "«### Совершенно секретно, исключительно для глаз Её Величества», – Гита поморщилась от официоза, но продолжила читать желтый пергамент.\n\nЧерез некоторое время она мягко положила лист своим рогом на стол, задумавшись. Выходит, рынок не регулирует себя сам, и республиканцы Кемерская ошибались, а иногда государственное вмешательство – это не так уж и плохо?\n\n«Этот Бикколини – определенно эксцентричен, но что-то в этом есть», – протянула Гита, разглядывая привезенного из Депонии паука в стекле."

  greneclyf_redux.7.a:0 "«Возможно, нам следует адаптировать часть его методов»"

  greneclyf_redux.8.t:0 "The Apartment of the Future"
  greneclyf_redux.8.d:0 "When the time came to present her project, the blue-eyed changeling beamed from ear to ear and greeted the queen with a strong Aquileian accent:\n\n"Bonjour, Votre Majesté! I am absolutely delighted to present to you a miniature model of a dwelling that, in the future, will be found in every corner of our glorious homeland — affordable, practical, and adorable, oui!" the young architect chirped, nearly bouncing in excitement.\n\n"Miss Xylocopa Valga, to the point," Oiren scoffed skeptically.\n\n"Oui, oui! Please!" Valga used her magic to lift the velvet cloth, revealing a small-scale model of a building. Gytha stepped closer, examining it.\n\n"What... is this, dear Valga?" asked Gytha.\n\n"This, Your Majesty, is what in Aquileia is called construction modulaire. The idea is that such a building is not constructed on-site but assembled from prefabricated panel blocks, manufactured in advance at factories! The cost savings are simply incredible, and look!" Xylocopa moved closer, eyes shining with excitement, and lifted the model’s roof, revealing the interior layout.\n\n"Here, here, ma Reine, do you see? This space is fully optimized to make it as convenient as possible for future residents to handle all household tasks. Do you realize how many miles the average housewife walks while cooking stew and tending to her offspring? Naturally, it’s exhausting — but not in this kind of home, where everything is within reach," she laid down a blueprint, showcasing the typical apartment layout.\n\n"The space seems quite small. I’d even say it’s bordering on uncomfortable," Lady Chief Justice noted. "Are you sure this isn’t too extreme?"\n\n"Non, non, non, not at all! Everything is carefully calculated. Not only did I defend my thesis on this topic, but I also lived in a similar building myself. This is called rational economy, precisely what our island needs in these difficult times," Xylocopa flashed another dazzling smile.\n\nAfter a brief discussion and a nod from Oiren, Gytha gave her answer:"

  greneclyf_redux.8.a:0 "«Miss Valga, congratulations — your project is approved.»"

  greneclyf_redux.10.t:0 "Reality Strikes "
  greneclyf_redux.10.d:0 ""I beg your pardon, could you repeat that?" Gytha asked her Lord Protector, her eye twitching.\n\n"Famine, Your Majesty. Farbrook had an unfortunate fishing season. We had hoped to purchase what we lacked from Bakara, but the River Coalition’s tariffs are beyond what our treasury can afford. I fear the country stands on the brink of what happened 800 years ago..."\n\nGytha slammed her hooves on the table, huffing angrily. "We still have time! There’s still room to maneuver! Shaw, summon the Oireachtas immediately! Bring Oiren!"\n\nBasalt nodded, grasping the gravity of the situation, and with a curt bow, he rushed to contact the kingdom’s key officials.\n\nGytha collapsed into her chair, staring at her trembling hooves. She knew what famine was. The entire island had learned the lesson of the First Great Famine 800 years ago, ensuring that future generations would never forget the horrific images of emaciated drones, devouring each other with disgust in their eyes. The mere thought of it made her tear up, gasping for breath in rising panic — until she forced herself to take a deep inhale and exhale.\n\n"I will not let this horror happen again. No matter the cost, my little subjects will not witness a second nightmare.""

  greneclyf_redux.10.a:0 "«Or I am no queen of Clann Leamhan!» («The Second Great Famine has begun...»)"
  greneclyf_redux.10.b:0 "§R«Perhaps giving up isn't the worst option?»"

  greneclyf_redux.9.t:0 "Время смотреть дальше"
  greneclyf_redux.9.d:0 ""

  greneclyf_redux.9.a:0 ""

  greneclyf_redux.16.t:0 "Sin Zone"
  greneclyf_redux.16.d:0 "After signing countless bondage contracts and agreements, Gita stopped at the last one, looking at the river capital representative as if she had just told her the most unfunny joke in a long time.\n\n“A gambling zone? What does that even mean?” - The queen cast a questioning glance at the rumpled Bakara pony.\n\n“You see, Your Majesty,” she coughed and spoke cautiously, ”in many riverlands countries, casinos are banned or uncontrolled, becoming breeding grounds for various rabble. And so... my patrons suggest that you open the first legal casino in Saora, where money from all the lands would flow.”\n\nOnychion, attending the meeting as the prefect of Aisling, jumped up in anger.“Do you want to open this hotbed of fornication and sin in our religious country?” - he bellowed, staring at the trade representative, who squirmed even harder in her chair.\n\n“Your Majesty, even as a representative of the schismatics, I cannot approve of this in any way. It's disgusting!”\n\n“And you think I don't know?!” - Gita herself already shouted back angrily, slapping her hoof on the table. - “Spare me the words about Matron, Onychion, our people might get to the point of eating each other! What will they feed on! Your speeches?!” - she added sharply, sinking back into her chair again.\n\n“E-if I may...” - nervously raised the spokeswoman's hoof, smiling strainedly. - “Your treasury will get a lot of money from the fees, I guarantee the demand will be huge. Yes, yes, it will also increase the investment appeal for tourism!”\n\nOnychion looked like a frustrated child and exhaled heavily. Meanwhile, Gita authorized the business opening with a quick stroke of her pen and then looked up sharply at the pony.\n\n“What's your name?”\n\n“S-Sweet Sprinkle,” she corrected her glasses, stammering.\n\n“Now, Ms. Sprinkle, for everything that happens in Saora, you will be accountable to me personally. Is that clear? Dismissed.”\n\nThe queen turned away, clearly unwilling to continue the conversation.The Bakarka's eyes rounded. She bowed briefly, turned and hurried out, closing the door carefully behind her."

  greneclyf_redux.16.a:0 "«I'm just a broker...»"

  greneclyf_redux.17.t:0 "Bored Captain"
  greneclyf_redux.17.d:0 "The caped pony grinned as he noticed Her Majesty's Lord Protector approaching him. He finished his cider, removed his headdress, and nodded affably.\n\n“Lord Protector! It is a great honor to meet you. What can I do for you?”Basalt looked him over skeptically, but got to the point nonetheless:\n\n“Greetings, Captain Butler. I'm here on behalf of Her Excellency the Chief Justice. She wants to know why the ORC sent her police regiment here instead of relying on the Guard.”The captain's smile faded slightly.\n\n“To be honest, lord, they just don't trust you,” he pronounced, looking at the changeling. - “The formal reason is to ensure the safety of all international guests and other vague wording. But at its core, it's all about trust. Well, the lack of it, yee-haw, yee-haw.”\n\n“You are... quite frank, Captain. While that deserves respect, the situation itself is depressing.”\n\nThe pony nodded understandingly, looking lazily over the croup of passing citizens, then looked at Lord Shaw again.\n\n“Your nobility, I'll be honest: I don't give a damn about politics. I have three passions in my life - booze, mares, and military prowess. All three things I can easily find here. And I offer you, as a representative of the latter, friendship. I respect you as an officer respects a commander-in-chief, and I guarantee that I will keep you in the dark from the General Staff about what's going on in Saora. Unless, of course, you interfere in the affairs of the zone directly - so as not to scare off the peddlers, ee hee hee. Agreed?”\n\nThe pony grinned again, but Shaw saw no threat in that grin. He was more of a mischievous colt, eager to do a little mischief to his superiors for reasons unknown to him.\n\nBasalt exhaled.\n\n“Well, since the only alternative is for the Guard to storm this so-called zone and sever ties with the Coalition, I have no choice. But I expect the utmost honesty, Captain.”"

  greneclyf_redux.17.a:0 "«From now on, there will be both overt and covert law here»"
  
  greneclyf_redux.700.t:0 "Капля чернил, что меняет мир"
  greneclyf_redux.700.d:0 "«Странное же ты выбрал место, Гагат», – произнёс Шоу, осматривая то, что некогда было пекарским цехом, а теперь превратилось в рупор королевства под названием «типография». Он слегка поморщился, оценивая обстановку: запах теста ещё висел в воздухе, а старые деревянные балки создавали атмосферу чего-то устаревшего и неприспособленного к амбициозным планам.\n\nПолный чейнджлинг, пыхтя сигарой, смотрел на здание с зачарованными глазами, и только с задержкой услышав лорда-протектора короны, ответил: «Базальт, какая разница, где она находится? Это же будущее, понимаешь? Это не просто золотая жила, это настоящий способ формировать мнение населения!» Гагат начал заливаться блаженным смехом, так сильно, что даже слёзы полились из его глаз, но он не мог остановиться.\n\n«А ты, я вижу, горишь идеей. Хорошо, что Баронесса Виксит любит инновации, и тебе повезло найти у неё покровительство», – добавил он, тщательно изучая здания вокруг. «Двор подумывает создать новое отделение по работе с населением. Быть может, я его даже возглавлю. Так что, дружище, мы будем поддерживать контакт и по поводу материалов печати.»\n\nГагат расплылся в улыбке. «Ну разумеется! Знал бы ты, как внутренний жеребёнок во мне сейчас радуется! Я ведь прилагаю своё копыто к чему-то действительно великому, будучи директором первой типографии в стране» – он сделал очередную глубокую затяжку, крикнув рабочим, чтобы они бережнее несли печатные станки.\n\nШоу удовлетворился процессом, заполнив со своим старым товарищем бумаги, после чего спросил Гагата: «А как ты назовешь газету?»\n\nГагат подошел к Базальту, медленно проведя копытом в воздухе:"

  greneclyf_redux.700.a:0 "«Crónán na Fírinne»  (прим. «Глашатай Правды»)"

  greneclyf_redux.26.t:0 "Святое место"
  greneclyf_redux.26.d:0 "По пути в Ллир Гита заметно нервничала. Когда она была маленькой, то чуть не сорвала там своё посвящение в церковь Матроны, чихнув на священника. От одного только воспоминания его взгляда и звонкого хохота её тётушки щёки Гиты порозовели, и она вышла в тамбур поезда, чтобы проветрить голову\n\nБазальт Шоу также стоял там, читая зашифрованное сообщение о статусе безопасности в регионе, и, не отрывая глаз, произнёс: «Нервничаете, госпожа?»\n\nГита вздохнула, с поражением ответив: «Я уже монарх, но всё равно до сих пор боюсь смеха Виксит. И надо было Энье утверждать её префектом?»\n\nШоу задумчиво ответил: «Если я помню верно, то эта ветвь вашего рода Леманн владеет этими землями практически с момента экспедиции Улисса века назад. Ничего удивительного, что префектом избрана одна из ваших родственниц.»\n\n«Да, да... всезнайка» — надулась королева.\n\nПосле прибытия первых лиц государства сопроводили расшито одетые стражники мимо обширных полей, на которых работали крестьяне, до большого белого особняка. Со стороны казалось, что это скорее феодальная вотчина с рабами, но в действительности сам город — аграрный центр королевства — был расположен чуть ниже. Особняк же представлял собой одновременно администрацию и место жительства его префекта — баронессы Виксит дома Леманн, известную своей эксцентричностью и любовью к изобретениям. Внутри здания Гита попросила свою свиту подождать её, отправившись на разговор с баронессой одна через странные механические двери.\n\n«Давно же я не видела твою очаровательную мордочку, душенька», — бархатисто произнесла худая чейнджлинг с нехарактерными для дома Леманн длинными чёрными волосами, лицо которой закрывал красный расшитый веер из Кирии. «Какими судьбами?»\n\nГита нервно усмехнулась: «Проверка королевства перед началом реформ, тётушка. Ваша префектура осталась последней, так что...» — Гита села напротив пары изучающих её розовых глаз — «давайте обсудим, какова наша ситуация».\n\n"

  greneclyf_redux.26.a:0 "Следующая страница"

  greneclyf_redux.30.t:0 "Святое место"
  greneclyf_redux.30.d:0 "Виксит оживилась, изящно изогнув брови: «Отрадно видеть такой настрой. Что же, новостей две, и обе не хорошие». Баронесса положила на стол распечатанные списки, числа в которых становились всё меньше и меньше.\n\n«Урожайность падает? Но почему?» — спросила Гита.\n\n«Эксперименты аграриев, живших в Бродфельде», — протянула Виксит. «Провал за провалом. Не волнуйся, моя дорогая королева, я уже казнила их».\n\n«Ка-» — поперхнулась Гита. «Н-не слишком ли радикально, дорогая баронесса?»\n\n«Ни в коем случае. Они поставили нас перед лицом голода, который может повлечь тысячи смертей из-за безалаберности. И они обязаны были отплатить», — лицо баронессы стало суровее. — «Ошибки такого масштаба никогда не должны прощаться, мой монарх. Прошу вас помнить об этом всё ваше правление».\n\nРой мыслей шумел в голове Гиты: с одной стороны, в словах Виксит есть доля истины, но с другой — казнь за то, что они просто хотели помочь стране и провалились?\n\nПрефект положила веер, закурив через длинный мундштук тонкую сигарету. «Власть — это ответственность. И ответственность за будущую трагедию лежит на них. Я понесу любое ваше наказание за то, что допустила это, моя королева».\n\nГита сильно ударила копытами по столу, крикнув на свою родственницу: «Прекрати! Мы живём в новом времени, где нет дворянского произвола — у тебя в коридоре сидит верховная судья, которая формирует нам систему закона, перед которым равны все! Чтобы больше я не слышала ни про какое самоуправство и внесудебные расправы, Виксит!» — выпалила Гита, слегка трясясь.\n\nВиксит ничего не ответила, медленно втягивая сизый дым сигареты и кладя на стол ещё одну бумагу — некий нарисованный символ. «А это вторая новость», — произнесла она с закрытыми глазами. «Крестьяне говорят, что в Святой Роще поселился шабаш ведьм. Байки, вероятно, но стража нашла эти символы в некоторых местах по всему Ллиру. Я приложу усилия для выявления, но, сдаётся мне, это трата времени. Просто нужно успокоить крестьян, что в святом месте нет хулы на Матрону».\n\nКоролева рассмотрела причудливый символ, забрав его к остальным документам в свою сумку. Баронесса вновь открыла глаза, смотря на Гиту с уважением и строгостью.\n\n«Если ты хочешь править действительно новым королевством, то сначала создай его, Гити»."

  greneclyf_redux.30.a:0 "«Я буду здесь, наблюдать за тем, что ты дашь нам»"
  # A Foggy Evening
  greneclyf_redux.1.title:0 "A Foggy Evening"
  greneclyf_redux.1.desc:0 "Gytha slowly browsed through last year's reports and old newspapers, striving to get the most accurate understanding of the country she had inherited.\n\n\"Luddites, Luddites, Luddites... It feels like there weren't nearly as many of them when I was younger, were there?\" The queen gazed wistfully out the window, frowning at the gathering storm clouds.\n\n\"Perhaps that is the price of progress. What's the earliest record of people protesting against machines? The '90s? Holy Matron, I was but a tiny grub back then! In just a single generation, Eithne managed to change the face of society so radically...\" Gytha studied the raindrops forming on the glass, reflecting on how the old nation of shared labor had swiftly transformed into a divided society of guilds, manufactories, elites, and paupers."
  greneclyf_redux.1.a:0 "I will be there. Tell her to bring that Hindian tea again."

  # The Journey Begins
  greneclyf_redux.2.title:0 "The Journey Begins"
  greneclyf_redux.2.desc:0 "For this special occasion, Prefect Carrion had assembled part of the city guard to hold a parade, showcasing the state of affairs in Blosmport. The general was immensely proud of himself, stretching his neck and grinning at the marching guardsmen.\n\nToday, Gytha was not merely observing the city --- she was announcing the beginning of a royal tour across the entire island, a momentous event that the prefect had decided to mark with a grand display. Subjects of the crown bustled through the streets with their families, darting from one street vendor to another, while the crowd gazed in delight at the officers and reveled in the live music.\n\n\"How do you find the parade, Your Majesty?\" Carrion asked as Gytha waved a hoof at the gathered crowd.\n\n\"I must admit,\" she began, \"the way Blosmport has transformed since my foalhood is simply breathtaking. When I was a filly, our docks had nothing but wooden boats, and now look at it --- an entire shipyard, where our first vessel awaits me! Ours, not one we had to buy!\"\n\nCarrion adjusted his monocle, glancing approvingly at the steel leviathan.\n\n\"Yes, Her Majesty Eithne was truly great to have introduced our people to such marvels. But I must warn you, my queen --- other parts of our nation... are not as advanced. You may even find yourself shocked by how starkly the capital differs from the rest of the country,\" Carrion said, furrowing his brow.\n\nGytha shrugged. \"Well, then I shall see it for myself, Prefect. After all, it is I who must pull this nation into an entirely new era, not someone else. And I am ready for it.\"\n\nThe prefect gave a barely perceptible smile, clearly impressed by the queen's resolve. Perhaps she was naïve, but she undoubtedly carried the potential for great deeds --- if tempered with a more pragmatic approach."
  greneclyf_redux.2.a:0 "I wish you luck on your journey, Your Majesty."

  # Beyond the Golden Cage
  greneclyf_redux.3.title:0 "Beyond the Golden Cage"
  greneclyf_redux.3.desc:0 "Setting hoof in Aisling for the first time, Gytha let out a surprised gasp as she descended the gangplank. Was this truly her country? This backwater?\n\nHer thoughts were quickly interrupted by a modestly arranged welcoming ceremony, which instantly filled her heart with warmth as she saw her soot-covered miner subjects happily greeting their queen. The central figure among them was a tall changeling with a stern expression, which softened into a weary smile upon seeing the two most important figures in the kingdom.\n\n\"Your Majesty, Your Excellency --- may the wisdom of the Matron light your path,\" the changeling said, bowing deeply.\n\n\"It is good to see you, Praetor Onychion. Or do you prefer your secular title of Prefect?\" Oiren asked.\n\nGytha studied his figure. \"Onychion? You have... aged so much since we last met. It is hard to believe you are the same changeling who guided us through our initiation rites years ago.\"\n\n\"Time flows, my queen. The capital's praetor and likely next cardinal is Aktis now. As for me, I found my strength in serving here, where I am needed by our brothers and sisters in faith---not only as a priest but as a prefect,\" Onychion said, glancing at the people of Aisling.\n\nFor the next few days, Gytha and Oiren engaged in practical studies of daily life in the region. Their conversations with Onychion opened their eyes to how unevenly modernization had spread across the island---some changelings here could not even read, and the proper work of civil officials had only begun under Eithne when she appointed a priest as prefect.\n\nBidding farewell to Aisling, the queen and her entourage set forth to their next destination."
  greneclyf_redux.3.a:0 "Bugsmere awaits!"

  # The Steel City
  greneclyf_redux.4.title:0 "The Steel City"
  greneclyf_redux.4.desc:0 "Upon arriving in Bugsmere, Gytha was met with an utterly unexpected sight: in the middle of the town square, a dense crowd had gathered around a sweating changeling, who was desperately trying to calm them down. The moment the official spotted the queen, her eyes widened in shock before she quickly spoke into the microphone again:\n\n\"Your Majesty! Bugsmere welcomes you!\"\n\nThe crowd fell silent, collectively turning 180 degrees to face Gytha. She offered an awkward smile and waved at her subjects. Within moments, they began bombarding her with endless grievances:\n\n*\"Your Majesty, they have taken our jobs!\"*\n*\"We are running out of food!\"*\n*\"Matron, have mercy on us!\"*\n\nBefore the bewildered Gytha could react, Oiren stepped forward and bellowed:\n\n\"ORDER!\"\n\nThe crowd instantly fell quiet.\n\n\"I take it my home hive is not seeing its finest days,\" Oiren said, her voice calm yet firm. \"Rejoice, then --- for not only has Her Majesty arrived to inspect the situation, but so has your Lady Chief Justice. I shall gladly hear your grievances to determine the course of action moving forward. And our esteemed Prefect Berilla will assist me in this, will she not?\"\n\nOiren grinned, baring her teeth at the visibly nervous official standing in the square.\n\nFor the next few days, the Queen and the Lady Chief Justice conducted thorough inspections of Bugsmere's manufactories and mines. They listened to workers, factory owners, the prefect, miners, and even the Luddites, with whose leader Gytha shared a cup of tea --- under the watchful eye of her loyal Lord Protector, Basalt Shaw.\n\nOiren's expression betrayed nothing, but her heart ached at the sight of what had become of the House of Óir's homeland. Basalt sensed her sorrow, taking on part of the responsibilities and speaking to the citizens in her stead to shield her from dwelling too deeply in grief.\n\nOne evening, the Lady Chief Justice visited her ancestral estate. The same respectfully bowing butler, the same lavishly adorned walls, and the same sense of order amid chaos greeted her.\n\n\"Oirie, is that you?\" a noblemare's aged voice inquired from beside the fireplace. Her eyes opened, revealing the familiar milky haze of blindness.\n\n\"Yes, Mother... It has been a long time,\" Oiren replied, approaching her forebear. She sat beside her, allowing the elderly matriarch to embrace her daughter. After a moment of silence, Oiren spoke again:\n\n\"How fares our house, Mother?\"\n\nThe old noblemare furrowed her brow slightly, as if recalling recent events.\n\n\"They deceive, as they always do. The elders still care for nothing but wealth and pleasure, while the young refuse to grow wise. Only your nephew, Cyanite, seems to be making something of himself --- he is working his way into the prefecture, trying to serve the city,\" she said before taking a sip of her pungent herbal tonic. Then, turning her sightless gaze toward her daughter, she continued:\n\n\"You two are the last hopes for true change in this family, Oiren. Your grandmother's rule shattered the balance, and now we are either corrupted, like Isovius --- no doubt spoiling city mares as we speak...\" She let out a bitter chuckle before sighing. \"Or we are the noble hope of our great family, like you and Cyanite. What a shame that it is Gytha who wears the crown, and not you, my beloved.\"\n\nA single tear traced its way down Oiren's face.\n\nThe following morning, as a nervously chattering Berilla and representatives of various social classes bid farewell to the kingdom's leaders, hope for change took root in their hearts. The new generation of rulers had come --- not to erase Eithne's reforms, but to tame them and steer the nation in the right direction."
  greneclyf_redux.4.a:0 "The hum of the departing train faded into the distance..."

  # The Sacred Place
  greneclyf_redux.5.title:0 "The Sacred Place"
  greneclyf_redux.5.desc:0 "On the way to Llŷr, Gytha was noticeably anxious. As a filly, she had nearly ruined her own Matronal church dedication there by sneezing on the priest. Just remembering his stern gaze --- and the ringing laughter of her aunt --- was enough to bring a flush to her cheeks. She stepped out into the train vestibule to clear her head.\n\nBasalt Shaw was there as well, reading a ciphered report on regional security. Without lifting his eyes, he remarked, \"Nervous, my lady?\"\n\nGytha sighed in resignation. \"I may be a monarch, but I still dread Wicksite's laughter. Did Eithne really have to make her prefect?\"\n\nShaw replied thoughtfully, \"If I recall correctly, this branch of the Clann Leamhan has held these lands since Ulysses' expedition centuries ago. It is hardly surprising that one of your relatives was chosen as prefect.\"\n\n\"Yes, yes... know-it-all,\" the queen grumbled.\n\nUpon their arrival, the kingdom's dignitaries were escorted past vast fields, where peasants labored under the sun, toward a grand white manor. From a distance, it resembled a feudal estate with serfs, but in truth, the city --- the kingdom's agricultural heart --- was situated just below. The manor itself served as both the administrative hub and the residence of its eccentric prefect, Baroness Wicksite of the Clann Leamhan, known for her love of inventions.\n\nInside, Gytha instructed her retinue to wait, choosing to meet the baroness alone beyond a set of strange mechanical doors.\n\n\"It has been far too long since I last saw your charming little face, darling,\" purred a slender changeling with uncharacteristically long black hair for a scion of the Clann Leamhan. A red, embroidered fan from Kiria concealed half of her face. \"To what do I owe the pleasure?\"\n\nGytha let out a nervous chuckle. \"A kingdom-wide inspection before the reforms, Auntie. Your prefecture is the last on my list, so...\" She sat across from the pair of keen pink eyes scrutinizing her. \"Let's discuss our situation.\"\n\nWicksite perked up, elegantly arching a brow. \"Ah, a welcome attitude. Well then, I have two pieces of news --- both bad.\" She slid a stack of printed records across the table, the numbers dwindling with each successive page.\n\n\"Crop yields are declining? But why?\" Gytha asked.\n\n\"Agricultural experiments by those fools who studied in Brodfeld,\" Wicksite drawled. \"Failure after failure. But do not worry, my dear queen --- I have already executed them.\"\n\n\"Wha---\" Gytha choked. \"I-Isn't that a bit extreme, Baroness?\"\n\n\"Not in the slightest,\" Wicksite said coolly. \"They placed us on the brink of famine, which could lead to thousands of deaths due to their negligence. They had to pay the price.\" Her face hardened. \"Mistakes of such magnitude must never be forgiven, my monarch. I ask that you remember this throughout your reign.\"\n\nA storm of thoughts roiled in Gytha's mind. On one hand, Wicksite's logic had some merit --- but on the other, execution for failure? These changelings had simply tried to help and failed.\n\nThe prefect set down her fan and lit a slim cigarette with a long holder. \"Power comes with responsibility. And responsibility for a future tragedy lay on them. I will accept whatever punishment you decree for allowing this, my queen.\"\n\nGytha slammed her hooves on the table, shouting at her relative, \"Enough! We live in a new era, where noble whim no longer dictates justice! The Lady Chief Justice herself sits just outside that door, working to build a legal system where all are equal before the law! I had better not hear of any more vigilante executions, Wicksite!\"\n\nThe baroness said nothing. She simply exhaled a plume of smoke and slid another paper onto the table --- a hand-drawn symbol.\n\n\"And this is the second piece of news,\" she murmured, closing her eyes. \"The peasants whisper of a witch coven settling in the Sacred Grove. Likely just folklore, but my guards have discovered these symbols scattered throughout Llŷr. I will see to an investigation, but I suspect it will be a waste of time. All that truly matters is calming the peasants --- reassuring them that no blasphemy lurks in our holy land.\"\n\nGytha examined the peculiar sigil before tucking it away with the other documents in her satchel.\n\nWicksite opened her eyes again, watching the queen with a mix of respect and severity.\n\n\"If you wish to rule a truly new kingdom, Gytha... then you must first build it.\"\n\n\"I will be here,\" she said, taking another drag of her cigarette."
  greneclyf_redux.5.a:0 "watching to see what you bring us."

  # The Road Home
  greneclyf_redux.6.title:0 "The Road Home"
  greneclyf_redux.6.desc:0 "\"I'm still surprised that for security, you only took Basalt and a couple of guards, Gytha,\" Oiren scoffed, watching the forests of Greneclyf pass by through the locomotive's window. \"As you can see, drones' lives are far from ideal, and a single bitter fanatic would be enough to throw this country into a crisis beyond imagination.\"\n\nGytha only smiled in response, skimming through one of the documents from Aisling. \"Oiren, I appreciate your concern, but I'm certain my subjects won't try to kill me. I don't fear them --- I love each and every one of them, and I want them to see that. Besides, even if some... special element were to appear among them, our ever-vigilant Lord Protector would deal with it in an instant!\"\n\nA shadow of doubt darkened Oiren's face as she searched for the right words. In the end, she just exhaled sharply.\n\n\"Gytha... do you remember the drones from Aisling? While you were speaking with Onychion about their lives, I talked to the younger ones --- illiteracy is nearly universal. Our education system isn't keeping up; there are simply too many of us now.\"\n\n\"Add it to the ever-growing list of problems we need to solve,\" Gytha said with a bitter chuckle. \"Or think of what Bugsmere has become... It pains me to see it like this. To think, once the greatest city of our nation has turned into a dusty, concrete cage.\"\n\nOiren turned away, openly showing sorrow for her birthplace for the first time. But after a moment, she swallowed those emotions and looked back at the queen with a teasing smirk.\n\n\"And what happened in Llŷr? What were those shouts in the office about? Did my dear Gytha tear into someone over the poor harvest?\"\n\nGytha hesitated. \"Wicksite ... is old-fashioned, though it's hard to say that about someone who stuffs her house with so many machines. She knows what she's doing, she's wise, but she needs to accept that we live in a new era. As for the harvest...\" The queen sighed. \"I have some rather radical ideas regarding... Well, we'll discuss that later. And on top of everything else, the peasants have started a witch hunt.\"\n\nOiren gave her a questioning look but said nothing.\n\nGytha took a long sip of tea, watching as the island's landscapes were slowly swallowed by the darkness of the night.\n\n\"I'm glad you're here, Oiren. It truly means a lot to me,\" the queen said.\n\n\"I know. We've been inseparable since we were fillies --- even a royal mantle won't get you rid of me, Leamhanie,\" Oiren chuckled.\n\n\"Yes...\" Gytha murmured dreamily, settling in more comfortably and closing her eyes in exhaustion. \"And may it always be so.\"\n\nOiren gently embraced her, lost in thought, knowing that no matter what, she would help the drowsy queen beside her make Greneclyf a place worth living in."


