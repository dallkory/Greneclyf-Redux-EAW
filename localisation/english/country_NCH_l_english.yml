# Под венцом
greneclyf_base.25.t:0 "Под Венцом"
greneclyf_base.25.d:0 "«Это ещё что такое?», – спросила Ойрен, смотря на Гиту в белом платье.\n\n«Ну...как я выгляжу?», – робко спросила королева.\n\n«Ты что задумала? Гита, ответь мне, а не просверливай во мне дыру взглядом».\n\n«Я... В общем, я думала о том, как можно добыть больше любви для нашего народа, и пришла к идее... А почему бы не устроить морганатический брак с кем-нибудь? Ведь даже одно это даст мощный всплеск эмоций».\n\n«Тааак. И с кем ты решила его заключить?», – подозрительно сузила глаза Судья.\n\n«С, ну... Цельхельмом»\n\nОйрен рухнула с кресла в хохоте, сбив с себя образ обычно сдержанной чиновницы. Гита, заливаясь румянцем, опустила голову.\n\n«Ну ч-чего ты? Чего ты в самом деле, что смешного?»\n\nСудья с трудом поднялась, отдышавшись после приступа смеха.\n\n«Гита, я люблю тебя, но это самая глупая идея, которую ты когда-либо даже рассматривала. Садись за стол, надо поговорить».\n\nОна вновь уселась, ожидая, когда королева сделает то же.\n\n«Посмотри на отчёт Свит Спринкл. Хотя она и оказалась здесь при довольно... необычных обстоятельствах, кобылка делает свою работу администратора Зоны честно. Это натолкнуло меня на кое-какие мысли»\n\nКоролева пролистала бумаги от бакарской торговки.\n\n«Кажется, дела идут неплохо. Неожиданно неплохо».\n\nОйрен сделала глоток чая и задумчиво посмотрела в окно.\n\n«Понимаешь, Гит, раз уж наша страна и так ведёт себя как продажная кобыла, у этой кобылы должна быть определённая честь. И способ нажиться на происходящем ещё больше. Любовь можно добывать различными способами, и любовь приезжих дураков к азартным играм – это тоже любовь, которую мы можем забирать себе».\n\n«К чему ты клонишь, дорогая?»\n\n«К тому, что мы можем устроить диверсию, скрытно распределив среди крупье и работников игорных заведений замаскированных чейнджлингов. Обученные агенты Базальта смогут трансформировать зависимости игроманов, наркоманов, алкоголиков и прочего отребья в концентрат любви, который мы будем выдавать гражданам. Этого немного, и эта любовь не лучшего качества, но брать нужно вс-»\n\n«Полностью согласна, Ойри», – раздался внезапный голос.\n\nВ кабинете объявилась черновласая префект Ллира, баронесса Виксит собственной персоной.\n\n«И я помогу в этом, направив своих изобретателей на службу вашему милому плану. Правильные механизмы и способы извлечения дадут нам как нужную любовь, так и ценный опыт для дальнейших разработок. Что скажете, моя королева?»\n\nГита, всё ещё сидя в неуместном свадебном платье, сначала задумалась, но потом оживлённо кивнула.\n\n«Да! Я не вижу в этом ничего плохого. Но прошу вас обеих – будьте максимально аккуратны. Нам не нужно сеять панику среди ОРК. Свободны»."
greneclyf_base.25.a:0 "«А мне нужно... снять это и подумать над тем, как я пришла к такому решению»"

# Скованные
greneclyf_base.40.t:0 "Скованные"
greneclyf_base.40.d:0 "«Понимаете, Ваше Величество, поскольку Речная Коалиция ещё далека от федерализации, а ривбит остаётся лишь на стадии рассмотрения, реформы будут идти постепенно. Как партнёр экономической зоны, вы получите немало преференций, но...» – Свит Спринкл замялась.\n\n «Не тяни, в таких делах всегда есть своё “но”», – отрезала королева.\n\n«Хорошо, буду откровенна, если позволите. Договоры с каждой страной отдельно загонят королевство в долговую яму, поэтому, как ваш брокер и управляющая Саором, я рекомендую подписать компромиссное соглашение с ОРК. Акции ОРК стабильны, и даже если какие-то страны покинут Коалицию, с компанией ничего не случится. Это позволит вам выправить ситуацию и избежать голода.\n\nПросто... имейте в виду, что это не помощь, Ваше Величество. Это бизнес. Всё стоит денег. Но лучше уж платить меньше за что-то надёжное, чем разбрасываться средствами впустую, верно? Даже ваша инвестиция в мой найм оказалась грамотной: пусть моё назначение председателем Саора стало для меня шоком, но для вас это был куда более тактически выгодный ход, чем если бы на этот пост уселся очередной корпоратократ ОРК.\n\nТак что... давайте работать вместе над решением ваших проблем. Вы не одни».\n\nГита кивнула и подписала контракт, расширяющий возможности Объединённой Речной Компании в её стране. Перед этим она провела консультации с Ойрен и добилась права на участие Гвардии во внутренних делах Саора, несмотря на давление.\n\nС этого момента главным двигателем экономики Гринклифа становится конгломерат иностранных компаний."

greneclyf_base.40.a:0 "«Они продали нам веревку. Повесим ли мы их на ней?»"

# Алый закат
greneclyf_base.41.t:0 "Алый закат"
greneclyf_base.41.d:0 "Кэррион вместе с отрядом Преторианской гвардии провёл серию сокрушительных облав на подполья по наводке лорда Шоу. Очаги заговора были найдены по всему столичному региону. Префект был в неописуемом бешенстве от того, что под его носом разгуливали и строили планы предательские крысы, но они даже не давали возможности допросить их – все, кого удавалось хоть как-то поймать, просто убивали себя на месте, будь то ядом или выстрелом.\n\nАрхивы по делу полнились: вывески, агитки, записи, изъятое оружие. В стране зрел переворот, и зрел он с лёгкого копыта коммунистов, собиравшихся воспользоваться недавним кризисом как предлогом. В королевстве даже не была зарегистрирована их так называемая партия, не говоря уже о том, что граждане и понятия не имели о таких идеях.\n\nНаконец, когда офицер связи ворвался в очередную очищенную комнату, он быстро заговорил с Кэррионом – тайная служба расшифровала некоторые фрагменты дневника одного из «революционеров». В них описывался чрезвычайный план действий на случай вскрытия подполья.\n\nПреторианская гвардия встретилась с агентами в порту Эйслинга. Шоу и Кэррион через бинокль наблюдали за маленьким судном, с которого на них смотрели несколько чейнджлингов со своими семьями. Генерал было поднял копыто для приказа открыть артиллерийский огонь, но лорд-протектор его остановил.\n\n«Они хорошо усвоили урок, префект. В Тартар их. Нам незачем становиться детоубийцами».\n\n«Как быть с данными?», – спросил Кэррион, всё ещё наблюдая в бинокль за некогда высшей угрозой королевству.\n\n«Изучим всё подробно и выработаем контр-стратегии. Нужно понимать врага и его цели. И понимать хорошо».\n\nСолдаты и агенты разошлись, и вскоре на столе Гиты оказался подробный отчёт о деле “Алый Закат”."

greneclyf_base.41.a:0 "«Как же далеко дотянулся спрут коммунизма»"

# Павшие революционеры
greneclyf_base.41.t:0 "Павшие Революционеры"
greneclyf_base.41.d:0 "Сегодня к нам прибыли товарищи по идеям с далёкого восточного острова. Они сообщают, что их революция потерпела крах, и предлагают протянуть копыто помощи в нашем правом деле – распространении марксизма по всей Грифонии."

greneclyf_base.41.a:0 "«Добро пожаловать!»"

greneclyf_base.33.t:0 "Рассвет над Островом"  ##### трейт «Автократические тенденции»?
greneclyf_base.33.d:0 "Королева наслаждалась ранним рассветом в своём саду, когда дверь скрипнула и её нашла Леди Судья. Ойрен не сказала ни слова, просто сев рядом и разделив покой со своей названной сестрой.\n\nОбе понимали, что времена впереди, быть может, будут даже сложнее пережитого ими кризиса. Что таких спокойных моментов, как этот, будет всё меньше, так что ни к чему портить его разговорами. Тем не менее, Ойрен не могла не посмотреть на Гиту. Ветер слегка развевал её розовые волосы, а взгляд выражал твёрдость и уверенность. Она уже не та, кем была ещё до начала голода; теперь перед Судьёй сильный, повзрослевший монарх, готовый вести за собой целую нацию.\n\nВнезапно из открытой двери послышались удары больших часов, провозгласившие наступление пяти утра. Гита медленно встала, улыбнулась Ойрен и ушла обратно во дворец, оставив Её Превосходительство в саду одну."

greneclyf_base.33.a:0 "«Дела не ждут»"

greneclyf_base.700.t:0 "Капля чернил, что меняет мир"
greneclyf_base.700.d:0 "«Странное же ты выбрал место, Гагат», – произнёс Шоу, осматривая то, что некогда было пекарским цехом, а теперь превратилось в рупор королевства под названием «типография». Он слегка поморщился, оценивая обстановку: запах теста ещё висел в воздухе, а старые деревянные балки создавали атмосферу чего-то устаревшего и неприспособленного к амбициозным планам.\n\nПолный чейнджлинг, пыхтя сигарой, смотрел на здание с зачарованными глазами, и только с задержкой услышав лорда-протектора короны, ответил: «Базальт, какая разница, где она находится? Это же будущее, понимаешь? Это не просто золотая жила, это настоящий способ формировать мнение населения!» Гагат начал заливаться блаженным смехом, так сильно, что даже слёзы полились из его глаз, но он не мог остановиться.\n\n«А ты, я вижу, горишь идеей. Хорошо, что Баронесса Виксит любит инновации, и тебе повезло найти у неё покровительство», – добавил он, тщательно изучая здания вокруг. «Двор подумывает создать новое отделение по работе с населением. Быть может, я его даже возглавлю. Так что, дружище, мы будем поддерживать контакт и по поводу материалов печати.»\n\nГагат расплылся в улыбке. «Ну разумеется! Знал бы ты, как внутренний жеребёнок во мне сейчас радуется! Я ведь прилагаю своё копыто к чему-то действительно великому, будучи директором первой типографии в стране» – он сделал очередную глубокую затяжку, крикнув рабочим, чтобы они бережнее несли печатные станки.\n\nШоу удовлетворился процессом, заполнив со своим старым товарищем бумаги, после чего спросил Гагата: «А как ты назовешь газету?»\n\nГагат подошел к Базальту, медленно проведя копытом в воздухе:"

greneclyf_base.700.a:0 "«Crónán na Fírinne»"

# WITCHES #
# Голубой конверт
greneclyf_base.34.t:0 "Голубой Конверт"
greneclyf_base.34.d:0 "Пока Гита подписывала декреты, её глаз зацепил перевязанный лентой голубой конверт. От него пахло дорогим парфюмом, так что королева сразу догадалась, кто его прислал. Отложив декреты, она вскрыла конверт, принявшись читать:\n\n«Моя дражайшая королева,\n\nСитуация в Святой Роще стабилизировалась, и у меня наконец появилось время, а вместе с ним и желание заняться расследованием возможного влияния ведьм в этом регионе. К письму я прилагаю официальное прошение о том, чтобы Вы позволили мне лично возглавить сыскные мероприятия, направленные на выявление колдовской деятельности.\n\nСердечно ваша,\n\nПрефект Ллира, баронесса Виксит Леманн»\n\nКоролева быстро пробежалась глазами по письму, взглянула на копии меток ведьмовского шабаша, а затем на отчёт о странном урожае и загадочных исцелениях, случившихся во время кризиса."

greneclyf_base.34.a:0 "«Так и быть. Но не переусердствуй»"

# Поиски
greneclyf_base.35.t:0 "Поиски"
greneclyf_base.35.d:0 "Для Виксит было не впервой заниматься расследованиями лично. Она всегда испытывала неподдельную тягу ко всему, что будоражило её серые клеточки, и потому желание доказать или опровергнуть существование ведьм в её владениях стало для баронессы очередной увлекательной игрой умов.\n\nОпросив подданных и стражу, она собрала приблизительные сведения: ведьм может быть от четырёх до шести, и после каждой своей «операции» они оставляют метку шабаша – такую же, как та, что Виксит нашла в письме во время расследования участка с пророщенными ведьмовскими семенами.\n\nМнения жителей разделились. Одни уверены, что ведьмы творят зло, другие – что только добро, а третьи и вовсе отрицают их существование, списывая происходящее на чудеса Матроны.\n\nУдовлетворённо улыбнувшись и неспешно выпустив струйку сизого дыма через мундштук, Виксит направилась к последнему месту, где была замечена активность ведьм, – на окраину Святой Рощи.\n\n«Решили заявиться в кой-то веке?!», – недовольно прикрикнул на неё местный священник, Ксидо.\n\n«Следи за тоном, рвань. Не забывай, с кем разговариваешь», – Баронесса холодно наклонила голову. «Я прибыла по прямому распоряжению королевы для расследования действий ведьминского шабаша».\n\nСвященник поморщился, но вскоре оживился: «Самое время. Недавно был поджог, погибла часть паствы – и метки! Повсюду проклятые метки! Матрона свидетель, это точно вина этих нечестивиц!»\n\n«Метки..? Расскажи подробнее о поджоге».\n\nКсидо тяжело вздохнул: «Я... я прибежал уже к самому пожару. Вам лучше поговорить с малышкой Брионой – она единственная, кто выжил из семьи бедняги Тадина. Сейчас она живёт в бараке при церкви»."

greneclyf_base.35.a:0 "«Très bien, это обещает быть интересным»"

# Выжившая \n\n
greneclyf_base.36.t:0 "Выжившая"
greneclyf_base.36.d:0 "Баронесса навестила последнюю выжившую из фермерской семьи. Это была худенькая, дрожащая дрон, которой оставалось ещё несколько лет до совершеннолетия.\n\n«Для тебя это, несомненно, большая трагедия. Однако я прошу тебя оставить эмоции в стороне, ибо я пришла ради того, чтобы установить правду и наказать виновных. Пожалуйста, расскажи мне, что произошло той ночью».\n\nПодросток посмотрела на баронессу испуганными глазами, подбирая слова. Она долго молчала, прежде чем заговорить: «Э-э-это было ночью, два дня назад. Я у-с-слышала голоса за стеной... злые смешки... А потом молния ударила в наш дом! Но не с небес, клянусь! Она пришла сбоку!»\n\nДрон всхлипнула, пытаясь сдержать слёзы: «Папа пошёл посмотреть, в чём дело, но проклятые...», – голос сорвался, и она наконец дала волю эмоциям, – «проклятые колдуньи сожгли его заживо! А потом уничтожили наш дом... Они оставили свои метки... повсюду...»\n\nВиксит спокойно выпустила кольцо дыма. «Где же находился твой дом?»\n\nПосле ответа она кивнула и направилась к месту, которое теперь называли Кострищем.\n\nБродя по обугленным развалинам, баронесса обнаружила таинственные знаки, оставленные на стенах и полу. Она внимательно их изучила и нахмурилась. Эти метки не совпадали с теми, что она видела раньше в письме. Они были более грубыми и витиеватыми.\n\nОна вернулась к сановнику: «Где тела?»\n\n«Готовятся к погребению, в под–эй!»\n\nСвященник не успел договорить: Виксит резко оттолкнула его и поспешила в подвал церкви.\n\nВ темноте холодного помещения она нашла покрытые вуалями тела семьи. Один за другим она их открыла, тщательно изучая обугленные останки своих бывших подданных. Ксидо молился за её спиной, причитая о богохульстве.\n\nБаронесса равнодушно поднялась и бросила: «Я остаюсь здесь на ночь. Приготовь мне постель»"

greneclyf_base.36.a:0 "Священник устало кивнул"

# За полночь
greneclyf_base.37.t:0 "За Полночь"
greneclyf_base.37.d:0 "Во тьме Виксит спешно покинула церковь, вновь направляясь к Кострищу.\n\nОна уже предчувствовала, что кто-то вернётся к развалинам – и оказалась права. Среди руин металась фигура в капюшоне, склонившись над оставленными знаками, что-то тихо причитая.\n\n«Стой!», – крикнула баронесса.\n\nНезнакомка ахнула, вздрогнула и, не мешкая, бросилась бежать. Виксит незамедлительно рванула следом, и погоня утонула в темноте леса.\n\nОна мчалась сквозь заросли, хруст веток разносился под копытами. Запыхавшись, префект наконец остановилась перед старым особняком. Дом выглядел древним, но за ним определённо ухаживали. В окнах горел тёплый свет.\n\nБаронесса выдохнула, перевела дух и, собравшись, открыла дверь.\n\nИ внутри она увидела их.\n\nЗебра варила какое-то зелье, с жеребячим задором посыпая его сушёными травами, пока бэтпони – видимо, за ней Виксит и следовала – неслась к ней, что-то тараторя. Единорог и олениха прервали чаепитие, замерев и уставившись на нежданную гостью. А пегаска со сверкающими клыками продолжала что-то писать.\n\n«Ох… Вы ли это, баронесса?», – первая заговорила зебра.\n\nЗатем, успокаивающе посмотрев на бэтпони, добавила: «Не волнуйся, Нахталина. Это же наша префект».\n\nВиксит обвела взглядом комнату.\n\n«Вы...», – она прищурилась, – «вы и есть "сёстры"? Те самые ведьмы?»\n\nОлениха улыбнулась:"

greneclyf_base.37.a:0 "«Приятно наконец вас встретить, леди»"

# Багрянец восхода
greneclyf_base.38.t:0 "Багрянец Восхода"
greneclyf_base.38.d:0 "Виксит топнула копытом. «Я уже успела догадаться, что за поджогом в деревне стояли не вы. Ваша метка в письме отличается от оставленным там рун»\n\n«Верно, это наша Гисмирра нарисовала её. Она лично придумала дизайн нашего знака» – сказала единорог, подходя к довольной пегаске.\n\nБаронесса продолжила: «И ещё одно. Тела семьи фермера были изрезаны... чем-то длинным и тонким»\n\n«Длинным и тонким?» – пегаска повернулась к оленихе. – «Вальфрида, тебе это что-то говорит?»\n\nОлениха отрицательно покачала головой.\n\n«Пурвита?» – повернулась Гисмирра к единорогу.\n\n«Никогда не интересовалась языческими ритуалами, прости, дорогая» – ответила единорог, мотнув головой.\n\n«Демонические метки!», – продолжила взволнованно говорить Нахталина. «Это были они, Санктелла, я уверена! Деревня в опасности!»\n\nЗебра нахмурилась, сложив копыта на груди. «Руны... длинное орудие для убийства...», – пробормотала она. «Сдаётся мне, это демонопоклонничество. Кого-то принесли в жертву»\n\nОна резко повернулась к Виксит: «Ваше благородие, прошу, отложим знакомство. Нам нужно немедленно спасать деревню. Я помогу вам!»\n\n«И...» – уже было начала Пурвита, но зебра подняла копыто, останавливая её.\n\n«Нет, девочки. Останьтесь здесь. Я и баронесса разберёмся.»\n\nПуть назад между Виксит и Санктеллой прошёл в напряжённом молчании, которое нарушил резкий запах гари. Они ускорили шаг, а затем перешли на бег. Префект приготовилась атаковать магией, а зебра начала лихорадочно просматривать маленькую книжку с заклинаниями и древними письменами.\n\nКровавый рассвет встретил их, когда пара приблизилась к селу: алые небеса раннего утра сливались с густой чёрной гарью пожаров.\n\nОни добрались до церкви и распахнули тяжёлые двери. Мертвецы со страшными лицами лежали в луже крови своего последнего причастия. Тёмные потоки языками растекались по полу, заливали плитки, тонкими струйками вились по ступенькам, где среди убитых валялись крюки и ножовки.\n\nВиксит почувствовала, как её охватывает дурнота, на миг теряя уверенность. Санктелла же осматривала сцену с холодным, суровым взглядом.\n\nИ тогда она поднялась. Тонкое хрупкое тельце тряслось в приступе беззвучного хохота. Пустой, безумный взгляд устремился на колдунью и префекта.\n\n«Бриона...» – выдохнула Виксит, – «Нужно было догадаться».\n\n«Нет, мисс Виксит.» – Голос зебры был ровным, но тяжёлым. – «Это не есть дитя. Это демон, что завладел её душой и пожрал. К сожалению, спасти её никак уж нельзя.»\n\n«Значит, можно упокоить!» – выкрикнула баронесса, выстрелив магией в дрыгающееся в конвульсиях тело, которое пружиной отпрыгнуло в сторону. Чудовище издало очередной приступ леденящего хохота и ловким, одновременно элегантным и уродливым движением метнуло в баронессу кипу кинжалов, когда в сторону её пихнула Санктелла, спасая от смерти. \n\nМонстр всё смеялся и смеялся. Баронесса впервые задрожала, ощутив страх.\n\nНо зебра продолжала что-то читать вслух, её голос становился всё громче, слова набирали силу, и в ответ на них чудовище начало содрогаться в конвульсиях. Смотря прямо в пустые закатившиеся глаза, Санктелла подходила ближе, переходя на крик. Сделав последний шаг, она силой засунула в рот создания сосуд, после опустошения которого тварь издала невероятный крик, упав замертво. \n\nСанктелла помогла Виксит подняться, и они покинули деревню, ставшую братской могилой сотен прихожан. После событий баронесса приказала снести остатки села.\n\nСпустя время, Шабаш был найден вновь – в другой день, в другом месте. И на этот раз баронесса убедила их лично встретиться с Гитой."

greneclyf_base.38.a:0 "«Посмотрим, что скажет королева»"

# Квинтет
greneclyf_base.39.t:0 "Квинтет"
greneclyf_base.39.d:0 "Гита читала доклад Виксит с нарастающей тревогой. Её взгляд то и дело переходил с бумаги на сидящих перед ней ведьм. Слухи об их существовании оказались не просто правдой – они действительно творили чудеса и всё это время тайно помогали в Святой Роще.\n\nДневной ветерок развевал белые занавески в её офисе, пока Гисмирра недовольно хмыкнула и натянула свою шляпу с вуалью, прячась от яркого солнечного света.\n\n«Что ж... Буду откровенна: я в шоке». Гита перевела дыхание, взглянула на ведьм ещё раз и подалась вперёд: «Вы... Вы все действительно героини. Но почему же вы никогда не заявляли о себе?»\n\nПурвита печально вздохнула: «Всё, чего мы хотели, милая королева – это покоя. Наша история длинна и безрадостна, мы никогда не хотели становиться героинями».\n\n«Хотя это всё же лучше, чем быть тайными пакостниками», – усмехнулась Вальфрида. \n\n«Кроме того, у нас даже нет никаких законных оснований быть здесь...», – с тоской добавила Нахталина. \n\n«И у некоторых из нас есть, скажем так, определённые… трудности с окружением, включая солнечный свет» – протянула Гисмирра, ещё сильнее натягивая шляпу.\n\nГита в растерянности взглянула на них. «Вы спасли моего префекта. Мою тётю. Вы заслужили не просто гражданство... вы заслужили признание!»\n\nСанктелла склонила голову: «Но что мы можем? Защищать Гринклиф от злодейств, подобных тем, что практикуют некроманты Лиги Ужаса?»\n\nГита широко улыбнулась, хлопнув копытами по столу.\n\n«Именно так!»"

greneclyf_base.39.a:0 "«Отныне, девочки, вы – основа Majestic V!»"

# CORE - FOREGIN #
# Визит к хранителям
greneclyf_foregin.1.t:0 "Визит к Хранителям"
greneclyf_foregin.1.d:0 "Семпер Фай, одетый в свою форму, выделялся на фоне изумлённо разглядывающих его пони Ручьеграда, пока следовал за облачёнными в рясы фигурами к красиво расписанному деревянному строению. Войдя внутрь, он увидел сидящих в кругу пони в таких же плащах – сопровождавшие его фигуры заняли свои места рядом. Фарбрукец, стоящий рядом с ним, махнул копытом, приглашая Семпера сесть напротив той, кого звали Изелин. Чейнджлинг начал говорить на ломаном фарбрукском, используя переводчика. \n\n«Моё имя – Семпер Фай, Хранительница. Я представляю находящееся за холмами на острове королевство Гринклиф, и позвольте мне в первую очередь сердечно поблагодарить вас за помощь, оказанную Ручьеградом во время сразившего нас кризиса. Я знаю, что ваше сообщество было крайне удивлено, узнав о чейнджлингах, но ваша доброта спасла многих».\n\nИзелин слушала переводчика, кивнув в конце с небольшим смешком. Она что-то пролепетала, после чего протянула контр-адмиралу большую кружку с чем-то шипучим. Чейнджлинг бросил вопросительный взгляд на переводчика. Тот лишь едва заметно кивнул, намекая, что нужно пить. Сделав глоток, Семпер ощутил прилив умиротворения и вкус чего-то очень натурального... и солёного.\n\nИзелин подвинула свою кружку и тоже сделала глоток, показывая, что готова слушать дальше.\n\n«Но моя королева заинтересована в более глубокой дружбе с вашим сообществом, уважаемая Хранительница. Мы хотим...» – Семпер замялся, подбирая слово, которое ручьеградцы могли бы понять вместо «интеграция», – «...заключить брак с вами?»\n\nУслышав перевод, Изелин, слегка румянясь, недоумённо повела ушами, а её взгляд остановился на контр-адмирале, который уже стучал копытом по лбу, осознав сказанное. Советники вокруг неё начали перешёптываться.\n\n«Я... я имею в виду государственный союз, понимаете?» – Семпер нервно сглотнул. «Т-То есть, два наших народа будут как супруги друг для друга, в-вот...»\n\nИзелин встала со своего места и внимательно оглядела чейнджлинга, после чего что-то сказала совету. Затем она принесла красивые кружки с теперь уже розовой водой.\n\n«Что, мне снова что-то пить?», – спросил Семпер переводчика. Тот лишь пожал плечами, явно что-то скрывая в своём взгляде.\n\nЧейнджлинг уже приготовился пить, как вдруг Изелин начала поить его сама. Интуитивно догадавшись, он ответил ей тем же. Когда сосуды опустели, переводчик коротко сказал: «Поздравляю».\n\n«С чем?»\n\n«С помолвкой».\n\nГлаз контр-адмирала дёрнулся. Конечно, королева приказала ему заключить союз с Ручьеградом любой ценой, но... "

greneclyf_foregin.1.a:0 "«С ЧЕМ?!»"

# Приказ 1400
greneclyf_foregin.3:0 "Приказ 1400"
greneclyf_foregin.3:0 "От: Отдел Международных Отношений Тайной Канцелярия\n\nКому: Командующему Семперу Фаю\n\nСим уведомляется, что Её Королевское Величество Гита приказала инициировать операцию по ассимиляции обширных земель холмов вне зависимости от желаний населяющих их шаманов и племён. Военно-морской флот региона наделяется правом автономного принуждения сообществ к гармонизации в случае, если лидеры проявят идеологический экстремизм или откажутся подчиняться интеграции в королевство.\n\nСлава Гринклифу!"

greneclyf_foregin.3:0 "«Кому-то пора открыть личико»"

# Всегда верен
greneclyf_foregin.4.t:0 "Всегда Верен"
greneclyf_foregin.4.d:0 "Контр-адмирал изучал новые соглашения, написанные на множестве языков, когда генерал Латро подошёл к нему своей привычной статной походкой и, остановившись перед столом, чётко отсалютовал. Семпер ответил взаимностью, выжидательно глядя на генерала.\n\n«Сим уведомляю вас от лица её Превосходительства Верховной Судьи, что вы официально назначены префектом-примарис так называемого региона холмов на время интеграции новых префектур, контр-адмирал».\n\nФай кивнул. Это было ожидаемо: Ойрен наверняка хотела, чтобы он взял на себя гражданскую должность и навёл порядок в регионе.\n\n«И отбрасывая формальности, миленькую вы себе нашли жену, Фай», – добавил генерал с лукавой ухмылкой.\n\nСемпер нахмурился и поправил фуражку.\n\n«Хотя её акцент на гринклифском ужасен, но она хотя бы пытается выучить его, что весьма достойно похвалы», – продолжил Латро.\n\n«Завязывай паясничать, Латро. Если это всё, то я бы хотел приступить к работе».\n\n«Конечно-конечно», – генерал лейб-гвардии положил перед Фаем целую кипу административных приказов от Ойрен и Гиты.\n\n«И вообще-то я не шутил», – добавил он, оборачиваясь с ухмылкой. «Половина командования тебе завидует. С Изелин тебе и правда повезло, хоть всё и вышло так нелепо»\n\nСлегка посмеиваясь, Латро покинул кабинет, пока контр-адмирал устало выдохнул, подперев щёку."

greneclyf_foregin.4.a:0 "«Да я и сам знаю...»"

# Современница
greneclyf_foregin.5.t:0 "Современница"
greneclyf_foregin.5.d:0 "«Это... нечестно!», – выпалила Гита, получив ответ на свой вопрос.\n\n«Но такова реальность, ваше величество. Пони в Речных Землях в принципе не блещут дружелюбием, поверьте, я ведь там всю жизнь провела», – ответила, пожимая плечами, Свит Спринкл.\n\n«Понимаете, альянс сложился исторически, но по необходимости – ради обороны от проклятых грифонов. В конце концов, они даже своих в рабстве держали не так давно. Или вновь держат? Прошу простить, не слежу за новостями Виттенленда. Не говоря уж о том, что приходится терпеть алмазных псов с их королём-грубияном».\n\nБрокер осмелилась положить копыто поверх оного расстроенной королевы.\n\n«Ваше величество... вы не печальтесь только. Это как с соседями, понимаете? Они всегда за вашей спиной поливают вас грязью. Таков мир».\n\n«Нет, Спринкл», – ответила Гита, кладя своё второе копыто поверх копыта Свит, – «Это не нормально. И я хочу, чтобы ты помогла мне переубедить их, помогла выстроить принципиально новое общество».\n\n«Но... здесь не обойдётся без насилия, ваше величество».\n\n«Я понимаю»."

greneclyf_foregin.5.a:0 "«Революции в белых перчатках не делаются»"
# Организатор 
greneclyf_foregin.6.t:0 "Организатор "
greneclyf_foregin.6.d:0 "«Эта королева сумасшедшая. Но мне это даже нравится», – бубнила себе под нос Свит Спринкл, чертя что-то на полотне.\n\n«Заказ есть заказ. Я хоть в Тартар прыгну и пну круп Грогара, если мне за это заплатят. А тут, пфф, всего-то создать новую партию на восемь государств, каким-то образом организовать их тесную взаимную работу, подготовить наднациональный переворот и промыть мозги миллионам пони, внушив им, что федерация – это цель их жизни... ха-хааа... Понимаешь? Легкотня!»\n\nОна перевернула кружку с кофе, уставившись красными глазами на своего котёнка Пиклза, а затем рухнула на диван, пока комочек меха устроился рядом с ней. На следующее утро Гита лично зашла в её кабинет и с любопытством наблюдала за распластавшейся на полу пони, которая за ночь успела скатиться с дивана и теперь мирно храпела.\n\n«Мисс Спринкл?»\n\n«Уа! Да, мэм! Нет! Так точно! Что?!»\n\nОна огляделась, увидев королеву, которая уже с интересом смотрела на её стол. Кое-как поправив очки, Спринкл подошла к Гите, прокряхтевшись.\n\n«Подробности я расписала здесь и здесь, но краткий синопсис: у меня есть определённые контакты в политических кругах Республики, Бакары и Озеграда. С вашим финансированием и агентами мы сможем распространить идею федерации на все речные государства. Концепт называется „9 Звёзд“ – это наднациональная про-федералистская партия со своими боевыми отрядами, кото-»\n\nСвит прервалась на долгий зевок, после которого Пиклз уютно устроился у неё на голове.\n\n«...которые будут наполнены вашими оперативниками и начнут избавляться от всех неугодных, пока агитаторы промывают головы обычному населению. Дайте проекту пару лет, гору денег и талантливых менеджеров – и уже склоняющаяся в сторону федерализма Коалиция будет едина».\n\nГита с трудом сдержала смешок, глядя на сидящего на голове Свит котёнка, но всё же спросила:\n\n«Но почему „9 Звёзд“? Разве стран не восемь?»\n\n«А всё просто»."

greneclyf_foregin.6.a:0 "«Девятая – это Гринклиф»"
# Идея 
greneclyf_foregin.7.t:0 "Идея"
greneclyf_foregin.7.d:0 "«ДЕЛАЙ ИСТОРИЮ – ВСТУПАЙ В "9 ЗВЁЗД"!\n\nМы стоим на пороге новой эры – эры силы, единства и судьбоносных решений. Девять великих народов, разделённых искусственными границами, но соединённых единой судьбой, готовы стать колыбелью прогресса и мира всего Востока.\n\nЭто твоя демократия. Создай её. Защити её. Сохрани для своих детей и распространи её. Позволь родиться новой нации – нации народов, рас и религий, единых в своём стремлении к свободе.\n\nФедерация – это песня»"

greneclyf_foregin.7.a:0 "«И её нужно петь вместе»"

#Полезное место
greneclyf_foregin.8.t:0 "Полезное Место"
greneclyf_foregin.8.d:0 "«Так и что?», – чейнджлинг в смокинге скептически посмотрел на прораба. «Скоро можно будет вводить в эксплуатацию или нет?»\n\n«Дайте нам пару месяцев на полировку, и всё будет готово», – прораб замялся.\n\n«Знаете... это странно. Почему посольство именно в этой дыре, а не, скажем, в Речкограде?»\n\n«А это не твоего ума дело. Просто строй, получай зарплату и откомандировывайся», – сухо бросил политик, уходя в свой автомобиль.\n\n«Всё идёт быстро, господин лорд-протектор. Один-два месяца и можно открываться»\n\n«Ясно. Отлично, Даск. Вскоре ты и сам тут будешь работать. Но пока проверим другие объекты», –  ответил Шоу.\n\nАвтомобиль ехал по проселочным дорогам, по всей длине которых шли стройки: железные дороги, бетонирование дыр, какие-то гражданские здание. Казалось, что Гринклиф решил индустриализировать племена Понайана по доброте душевной. Но за всем скрывалась причина, и причина весьма простая: политическая предсказуемость. Пока в других странах Кольтстримского Соглашения есть старые дворяне, фашисты, коммунисты и прочие психопаты, в Понайяне есть покой, свежий воздух, гармония и определенная стабильность. А большего для продвижения своих интересов на чужбине и не нужно."

greneclyf_foregin.8.a:0 "«Жизнь хороша»"

# Погром в бакбанбурге
greneclyf_foregin.9.t:0 "Погром в Бакбанбурге"
greneclyf_foregin.9.d:0 "«Это же политический скандал!», – вскрикнул посол Гринклифа при Коалиции Эмералд Даск, обращаясь к смотрящему на него свысока стражнику. «Как вы посмели допустить, чтобы граждан Гринклифа так жестоко избили?»\n\n«Послушайте, в Депонии и других проблем хватает, чем следить за чужаками. Никого ведь не убили, верно?»\n\n«Ушам своим не верю! Да как ты смеешь, длинномордый невежда! Помяни мои слова, я этого так не оставлю, вы...»\n\n«Ну-ка, что мы, малютка-чейнджлинг?», – тираду политика прервала высокая белая пони, стоявшая перед ним и смотревшая на Даска с ещё более надменным взглядом.\n\n«Вы ещё об этом пожалеете, мисс Панч. Вы и ваша варварская пропаганда!», – процедил Даск, вернувшись в свой автомобиль и с силой хлопнув дверью."

greneclyf_foregin.9.a:0 "«Теперь я понимаю, почему королева выбрала Понайан»"

# Чистый удар 
greneclyf_foregin.10.t:0 "Чистый Удар"
greneclyf_foregin.10.d:0 "“Спасибо, что подписались на нашу рассылку! Мы ценим ваш интерес к общему делу. Федерация – это не страна. Это идея”\n\nАхоит Пёрпл не был уверен, во что ввязался. Он любил свою страну. Он верил в королеву. Он верил, что “9 Звёзд” – это шанс защитить её. Но теперь, глядя на письмо с мечтами государства, которого ещё не существовало, и вспоминая слова агитатора, он вдруг почувствовал, как по спине пробежал холод.\n\nЗвонок прорезал тишину.\n\n«Привет, это “Сторм” из надзора за домашними животными. Нам нужно, чтобы ты сегодня вышел на смену. 104-я Северная улица. Хозяйка жалуется: у неё сбежала собака. Разберись и доставь её в питомник. Действуй быстро, другие за тобой приберутся. И не тревожь соседей!»\n\nМогло показаться, что кто-то ошибся номером, но Пёрпл понимал, о чем речь. Они знали, кому звонят. Они знали, что он поймёт.\n\nТёмные улицы, редкие фонари. У обочины стояла фигура в плаще, неподвижная, как камень. Просто ещё одна тень. Вдалеке приближался транспорт. Чёрный седан, достаточно богато для Депонии, и по номерам он его уже узнал. Карамель Панч. Главная депонийская националистка. Пони, которая ненавидела чейнджлингов. Которая в каждом интервью говорила, что их место – в резервациях, а не в Коалиции.\n\nПёрпл с тенью обменялись взглядами. «Аллюр» – лёгкий кивок и звук снятия оружия с предохранителя. Пуля вошла в колесо ровно в тот момент, когда машина пересекала перекрёсток. Визг шин, грохот металла – и вот уже корпус седана разносит дорожное ограждение.\n\nАхоит был там раньше, чем разлетелись последние осколки стекла. Замаскировавшись под пони, он силком открыл дверь машины и вытащил пони, которая не успела даже закричать. Наконец связав её, Пёрпл ещё раз взглянул на своего “коллегу”.\n\nТот уже шагал к ним, приняв облик автоинспектора и делая вид, что он прибыл изучать аварию. Всё шло по сценарию, пока не раздался выстрел с хриплым сопением. Никто не был задет, умирающий телохранитель Панч выронил свой пистолет, когда к нему подошел “инспектор”, прикладывая копыто к носу и пару мгновений слушая надрывное булькотение.\n\nЧерез секунду Ахоит скрылся в переулке, неся на спине политика, которая ещё пару дней назад уверенно говорила о независимости Депонии. Он не знал, что с ней будет. Это не его работа. Его работа – оставить груз там, где нужно.\n\nЧерез неделю страна содрогнулась. Карамель Панч – символ националистов, их голос – внезапно изменила позицию. Теперь она говорила о единстве, о необходимости интеграции, о том, что настало время забыть прошлое ради общего будущего.\n\nКороль Гримхуф слушал. Народ слушал. И сам Ахоит слушал с пустым выражением лица, ожидая следующего звонка."

greneclyf_foregin.10.a:0 "«Аллюр»"

# В дворе Кримзон и Королевы 
greneclyf_foregin.11.t:0 "В дворе Кримзон и Королевы"
greneclyf_foregin.11.d:0 "«Вынуждена признать», – начала Кримзон, – «я искренне польщена вашим предложением дружбы, королева Гита. Мало кто оценивает нас всерьёз, предпочитая вести дела с республиканцами или князьями».\n\n«Ну что вы, ваша конфедерация – это пример для других стран Коалиции того, какой должна быть гармония, Кримзон. Единственное, чего вам не хватает, – это прогресса и индустриализации, и мы более чем готовы помочь вам в этом. Как друзья».\n\nКримзон слегка умилилась от столь откровенной лести, но сохранила лицо. «Скажите, Гита... Мне не чуждо понимание как дружбы, так и торговых традиций. Гармония строится на взаимном обмене, так что скажите, чем я могу отблагодарить вас за помощь в индустриализации?»\n\nГита расцвела от того, насколько понимающая пони сидела перед ней.\n\n«О, ничего особенного, прошу лишь признать нашу дружбу официально. Разве не прекрасно, когда две страны могут заявить всему миру, что небезразличны друг другу и готовы прикрыть тыл?»\n\nКримзон рассмеялась от хода мыслей Гиты, отхлебнув большой глоток чая. «Мне нравится, как это звучит. В отличие от надутых самодовольных дворян Виттенленда, вы не требуете подчинения. Нет, это звучит как признание между народами в любви!»"

greneclyf_foregin.11.a:0 "«Закрепим же это!»"

# В путь 
greneclyf_foregin.12.t:0 "В Путь"
greneclyf_foregin.12.d:0 "«Я всё ещё считаю, что это очень рискованно», – произнес Базальт, глядя на пакующую чемоданы королеву.\n\n«Вести с Запада неспокойны. Пони из Коалиции говорили о том, что между нашим родом и Эквестрией какое-то напряжение».\n\n«Что ж, вот я лично и узнаю!», – ответила королева, садясь на чемодан, чтобы закрыть его.\n\n«Мы устроим два визита: в Эквестрию и домой. В родные земли отправимся я, ты и Латро, а Эквестрию посетят Ойрен, Семпер и Кэррион. Разумеется, все с охраной, но с добрыми намерениями. Так что собирайся: пора домой!»"

greneclyf_foregin.12.a:0 "«Мне это всё равно не нравится»"

# Горячий приём
greneclyf_foregin.13.t:0 "Горячий Приём"
greneclyf_foregin.13.d:0 "«Матрона всемогущая! Что ты делаешь?!», – выкрикнула Ойрен, пока её прикрыли солдаты Кэрриона, отодвинув от дыры в бетоне, а корпус морской пехоты Семпера нацелил винтовки на эквестрийских морских пограничников.\n\n«Повторяю! Возвращайтесь назад в свою страну, нам здесь не нужны агенты Кризалис!»\n\n«Да кто вообще такая эта Кризалис?!»\n\nПони уныло повел глазами, не убирая винтовку, пока его не ткнул в плечо сослуживец: «Может, это тораксиканцы? Вслушайся, какая у них речь странная».\n\nУслышав выстрел, из каюты выбежал бакарский моряк, посмотрел на обе стороны, после чего начал жестикулировать и кричать на эквестрийцев на их языке: «Успокойтесь! Это представители Королевства Гринклиф на дальнем востоке, соседи наши!»\n\n«Тебе, должно быть, голову напекло, восточный кузен, раз чейнджлинги стали вашими соседями».\n\n«Да правду я говорю, параноидальный упрямый придурок! Гляди!», – он указал на флагшток и на судовую, заполненную на гринклифском.\n\nПограничники переглянулись. Один из них сплюнул, убрав оружие: «Ну его. Стой здесь, Лайт Сплэш, я вызову полицию, пусть разбираются они. Может, это правда тораксиканцы какие, а они наши друзья».\n\nСолдаты с обеих сторон опустили винтовки, пока Ойрен прожигала наглеца взглядом.\n\nТем же вечером, когда их сопроводила в мэрию Ванхувера эквестрийская военная полиция, в город срочно прибыли принцесса Твайлайт Спаркл и сама Селестия.\n\nОйрен снисходительно смотрела на них, подперев подбородок, пока Твайлайт изучала её и сопровождение, а Селестия не начала разговор:\n\n«Приветствую, гринклифцы! Давно же я ничего не слышала о вас; настолько давно, что, кажется, прошло уже около тысячи лет. Прошу вас простить меня за действия» – она повернула голову в сторону капитана морского патруля – «моих маленьких пони. Видите ли, Гринклиф в наших краях давно стал достоянием старых свитков и даже в учебниках не поднимается слово о том, что такое место существует. Как вы поживаете?» \n\n«Как мы по... Действительно. Как же мы поживаем после того, как ваши параноики чуть не пристрелили нас! Что это было, госпожа Селестия, откуда такая агрессия?!» – гневно выпалил Кэррион.\n\n«Гринклифцы... отдельный народ...», – удивленно протянула Твайлайт Спаркл. «Позвольте мне дать вам небольшое пояснение того, что происходило на Эквусе за последние, эм, сто лет» – Твайлайт быстро покинула помещение, вернувшись с книжками и кипой свитков, пока глаза Ойрен немного расширились от размера этих манускриптов."

greneclyf_foregin.13.a:0 "«Нас ждет тот ещё вечер...»"

# После лекции
greneclyf_foregin.14.t:0 "После Лекции"
greneclyf_foregin.14.d:0 "«И вот так мы подходим к сегодняшнему дню, когда ситуация на границе накалена до предела, а целый ваш род в оковах тирана. Ой! Прошу прощения за резкость» – она нервно посмеялась.\n\n«Но теперь вы тут! Настоящие гринклифцы, чейнджлинги, пошедшие другим путем – исходя из ваших же ответов и рассказов. Удивительно, это значит, что вы сможете помочь Тораксу!»\n\n«Так. Постой, принцесса, притормози на минуту», – устало ответила Ойрен. «Это всё... немного через чур. Сначала мне нужен отдых и обсудить всё с моей королевой, чтобы мы говорили о политике. Я понимаю, что ситуация на континенте напряженная, но я прибыла в первую очередь как эмиссар, чтобы установить между нами дипломатические отношения. Давайте начнем с этого, мисс Твайлайт, Селестия?»"

greneclyf_foregin.14.a:0 "«Ну разумеется!»"

# Отчёт о посещении эквестрии
greneclyf_foregin.15.t:0 "Отчет о посещении Эквестрии "
greneclyf_foregin.15.d:0 "Установлен первичный дипломатический контакт, чуть не переросший в скандал; получена свежая информация о происходившем на континенте за последние годы с позиции эквестрийской пропаганды.\n\nОбщество пребывает в напряжении, если видит чейнджлинга. Судя по всему, восприятие нашего вида было испорчено действиями некой Кризалис – нынешнего тирана наших земель, объединившего их сравнительно недавно. Идеологически Эквестрия нам близка, вероятнее всего будет использовать наш образ в пропаганде как образ “доброго чейнджлинга”.\n\nРекомендуется развитие политических отношений с изменением восприятия нашего вида. Полная выработка стратегии возможна только после посещения самой Кризалис. Позиция посредника даст нам уникальное положение на Эквусе.\n\nP.S. Страной всё ещё правит принцесса Селестия – что-то не меняется и через тысячу лет, её доверенное лицо – принцесса (родственница?) Твайлайт Спаркл, которая и ввела нас в курс дела."

greneclyf_foregin.15.a:0 "«А ещё её розовая подруга вкусно готовит»"

# Чужаки
greneclyf_foregin.16.t:0 "Чужаки"
greneclyf_foregin.16.d:0 "Когда Гита и её сопровождение сошли на берег, всё вокруг казалось удивительно пустым. Но стоило им сделать несколько шагов в пустоши, как они обнаружили себя окружёнными дронами, которые агрессию быстро сменили на озадаченность.\n\n«А вы... кто?», – спросил более рослый из них. «Я не узнаю ваш запах, да и выглядите вы как королева. Но ни одна из известных мне королев не похожа на вас».\n\nСолдаты начали спорить, являются ли посетители самозванцами или кем-то ещё, пока Гита не прервала их.\n\n«Мои дорогие дроны! Я представляю род Леманн и правлю дальним заморским ульем Гринклиф! Копыто нашего клана не ступало на эти земли почти тысячу лет, посему я требую аудиенции у вашего лидера», – Шоу прошептал ей имя на ухо, – «Кризалис, верно!»\n\nОдин дрон сделал сложное лицо, пока второй почесал затылок. «Ты что-нибудь понял?»\n\n«Да. Тихо, это дитрисиумский, только... просто безумно сложный и какой-то неправильный. В общем, лучше отвести их к королеве Хельвии. И давай без этих ищеек из УОБВ, ладно?»\n\nСолдат поднял копыто перед Гитой и громко вскрикнул: «Я! ХОДИТЬ!», – указав на себя и на направление."

greneclyf_foregin.16.a:0 "«Что ж, пойдем за ним?»"

# Старый и новый миры
greneclyf_foregin.17.t:0 "Старый и Новый Миры"
greneclyf_foregin.17.d:0 "«Странно. Как думаете, почему они не подозрительны, а даже... субмиссивны?», – спросил Латро.\n\n«Вероятно, чувствуют королеву. Это в их природе, в конце концов они дроны, а я рядом» – ответила Гита, пока их сопровождающий постучал и открыл большую дверь.\n\nВ комнате Гита увидела красивую чейнджлингиню, что-то упорно доказывающую по телефону. Когда она закончила разговор, то в злости бросила трубку, подняв глаза и сразу опешив в удивлении.\n\n«А ты ещё кто такая?!»\n\nГита повела глазами, собираясь представиться вновь, как её прервал Базальт: «Просим прощения за беспокойство, у-».\n\nОсоба прервала их: «Это что, дитрисиумский?» Она мгновенно перешла на диалект: «Ещё и такой странный... я совсем запуталась. Я знаю этот диалект, потому что я Хельвия, королева Улья Дитрисиум. А вам его откуда знать? Вы не из моего улья, я вижу вас впервые, причём ты», – она указала на Гиту, – «тоже явно королева. Что здесь происходит..? Кризалис решила заменить меня?!»\n\n«Стой! Скажи мне, знаешь ли ты о такой правительнице, как королева Мирел Властная?»\n\n«У нас тут что, урок истории? Ну, была в Дитрисиуме такая в начале прошлого тысячелетия. Правила сравнительно недолго, сгинув в очередном перевороте».\n\n«Ты не её потомок?»\n\n«Нет. Может, начнёшь уже об-».\n\nГита положила своё копыто на копыто жестикулирующей Хельвии, застыв в улыбке. «Меня зовут Гита Леманн, почти тысячу лет назад Мирел изгнала мою семью и род Ойр на далекий остров на западе».\n\n«...Гринклиф», – нахмурилась Хельвия."

greneclyf_foregin.17.a:0 "«Вам нужно поговорить с Кризалис»"

# Королева в высоком замке
greneclyf_foregin.18.t:0 "Королева в Высоком Замке"
greneclyf_foregin.18.d:0 "«Говоришь, Гринклиф? Я думала, что экспедиция вымерла века назад, прихватив за собой изгнанников. Но на то мы и чейнджлинги, что выносим любые условия, не так ли?», – ухмыльнулась Кризалис, изучая Гиту и её свиту, которых к ней привела Хельвия.\n\n«А у тебя милый наряд. Должно быть, ты выполняешь важную роль?», – перевела она глаза на Латро.\n\n«Генерал лейб-гвардии, ваше высочество. Я командую элитой».\n\n«Хо, элитой, значит? Надо будет как-нибудь устроить соревнования тебе и Триммелю».\n\nКризалис повернулась к Триммелю, голосито рассмеявшись, и подчинённый последовал её примеру, после чего она резко остановилась.\n\n«Итак, Гита. Скажи, что ты думаешь об Ульях? Мне интересно мнение такого уникального сородича, как ты».\n\n«Н-ну...», – замялась королева Гринклифа. «Откровенно говоря, я вообще не ожидала, что Ульи когда-нибудь будут единым государством. Ты явно превзошла себя, умудрившись объединить столько спорящих между собой кланов».\n\nКризалис мотнула челкой, явно гордая собой: «И всё бы шло замечательно, если бы не проклятые пони на востоке. Мы голодны. Нам нужна любовь, которую нам могут дать эти до омерзения приторные создания, и мы получим своё силой. Ты должна понимать меня как никто другой, королева».\n\nКаждый из свиты начал мяться, заставив Кризалис изогнуть бровь.\n\n«Как бы это сказать...», – начал Шоу.\n\n«Знаешь, за что были известны торговцы Дитрисиума в своё время, Кризалис?», – спросила Гита.\n\n«За изворотливость. Поэтому именно с этими пиявками Весалиполис заключил ось, подмяв под себя прочих, верно, Хельвия?»\n\n«В определённом смысле».\n\nГита покачала головой: «И изворотливость можно использовать по-разному. Скажем так: наши методы отличаются от ваших, но я хочу больше узнать о твоей стране и предложить тебе дружбу».\n\nКризалис поморщилась. «Лучше сотрудничество. Мне это слово больше нравится»."

greneclyf_foregin.18.a:0 "«Что ж, значит, сотрудничество...»"

# За кулисами
greneclyf_foregin.19.t:0 "За Кулисами"
greneclyf_foregin.19.d:0 "«Есть в них что-то противное, Хельвия. Будто бы они сами ведут себя как пони время от времени. Неужели изоляция так портит нас?»\n\nКоролева Дитрисиума молча наблюдала, как надутая Кризалис ходила из стороны в сторону.\n\n«Но знаешь, что интересно: раз Гринклиф жив, то они смогут стать частью Гегемонии со временем! Представь: связи, межконтинентальная контрабанда, единый род под МОИМ знаменем! И кроме того, мы сможем не только владеть Эквусом, но зажать Грифонию с двух сторон, диктуя условия местным».\n\n«Я могу уже идти?», – выдохнула Хельвия. «Ты же сама дала мне утром гору поручений, мне нужно их как-то выполнять, иначе сама снова взбесишься».\n\nКризалис какое-то время сверлила её взглядом, сузив глаза, после чего процедила: «Иди».\n\nВыйдя из её зала, Хельвия оперлась на оконную раму, глядя на очередной парад."

greneclyf_foregin.19.a:0 "«А мне они понравились...»"

# Отчёт о посещении земель чейнджлингов
greneclyf_foregin.20.t:0 "Отчет о посещении Земель Чейнджлингов"
greneclyf_foregin.20.d:0 "Установлен первичный контакт, всё прошло на удивление мирно. Получена позиция на прошлое со стороны наших сородичей, был проведен диалог с верховным лидером Кризалис и королевой Дитрисиума Хельвией.\n\nОбщество глубоко милитаризовано и настроено на конфликт с не-сородичами. Автократический режим ведет их в тупиковое направление, предлагая выход через насилие, а не кооперацию, коей идём мы. Потенциально Кризалис возжелает объединения на своих условиях (недопустимо).\n\nРекомендуется осторожное политическое взаимодействие с налаживанием диалога. Кризалис груба и жестока, но если чем-то заинтересована, то это можно использовать себе на пользу.\n\nP.S. Королева Дитрисиума Хельвия никак не связана с родом Мирел, следовательно, наши противники не удержали трон. Месть через века приятна."

greneclyf_foregin.20.a:0 "«А ещё она довольно милая»"

#посредник ##### этот ивент нужно раздвоить на эквестрийский и на жучиный, ибо инфа в квадратной скобке
greneclyf_foregin.21.t:0 "Гринклиф вызывается стать посредником!" 
greneclyf_foregin.21.d:0 "Недавно объявившийся на нашем континенте Гринклиф вызвался быть третьей стороной в нашем конфликте с [вставить название страны и отзеркалить для другой]. Они видят угрозу войны и предлагают дипломатические меры для отсрочки конфликта. Послушаем ли мы их?"

greneclyf_foregin.21.a:0 "Так и быть."
greneclyf_foregin.21.b:0 "Ну уж нет!"

# Торговля с землями чейнджлингов
greneclyf_foregin.22.t:0 "Торговля с Гринклифом"
greneclyf_foregin.22.d:0 "Чейнджлинги востока предлагают нам выгодные экономические проекты ценой определенных издержек. Стоит ли нам соглашаться на сделку?"

greneclyf_foregin.22.a:0 "Конечно, почему нет"
greneclyf_foregin.22.b:0 "Сейчас это не в наших приоритетах"

# Кризалис отвергает торговлю!
greneclyf_foregin.23.t:0 "Кризалис отвергает сделку"
greneclyf_foregin.23.d:0 "Режим Земель Чейнджлингов отверг наше предложение о кооперации, при этом добавив, что это не означает разрыв связей – попросту предложенная сделка на данный момент не в их интересах."

greneclyf_foregin.23.a:0 "Что ж тогда, в другой раз"

# Гость поолночный
greneclyf_foregin.24.t:0 "Гость Полночный"
greneclyf_foregin.24.d:0 "С корабля сошел чейнджлинг в тесно на нём сидящем зеленом фраке, который первым же делом поклонился и поцеловал копыто Гиты.\n\n«Крайне польщен, ваше величество. Буду рад служить связующим звеном между нашими странами».\n\nГита кивнула, улыбнувшись и пропустив дипмиссию дальше, пока Шоу поднял бровь.\n\n«Это кто-то из родственников Хельвии. Возможно, брат. Надо узнать его получше».\n\n«Как вы это поняли, леди Гита? Блондинистые волосы?»"

greneclyf_foregin.24.a:0 "«Нет, Базальт, просто он такой же красивый»"

# Радужный всплеск
greneclyf_foregin.25.t:0 "Радужный Всплеск"
greneclyf_foregin.25.d:0 "Смотря на пируэты гринклифских самолетов, Дэш была не очень впечатлена, заявив, что это стандартные военные тактики.\n\n«Нет, нет, нет, нет, НЕТ! Вы всё делаете неправильно, ребята, это же базис! Дайте-ка мне показать вам кое-что реально улётное!»\n\nДэш запрыгнула в один из истребителей, быстро набрав высоту, и начала демонстрировать серию быстрых и агрессивных манёвров с резкими изменениями высоты и курса, затем перейдя на петли, бочки и резкие пикирования с выходами в горизонтальный полёт.\n\nВ конце концов, совершив рывок к земле в миллиметрах от поверхности, она приземлилась, выскочив из кабины перед изумлёнными пилотами.\n\n«О да! Вы это видели? Вот так летают асы!», – она хлопнула копытом по двигателю, который через секунду отвалился на землю, не выдержав перегрева.\n\nРэинбоу неловко усмехнулась, когда один из пилотов осмелился её спросить:\n\n«Мисс Дэш, не сочтите за дерзость, но вы прибыли в Гринклиф не только для того, чтобы обучать нас суицидальным трюкам, верно?»\n\n«Ну типа того, мне так дерево сказало»\n\n«Дерево..?»\n\n«Долгая история. Короче, у меня есть тут какая-то цель, и я здесь, чтобы выяснить её и решить»"

greneclyf_foregin.25.a:0 "«Или я не Элемент Верности!»"

# Торговля с эквестрией
greneclyf_foregin.26.t:0 "Торговля с Гринклифом "
greneclyf_foregin.26.d:0 "Чейнджлинги востока предлагают нам выгодные экономические проекты ценой определенных издержек. Стоит ли нам соглашаться на сделку?"

greneclyf_foregin.26.a:0 "Конечно, почему нет"
greneclyf_foregin.26.b:0 "Сейчас это не в наших приоритетах"

# РСелестия отклоняет торговое предложение!
greneclyf_foregin.27.t:0 "Селестия отказывается от сделки"
greneclyf_foregin.27.d:0 "Принцесса Селестия вежливо отказала нашему предложению о кооперации, при этом добавив, что это не означает разрыв связей – попросту предложенная сделка сейчас не в их интересах."

greneclyf_foregin.27.a:0 "Что ж тогда, в другой раз"

# Гринклиф просит защиты
greneclyf_foregin.28.t:0 "Гринклиф просит защиты!"
greneclyf_foregin.28.d:0 "Наш дальний союзник на востоке просит от нас официальных гарантий. Шаг скорее символический, но если им будет что-то грозить, то нам придется плыть через весь мир. Пойдем ли мы на это?"

greneclyf_foregin.28.a:0 "Дружба – это магия!"
greneclyf_foregin.28.b:0 "Но это так далеко..."




# CORE GYTHA - MAIN #
# Реалполитик \n\n
greneclyf_core.1.t:0 "Realpolitik"
greneclyf_core.1.d:0 "«Знаешь, мне кажется, у нас действительно странное государство», – сказала Гита, глядя на что-то вновь пишущую Ойрен.\n\n«Расплывчато. Будь поконкретнее», – ответила Ойрен, макая перо в чернильницу.\n\n«Мы используем методы и левых, и правых. Наша экономика централизована, но при этом и децентрализована. Мы даже адаптировали что-то из концептов Бикколини, которого поливают грязью и революционеры, и реакционеры половины мира. И всем этим управляет королева... Быть может, это и есть реальная гармония?»\n\nОйрен медленно моргнула, качнув головой: «Скорее, это Realpolitik. Прагматизм, иным словом. Забавно: грифоны когда-то придумали этот вид политики – и сами же утонули в войнах и разногласиях по любому поводу».\n\n«Скорее уж печально… Но, знаешь, этот подход мудрый. Его стоит адаптировать и в отношениях с нашими соседями. Будем честны: мы во многом зависим от них. Скоро они снова попытаются диктовать нам условия, как во времена кризиса», – задумалась королева.\n\n«Да что ты. Хочешь разорвать связи и наложить эмбарго, объявив автаркию?»\n\n«О нет, ни в коем случае. Торговля полезна. Просто я всё думала – как бы их сделать зависимыми от нас... И у меня есть замечательная идея».\n\nСудья устало подперла челюсть копытом, слабо улыбнувшись Гите: «Буду рада послушать».\n\n«Продать им идею, милая. Купить умы их граждан, показав, как мы живём. Внушить им, что быть с нами лучше, чем без нас», – довольно ответила королева.\n\n«Амбициозно. И как мы это будем реализовывать? Плакаты раскидаем и толкнём пару речей, получив в итоге от каких-нибудь стражников Речкограда за политагитацию?»\n\n«Элементарно, дорогая Ойрен!» – отрезала Гита."

greneclyf_core.1.a:0 "«Мы сделаем это прагматично!»"

# Гринклиф просит вступления в Коалицию 
greneclyf_core.2.t:0 "Гринклиф просит вступления в Коалицию"
greneclyf_core.2.d:0 "Королевство Гринклиф направило официальный запрос о вступлении в Речную Коалицию. По сути, они уже давно считались неофициальным кандидатом, полностью соответствуя всем требованиям и принося значительные торговые выгоды. Кроме того, их инвестиции в развитие Понайяна вызвали положительную реакцию местных пони."

greneclyf_core.2.a:0 "«У нас нет причин отказывать королеве Гите»"
# ОТКАЗ 
greneclyf_core.2.b:0 "«Мы предпочитаем дружить на расстоянии»"

# Коалиция принимает нас
greneclyf_core.3.t:0 "Коалиция принимает нас!"
greneclyf_core.3.d:0 "Отличные новости из Речкограда: Речная Коалиция официально приняла нас в свои ряды! Мы долго к этому стремились – и, к счастью, наши старания увенчались успехом.\n\n«Ура» Коалиции и слава нашей мудрой королеве!"

greneclyf_core.3.a:0 "«Ура!»"

# Бурная река 
greneclyf_core.4.t:0 "Бурная Река"
greneclyf_core.4.d:0 "Базальт,\n\nключевое звено наших операций оказалось захвачено антиконституционными тираническими элементами. Свирл и Речная Республика жизненно необходимы как для целей Гринклифа, так и для поддержания баланса в регионе.\n\nВоенное руководство под ведением Гектора Липиззана планирует совершить путч для восстановления гражданского законного правительства. Поддержи их, любой ценой приведя к победе – местные оперативники „9 Звёзд“ готовы оказать содействие.\n\nПровал недопустим.\n\nУдачи"

greneclyf_core.4.a:0 "«Будет исполнено»"

# Il Principe
greneclyf_core.5.t:0 "Il Principe"
greneclyf_core.5.d:0 "На стене кабинета висела огромная карта Коалиции, исписанная заметками и стрелками. Гита изучала их внимательным взглядом, слегка улыбаясь.\n\n«Ойри, ты помнишь, как мы в детстве играли в "Совет мира"? У нас были неполные карты мира, и мы ставили флажки туда, где хотели, чтобы больше не было войн. Когда мама рассказала мне о грифоньих революциях и гражданских войнах, мы истыкали этими флажками весь неказистый узор графств Герцленда. Помнишь?», – спросила она с неожиданной нетерпеливостью.\n\nОйрен взглянула на подругу, слегка нахмурившись: «Да... Мы ещё устраивали "суд над тиранами" – Гроверы, Кемерскай, какая-то знать Речных Земель. К чему вся эта ностальгия?»\n\nКоролева не двинулась, сверля взглядом карту. «Теперь у нас настоящие тираны. И реальная возможность стать теми, кто заставит мир прекратить войны. Я сделала всё, чтобы нас приняли. Реформы, уступки, подкуп – ты знаешь, как это было. Но теперь, когда мы стали частью Коалиции, мои глаза, наконец, узрели правду. Коалиция – это рынок, а не мечта. Все играют друг против друга, всё вертится вокруг дотаций, махинаций, превосходства...»\n\nГита повернулась, глядя через плечо прямо на Ойрен: «Я знаю про ту девчонку, которую в Саоре убил посол. Тогда, пару лет назад... это потрясло меня до глубины души».\n\nСудья поморщилась: «Гита, мы ведь тогда решили э-»\n\n«Нет!» – резко перебила королева и подошла ближе. Ойрен рефлекторно отступила.\n\n«Ты не понимаешь, Ойри. Смысл в том, что подобную мерзость из Коалиции выкорчевать способны лишь мы. Дорогая моя, даже говоря, что они гармонисты, эти пони врут нам, врут самим себе. Им неведома настоящая гармония, и покажем её им именно мы»\n\nМонарх сделала шаг назад и мягко улыбнулась ошарашенной судье: «Они не поймут язык убеждения. Их можно только переиграть. Объединить. По-настоящему объединить. Видишь карту?»\n\n«Я сделаю это одной страной»\n\nОйрен помрачнела. «Гита, чем это отличается от нелюбимых тобой тиранов? Ты идешь наперекор своим принципам»\n\n«Мои принципы всё те же – истинная гармония»\n\n«Какой ценой?! Как ты вообще убедишь их на это согласиться? А если откажутся, то пошлёшь армию?!», – выпалила судья, переходя на свою манеру из выступлений в Эряхтасе.\n\n«Поверь, у меня есть свои методы. А что до несогласных... История всегда требует жертв. К сожалению. Н-но…но Ойри, разве не лучше, если этих жертв будет мало и сейчас, чем потом, когда проклятые экстремисты окрепнут и нападут на нас?»\n\nОйрен покачала головой, потрясённая: «Ты звучишь как Гровер Второй перед походом на Речные Земли. Кажется, история повторяется, но на сей раз с востока. Неужели террористы девятизвёздочники – это твоих копыт дело?»\n\nГита промолчала, отвернувшись к окну.\n\n«Гита... Я люблю тебя. И я тебе предана. Но подумай, кем ты становишься». Судья направилась к двери, оставив королеву наедине с самой собой: «Увидимся позже»."

greneclyf_core.5.a:0 "«Цель... оправдывает средства?»"

# Мать-основательница
greneclyf_core.117.t:0 "Мать-Основательница"
greneclyf_core.117.d:0 "Когда были объявлены результаты выборов, она не удивилась. 73% избирателей избрало её в качестве первого президента Федерации. Теперь взгляды были устремлены на неё не только в Гринклифе – за каждым её шагом следили народы всей новой великой нации.\n\nПосле победы она почти ничего не почувствовала. Некоторые регионы голосовали из страха перед террором „9 Звёзд“, в других просто исчезли все альтернативные кандидаты-сепаратисты, оказавшиеся неудобным.\n\nОна долго смотрела в своё отражение в зеркале. Можно ли с уверенностью сказать, что всё это того стоило? Возможно, на этот вопрос смогут ответить только историки и грядущие поколения. Пока она не знала.\n\nНо она знала другое: теперь на её плечах лежит ответственность, куда большая, чем прежде.\n\nВыйдя из комнаты, она наткнулась на Базальта Шоу.\n\n«Ваше ве-...госпожа президент. Всё ли готово?»\n\nОна закрыла глаза. «Я оставила бумаги для Ойрен. Она пока не в духе, не хочет видеться со мной... Попроси потом Кианита передать ей: на время исполнения мною обязанностей президента она официально назначается леди-регентом Королевства Гринклиф. Я не могу совмещать обе должности – таковы правила».\n\nГлава её секретной службы, ставший одним из главных представителей федеральной разведки, кивнул, подтверждая приказ.\n\n«Как только передашь – можем отправляться»."

greneclyf_core.117.a:0 "Королева поведёт Гринклиф и Речные Земли в новую эпоху!"
greneclyf_core.117.b:0 "Возможно, нам подойдёт Ривер Свил..."

# Роял-флеш
greneclyf_core.7.t:0 "Роял-флеш"
greneclyf_core.7.d:0 "Свит Спринкл зачитывала перед Советом директоров ОРК официальное требование королевства: выкупить СЭЗ Саор по весьма щедрой цене.\n\nДиректора были в бешенстве. Комната закипела от споров, пока один из членов Совета – представитель Депонии – не обратил внимание на хитрую ухмылку Свит Спринкл.\n\n«Госпожа администратор, а чему вы так улыбаетесь? Вы ведь теряете свою работу».\n\nСвит только шире улыбнулась: «Теряю ли? Господа, рада сообщить, что по уникальному пункту соглашения о продаже Саора я получаю специальные преференции от королевства: гражданство и должность в правительстве».\n\nЗал вздрогнул. Кто-то разинул рот, кто-то недоверчиво фыркнул.\n\n«Более того», – Спринкл прищурилась, – «внимательнее перечитайте оригинальный договор о создании СЭЗ. Конкретно отредактированный пункт о том, что в случае предложения выкупа со стороны Гринклифа вы обязаны согласиться. В качестве компенсации вам полагаются дивиденды на длительный срок».\n\nВ комнате воцарилась тишина.\n\n«Так что прошу вас поскорее закончить этот балаган, подписать проклятую бумагу и не задерживать нас тут».\n\nОна встала, легко потряхивая копытами: «Ах да, и примите мою увольнительную. Брокером ОРК я больше не работаю»."

greneclyf_core.7.a:0 "«Та-та, джентельпони!»"

# Новый кардинал 
greneclyf_core.8.t:0 "Новый Кардинал"
greneclyf_core.8.d:0 "Гита помнила обещание, данное старику в Блосмпорте, и оставалась верна своему слову. Сегодня вечером колокола Блосмпортского Аббатства пробили долгожданную мелодию, которую верующие ждали десять лет.\n\nКак глава Церкви Святой Леди Матроны, королева Гита приняла присягу претора Актино, даровав ему сан кардинала Геральда III. С этого момента он будет определять развитие религиозной мысли на долгие годы, прекращая раскол.\n\nПриняв святые регалии, Геральд III поприветствовал паству, которая пала на колени в молитве."

greneclyf_core.8.a:0 "«Да будет воля Её услышана!»"

# Королева и конституция
greneclyf_core.9.t:0 "Королева и Конституция"
greneclyf_core.9.d:0 "Когда Ойрен презентовала Гите проект Конституции, она едва сдерживала радость и гордость за проделанную работу. С горящими глазами она рассказывала о каждой статье, о ротации чиновников, о выборных сроках, пока не остановилась на пустом поле. \n\n«А это место пока свободно», – сказала Ойрен. «Здесь должна быть статья о структуре исполнительной власти».\n\nГита нахмурилась: «Хм... почему же оно пусто? Ты что-то задумала?»\n\n«На самом деле да», – кивнула Ойрен. «У меня есть два предложения касательно этой части Конституции: Вариант первый – мы сохраняем статус-кво, но фиксируем его в законе. Иначе говоря, полнота власти остаётся за королевой, которая сама решает, что утверждать, а что нет.\n\nВариант второй – мы вводим институт премьер-министров. Гита, ты делаешь слишком много, каждой королеве нужно второе официальное лицо, которое будет опорой. У меня есть детальные проекты для обоих вариантов, но я хочу услышать твоё мнение».\n\nКоролева задумалась, медленно перелистывая страницы..."

greneclyf_core.9.a:0 "«Я считаю, что мы должны оставаться гибкими»"
greneclyf_core.9.b:0 "«У меня есть как раз кое-кто на примете для поста премьера»"

# Да, министр
greneclyf_core.10.t:0 "Да, Министр!"
greneclyf_core.10.d:0 "Ойрен перекривилась, нервно задергав глазом. Единственное, что она смогла выдавить из себя, было приглушённое «Хе?..»\n\n«Ну да. Кто ещё лучше справится, если не ты?» – беспечно ответила на её удивление королева.\n\n«Гита, Гита, Гита, ГИТА! Это невозможно! Я – Верховная Судья! Я представляю законодательную власть!»\n\n«Ну, а я говорю, что возможно» – хихикнула Гита. «Ты не только Верховная Судья, но и Мать Конституции, Ойрен из рода Ойр. Если кто и заслужил этот пост, то явно ты, а не какой-нибудь префект вроде хвастуна Кэрриона».\n\nГита сделала шаг вперёд и мягко посмотрела ей в глаза: «Пожалуйста, Ойри. Ты мне нужна».\n\nОйрен глубоко вдохнула, затем выдохнула... после чего завыла в потолок и рухнула мордой на стол.\n\n«Да уж... Я явно не была готова к тому, что стану официальной второй особой страны, таща на себе и законодательную, и теперь ещё часть исполнительной власти... Может, ты мне и корону свою отдашь?», – саркастично пробормотала она, сверля Гиту уставшим взглядом.\n\nКоролева рассмеялась: «Может. Правда, скорее, твоим детям».\n\nОйрен застыла, а её щёки будто бы на секунду отдали розовым. Затем с глухим стуком она снова уткнулась мордой в стол, зарыв лицо в копыта."

greneclyf_core.10.a:0 "«Ах, до чего же поэтично всё вышло, Ойри!»"

# Ubi mel, ibi apes  #####! Ключа этого ивента я не нашел. Фокус Проект «Apis», внутренняя политика
greneclyf_core.6.t:0 "Ubi mel, ibi apes"
greneclyf_core.6.d:0 "Целарл спокойно выждал, пока депутаты заняли свои места. Затем он поправил очки, включил проектор, и на огромном полотне появились снимки дронов с поясняющими подписями. \n\n«Приветствую, уважаемый созыв. Без лишних вступлений, сегодня я хочу представить вам результаты моих исследований в области повышения эффективности труда. Однако мои эксперименты касались вовсе не экономических стратегий. Нет, я исследовал явление, относящееся к биологии. И вот что мне удалось выяснить: видите ли, в каждом из нас есть определенный недостаток апилактозы, весьма сложного соединения, вырабатываемого... пчёлами», – в зале раздались шёпоты. Учёный прокашлялся и невозмутимо продолжил.\n\n«В ходе лабораторных экспериментов я провёл серию тестов на добровольцах, вводя им раз в неделю смесь раствора апилактозы и специфических гормональных соединений, которые в простонародье называют “любовью”. Результаты оказались поразительными. Испытуемые ощутили прилив сил, снижение тревожности и улучшение концентрации на сложных задачах. По оценкам моих ассистентов, их трудоспособность возросла в среднем на 26,765%. Уважаемые делегаты, я предлагаю организовать промышленное производство этой смеси и использовать её в качестве добавки в школьном питании и на предприятиях. Разумеется, под мою ответственность.».\n\nНаступила пауза. Затем начались ожесточённые дебаты. Оппозиция кричала про «этику и мораль», но приверженцы прогресса утверждали, что Гринклифу нужны инновации."

greneclyf_core.6.a:0 "С небольшим перевесом проект был принят"


## ARCTIC ##
# Арктика найдена ##### не нужно, нарратив по фокусам есть. Я могу добавить, но резона нуль – перегруз будет текстом
greneclyf_arctic.1.t:0 "Необычная экспедиция"
greneclyf_arctic.1.d:0 "Рыбаки из малых ульев северного Эйслинга, ведомые голодом направились на доселе неизведанные земли - грозный северо-восток\n\nПроведя 3 недели в безуспешных поисках найти рыбу и иную живность, они наткнулись на одинокий, казалось бы райский остров посреди вечного льда\n\nПосле донесений рыбаков, королева отдала свой приказ..."

greneclyf_arctic.1.a:0 "Нам стоит основать здесь фарпост"

# Сектор сирпински
greneclyf_arctic.2.t:0 "Сектор Сирпински"
greneclyf_arctic.2.d:0 "Ронове обустраивалась на своей новой работе на полярной станции. Она всегда была замкнутой – порой это становилось причиной травли, особенно в школе. Окончив обучение в Эйслинге, она сразу же подала заявку на участие в программе освоения Севера. Получив довольно быстро положительный ответ, она покинула свой нелюбимый дом.\n\nВ окне она смотрела на бескрайние снежные просторы, изрезанные силуэтами многоэтажных жилых зданий, выросших за годы освоения. Там жили другие пионеры севера: учёные, солдаты. Были и такие же, как она, волонтёры.\n\nВпервые за всю свою жизнь она ощутила... покой. Может, жизнь в арктической пустыне, постепенно обрастающей зданиями, и не мечта каждой молодой чейнджлингини, но её нынешнее положение устраивало более чем.\n\nРонове сделала несколько щелчков на массивном радиопередатчике, мимолётно взглянув на постер с изображением отдающего честь солдата в противогазе. Настроив нужную волну, она отхлебнула кофе, слегка отодвинув в сторону лежащие рядом пластинки, которые иногда ставила в эфир, и начала говорить в микрофон:"

greneclyf_arctic.2.a:0 "«Внимание. Внимание. 39486 60170...»"

# Forces #
greneclyf_forces.3.t:0 "Securing Our Arctic Trade Routes"
greneclyf_forces.3.d:0 "Half of the year, the seas around Greneclyf are locked in ice, turning commerce into a constant struggle against nature itself. Merchants complain of lost profits, captains curse the frozen waves, and the kingdom’s economy suffers from the unpredictable rhythm of the seasons. Now, however, the Queen has declared that this burden shall no longer be tolerated. The navy is tasked not merely with defending our shores, but with breaking the icy chains that bind our trade. Icebreakers, new routes, and daring expeditions may finally turn the northern seas from an obstacle into a lifeline—if we can muster the will to endure the challenge."

greneclyf_forces.3.a:0 "The sea shall serve us, not hinder us."

# Перепутье
greneclyf_forces.4.t:0 "Перепутье"
greneclyf_forces.4.d:0 "«Ваше Величество, Ваше Превосходительство», –отсалютовал Семпер Фай, войдя в кабинет с двумя увесистыми папками, –«после длительных и оживлённых бесед с вашими любезными курсантами и теоретиками спешу сообщить, что наш флот находится в весьма достойном по современным меркам состоянии».\n\n«Что ж, это радует», – ответила Судья.\n\n«Однако, чтобы сохранить стратегическое превосходство в регионе, нам необходимо определиться с дальнейшей доктриной. Видите ли, в современном мире выделяют три основные концепции развития военно-морского флота. Однако последняя – экспериментальная и невероятно дорогая в производстве, поэтому, как контр-адмирал королевства, я предлагаю исключить её из рассмотрения и сосредоточиться на первых двух».\n\nФай прокашлялся, поймав одобрительные кивки главных лиц государства, и затем положил перед ними папки.\n\n«Красная папка представляет доктрину, сосредоточенную на совершенствовании существующей структуры нашего доблестного флота с учётом современных реалий. Наш флот силён, и я настаиваю на развитии нашей ударной флотилии. Тогда, –Семпер быстро стукнул по столу, –мы обгоним даже проклятых бакарцев, фактически заявив права на весь регион».\n\nПока Ойрен с удовлетворённым видом изучала папку, Гита спросила адмирала: «А что же зелёная папка? О чём она?»\n\nФай слегка замялся: «Это альтернативный план развития флота, но... скажем так, запасной. Он исходит из заведомо осторожной, если не пораженческой, позиции – что нашего флота недостаточно для доминирования в морях, а потому следует сосредоточиться на подводных лодках и рейдерских атаках на вражеские суда. Мне этот план не очень по душе не только из-за уязвлённой гордости, но и из-за его подхода. Основная ресурсная база наших потенциальных соперников находится на континенте, а значит, нам будет сложно нанести решающий удар. Однако в условиях политической нестабильности региона это позволит буквально задушить континент, лишив его связей с внешним миром»."
# Линкоры
