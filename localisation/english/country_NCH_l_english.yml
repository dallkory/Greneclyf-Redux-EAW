### FOCUSES ###
# Pre crisis #

NCH_legacy:0 "The Legacy of Eithne"
NCH_legacy_desc:0 "The glorious Queen Eithne of Clann Óir left us last year, having brought the country into the age of steam engines, machinery, and railways by sheer force of will. Though the hives gained much from her reforms, there were downsides as well..."

NCH_divided_house:0 "A House Divided"
NCH_divided_house_desc:0 "Though Gytha had been prepared for the throne since youth, she had rarely ventured beyond Blosmport. To witness firsthand the realities of life in the hives and gain a true understanding of the struggles and desires of the common drone, the queen made the decision to embark on a small tour across the island, accompanied by Lady Oiren."

NCH_parliament_convocation:0 "The Summoning of the Oireachtas"
NCH_parliament_convocation_desc:0 "Since ancient times, the Queens of Greneclyf have relied on the Oireachtas — an analogue of parliament closely tied to the Church. Now, the time had come for the first summoning of this body under the new queen. Long and turbulent discussions lay ahead, during which Gytha and her advisors would determine the nation's future for years to come."

NCH_Spy_experience:0 "Study the Recent Experiences"
NCH_Spy_experience_desc:0 "In the 1970s, Eithne introduced the practice of infiltrating the societies of various nations in Griffonia, allowing our citizens to study at local universities and gather information about the outside world. Just before her death, the latest graduates returned, and their experiences must now be utilized to help develop the kingdom."

NCH_new_housing:0 "New Housing?"
NCH_new_housing_desc:0 "Overpopulation has created an unforeseen problem: our residents no longer have enough space in the hive cities. We lack both the resources and time to build an entire new hive, but one of the graduates from the architecture faculty of Aquila has an interesting proposal..."

NCH_find_they_job:0 "Find Them Work!"
NCH_find_they_job_desc:0 "Facing two problems – education and unemployment – some economists have concluded that a profitable solution could be found for both by directing the unemployed to build schools on the outskirts of Bugsmere and Blosmport. If the experiment succeeds, it will be the first step towards the urbanization of the island and solving the unemployment issue."

NCH_lift_the_veil:0 "Lift the Veil"
NCH_lift_the_veil_desc:0 "800 years ago, we signed the 'Great Agreements' with Farbrook, and it seems that the time has come for another trade season. However, after Eithne’s modernization, it appears that the fishermen can offer us little besides fish... I hope Celhelm will not be offended by the diminished enthusiasm of our traders."

NCH_learn_from_mistakes:0 "Learning from Mistakes"
NCH_learn_from_mistakes_desc:0 "Eithne’s reforms advanced faster than society could adapt, fueling the current crisis and leaving social structures struggling. To address this, Prefect Carrion proposes the Nation’s Birth Movement, a program to retrain citizens and break from past communal habits. He argues our former society lacked a true national identity—perhaps his approach will pave the way forward."

NCH_typography:0 "Establish the State Printing House"
NCH_typography_desc:0 "Greneclyf has never had a standardized printing press. Even during Eithne's time of change, this phase was skipped, as information was seen as something military or noble, but never truly public. Our soldiers send messages via telegraphs, yet our citizens cannot even read the latest news. It’s time to fix that!"

NCH_take_look_around:0 "Take a Look Around"
NCH_take_look_around_desc:0 "Surprisingly, the River Coalition doesn't even know we exist! Despite being just across the channel from Bakara, the turbulent waters and rumors of necromancers have always deterred ponies from exploring the north. Our traders might start a business with them, blending in with Farbrook's settlers — let's see if this will be profitable. After all, it's unlikely the local ponies will be ready to meet a changeling in all its glory."

NCH_Esteblish_trade_guild:0 "Establish the Trade Guild"
NCH_Esteblish_trade_guild_desc:0 "Trade is no longer driven by artisans and enthusiasts but by manufactories and capitalists. To coordinate this wealthy class and align their efforts with the kingdom’s interests, Gytha and the Oireachtas are founding the Trade Guild and introducing universal enterprise registration."

NCH_time_to_look_further:0 "Time to Look Further"
NCH_time_to_look_further_desc:0 "Her Majesty Gytha has done well to solve the kingdom’s primary issues. Now, it’s time to look at how things are going in the state."

# Crisis #
NCH_beginning_of_crisis:0 "То, чего нельзя избежать"
NCH_beginning_of_crisis_desc:0 "Это случилось вновь. Второй Великий Голод сокрушительной волной захлестнул нас, и тучи затянули остров. Сохрани нас Матрона..."

NCH_to_neighbors:0 "Конец пряток"
NCH_to_neighbors_desc:0 "Ситуация вынуждает Гринклиф «открыть личико» гораздо раньше, чем мы планировали. Нам не только нужно попросить помощи у наших старых друзей с холмов, но и, наконец, заявить о себе Коалиции."

NCH_reguest_of_help:0 "Встреча с торговыми эмиссарами"
NCH_reguest_of_help_desc:0 "Представители Коалиции проявили сдержанное любопытство после встречи с нашими послами. В качестве знака доброй воли и начала переговоров о помощи королева лично хочет встретиться с ними. Будем надеяться, что это их впечатлит."

NCH_army_concessions:0 "СЭЗ Саор"
NCH_army_concessions_desc:0 "Создание так называемой «Свободной экономической зоны Саор» было одним из требований эмиссаров Коалиции. Проще говоря, речные пони арендуют у нас часть Эйслинга, строя за свой счёт портовые предприятия и развивая бизнес, помогая как нашему населению, так и своему за счёт выгодной торговой точки. На бумаге звучит хорошо, но как будет на деле?"

NCH_concessions_for_help:0 "Полиция Саора"
NCH_concessions_for_help_desc:0 "Для поддержания порядка в Саоре Объединённая Речная Компания потребовала отправить свой собственный частный полицейский полк. Кажется, если речные нации когда-нибудь и бывают едины, то только когда их общим деньгам что-то угрожает..."

NCH_every_friend:0 "Отправить посла в Фарбрук"
NCH_every_friend_desc:0 "Королева распорядилась отправить чрезвычайного поверенного к племенам Фарбрука. Несмотря на их скудный улов в этом году, нашим гражданам всё ещё жизненно необходимы не только обычное питание, но и любовь, которой пони холмов обеспечивают нас с момента заключения Великих Соглашений."

NCH_hoof_of_help:0 "Копыто помощи"
NCH_hoof_of_help_desc:0 "Не одним Фарбруком живы холмы: разведка зафиксировала два других сообщества западнее – Ручьеград и Еловые Деревни. Будет уместно предложить им дружбу, особенно сейчас, когда выбирать не из кого."

NCH_some_love:0 "Дела любовные"
NCH_some_love_desc:0 "У Гиты возникло весьма неординарное решение, как можно добыть больше любви своей родине. Может, даже слишком неординарное."

NCH_overvise_great_packt:0 "Пересмотр Великих Соглашений"
NCH_overvise_great_packt_desc:0 "Наших старых договоров с Фарбруком недостаточно в современном мире. Раз уж мы открыли свои земли для речных стран, нам следует заключить новые соглашения, чтобы удержаться на плаву посреди капиталистического хаоса."

NCH_mre_cards:0 "Введение рационов"
NCH_mre_cards_desc:0 "Реагировать нужно быстро. Виксит умна, и она уже определила, что делать в Роще – мы последуем её примеру. По всему королевству вводится официальная система продуктовых рационов, выдаваемых по талонам, а также комендантский час по вечерам для предотвращения беспорядков."

NCH_limit_external_trade:0 "Расширение экспорта обсидиана"
NCH_limit_external_trade_desc:0 "Наш остров богат минералами, но особенно много у нас вулканического стекла – обсидиана. Другие страны не знают, как применять этот ресурс, и именно поэтому мы не только будем продавать его, но и отправлять за границу наших специалистов, умеющих использовать обсидиан в самых разных сферах – от медицины до строительства."

NCH_agroindustrial_mobilization:0 "Новые методы сельхоза"
NCH_agroindustrial_mobilization_desc:0 "Святая Роща – наша великая житница, пострадавшая в результате провального эксперимента аграриев, учившихся в долине Эви. Чтобы как можно быстрее обеспечить граждан хлебом, мы импортируем и высадим на полях устойчивые культуры из речных земель. Баронесса Виксит приложит все усилия, чтобы ускорить получение урожая."

NCH_modernization_industry:0 "Отказ от золотого стандарта"
NCH_modernization_industry_desc:0 "Во времена правления Эньи наша валюта была привязана к так называемому «золотому стандарту». Однако опыт наших агентов и нанятых советников показывает, что в текущей ситуации, когда экономика Гринклифа растёт благодаря антикризисной мобилизации, жизненно необходимо перейти на привязку валюты к ВВП. Разумеется, этот процесс будет проходить под строгим контролем Казначейства."

NCH_industrial_cooperatives:0 "Королевский Институт имени Эньи"
NCH_industrial_cooperatives_desc:0 "У нас нет широкой базы образовательных реформ, но обстоятельства требуют немедленных действий. Королева своим указом объявляет об открытии двух первых факультетов будущего университета в величественном здании центральной библиотеки Блосмпорта: экономики и естественных наук. Это наш первый необходимый шаг для формирования национальной интеллектуальной элиты."

NCH_agroindustrial_programs:0 "Распределение излишков"
NCH_agroindustrial_programs_desc:0 "В продовольственном запасе скопился небольшой излишек. Нам нужно распределить его среди населения, но таким образом, чтобы это принесло королевству максимальную выгоду в текущей ситуации."

NCH_domestic_consumption:0 "Покрыть внутреннее потребление"
NCH_domestic_consumption_desc:0 "Мы выдержали! Правление Гиты смогло справиться с кризисом и предотвратить в зародыше проблему голода, избежав катастрофы. Теперь, когда самое страшное позади, настало время заняться социальными вопросами, что неожиданно всплыли на фоне прочих проблем..."

NCH_emergacy_plan:0 "Чрезвычайные меры"
NCH_emergacy_plan_desc:0 "После чрезвычайного созыва Эряхтаса было единогласно решено ввести режим ЧП по всей стране, мобилизовать предприятия и усилить охрану агропрома. Впереди нас ждёт много работы."

NCH_call_for_unity:0 "Задействовать пропаганду"
NCH_call_for_unity_desc:0 "Для типографии Гагата нашлась наиважнейшая работа в эти непростые времена – стать рупором стабильности и воли королевы. Новообразованный Отдел Информации и Пропаганды нашей Канцелярии сиюминутно начнет формировать повестку для успокоения населения, донося её через газеты."

NCH_consolidation_political:0 "Заручиться поддержкой церкви"
NCH_consolidation_political_desc:0 "Давним союзником короны в Гринклифе является Церковь Леди Матроны – старейший религиозный институт страны, возникший вскоре после закрепления родами Леманн и Ойр системы правления Athsholáthar Cothrom. В условиях кризиса разумно обратиться за помощью к Актино, влиятельному претору Блосмпорта."

NCH_clans_of_Greneclyf:0 "Ввести военное положение"
NCH_clans_of_Greneclyf_desc:0 "Радикалы и недовольные собираются провести несанкционированный митинг в столице. Гита приказала префекту Кэрриону занять оборонительные позиции и подготовить солдат. Ойрен, получив её санкцию, объявляет временное военное положение. §RВНИМАНИЕ, ВЗЯТИЕ ЭТОГО ФОКУСА СЛИШКОМ РАНО ПРИВЕДЕТ К НЕПОПРАВИМЫМ ПОСЛЕДСТВИЯМ§"

NCH_suppression_of_unrest:0 "Вскрыть гнойник"
NCH_suppression_of_unrest_desc:0 "Согласно долгосрочному расследованию нашего доблестного лорда-протектора и тайной службы, в стране действует целое подполье враждебных короне элементов, вздумавших развязать кровавую гражданскую войну ради власти. Чтобы брат не пошёл на брата, мы должны вычистить страну от паразитов."

NCH_final_crisis:0 "Ясное небо над Гринклифом"
NCH_final_crisis_desc:0 "Голод остановлен, а сын не пошел на отца. Королева Гита смогла спасти нас от Второго Великого Голода, но кризис изменил навсегда как Гринклиф, так и самого монарха. Пока неясно, что приготовит нам будущее, но сейчас можно выдохнуть."

### MAINT PATCH ###
# Gytha reforms patch #
NCH_reforms_after_storm:0 "Продолжить путь Эньи"
NCH_reforms_after_storm_desc:0 "После завершения кризиса мы не можем позволить себе бездействие. Нам необходимо продолжать реформирование страны, чтобы впредь никогда больше не допустить ситуации, которая едва не привела ко Второму Великому Голоду."

NCH_patch_to_prosperty:0 "Королевские указы"
NCH_patch_to_prosperty_desc:0 "Для решения социальных вопросов Ойрен подготовила и согласовала через Эряхтас первый пакет пост-кризисных декретов. Отдел информации и пропаганды Канцелярии немедленно обнародует их после подписания королевой, разослав через типографию Гагата весть об очередных переменах."

NCH_health_care_reform:0 "Обязательное страхование"
NCH_health_care_reform_desc:0 "Каждый гражданин королевства должен знать, что его жизнь и здоровье находятся под защитой. Отныне ни один рабочий не будет умирать в нищете, погрязая в долгах за оказанную медицинскую помощь."

NCH_education_reform:0 "Ликвидация безграмотности"
NCH_education_reform_desc:0 "Одна из главных проблем перенаселения – нехватка мест в школах, особенно в деревнях. Пришла пора решить этот вопрос: расширить существующие школы и поощрять открытие кружков для чтения в библиотеках по всей стране."

NCH_civil_rights_reform:0 "Освоение севера и юга"
NCH_civil_rights_reform_desc:0 "Нам нужны новые земли, чтобы разгрузить перенаселённые районы. Виксит предлагает масштабные проекты урбанизации Святой Рощи и Эйслинга, учитывая опыт Жукомира, чтобы избежать разрушения экосистемы. С консультациями Бериллы и главного архитектора Вальги у неё всё должно получиться."

NCH_blosmport_hive:0 "Открытие Института"
NCH_blosmport_hive_desc:0 "Королевский Институт имени Эньи наконец-то избавляется от временного статуса и превращается в полноценный университет с широким выбором факультетов."

NCH_birth_control:0 "Контроль рождаемости"
NCH_birth_control_desc:0 "Чем больше населения, тем лучше, но всему есть предел. Перенаселение стало угрозой, и нам необходимо замедлить темпы роста, ради чего вводится закон о штрафах за рождение третьего и последующих детей. К сожалению, сейчас это необходимая мера."

NCH_new_instituts:0 "Культ прогресса"
NCH_new_instituts_desc:0 "Мы обречены двигаться только вперёд, только в будущее, где нашему королевству и место! Наша цель – построение социального государства всеобщего благосостояния и культивация прогрессивных идей в обществе."

NCH_traditional_way_of_life:0 "Социальный консерватизм"
NCH_traditional_way_of_life_desc:0 "Государство должно заботиться о своих гражданах, но это может делать только настоящая патриотическая власть. Чиновник не должен быть космополитом – он национальный слуга. Матрона, законы и сама нация ведут общество вперёд, а не слепая вера в абстрактные идеалы."

NCH_first_constitution:0 "Конец схизмы"
NCH_first_constitution_desc:0 "После смерти последнего кардинала претория Церкви десять лет не могла прийти к согласию о том, кто должен стать новым глашатаем Матроны. Трёхсторонний раскол затянулся, и настало время положить конец этим бесплодным спорам. Королевская прерогатива позволит выбрать нового кардинала и восстановить единство веры."

NCH_from_chaos:0 "Благожелательное правление"
NCH_from_chaos_desc:0 "Монарх отвечает за свой народ. Гита изучала историю, и одно из самых поучительных событий на континенте – революция в Империи Грифонов, которая привела к гражданской войне и падению гегемона. Чтобы избежать этих ошибок, мы начнём частичное внедрение республиканских институтов в монархическую систему."

NCH_form_new_govermant:0 "Идеи справа"
NCH_form_new_govermant_desc:0 "Идеи Бикколини выглядят экзотично, но в них есть рациональное зерно, которое мы можем позаимствовать: корпоративная организация государства. Конечно, фашистская эстетика нам не нужна, но нижняя палата Эряхтаса теперь будет формироваться из учёных, рабочих и военных, а верхняя станет выборной."

NCH_reflecting_the_past:0 "Идеи слева"
NCH_reflecting_the_past_desc:0 "После разгона марксистов наше государство твёрдо встало на путь антикоммунизма, но чрезмерное давление может привести к новым волнениям и революциям. Чтобы не допустить социальных потрясений, мы создадим систему государственных профсоюзов и официально закрепим 8-часовой рабочий день. Теперь ни один мануфактурщик Жукомира не посмеет угнетать рабочих, а демон марксизма не нашепчет им ложные надежды."

NCH_to_the_new_order:0 "Первая Конституция"
NCH_to_the_new_order_desc:0 "После долгих лет подготовки Ойрен наконец-то завершила работу: теперь у нас есть проект первой конституции Королевства Гринклиф. Пришло время выслушать её основные положения и утвердить этот исторический документ."

NCH_save_clans_system:0 "Статус-кво"
NCH_save_clans_system_desc:0 "Было принято историческое решение: законодательно закрепить монарха как полноправного главу исполнительной власти. Теперь королева всегда сможет выбирать путь развития страны, а Эряхтас будет либо поддерживать эти изменения, либо служить мудрым противовесом."

NCH_hereditary_monarchy:0 "Весы и скипетр"
NCH_hereditary_monarchy_desc:0 "Гита приняла решение: в Королевстве Гринклиф появится ранее чуждый институт премьер-министров. Монарх будет лично утверждать премьера на четырёхлетний срок, и королева уже знала, кого назначить. Пришло время официально объявить о своём выборе."

NCH_economic_revival:0 "Экономический бум"
NCH_economic_revival_desc:0 "Во время кризиса королевство провело мобилизацию экономики и получило вливание инвестиций из речных стран. Это привело к стремительному росту производства и бурному развитию торговли. Наша экономика перегрета, но у нас есть возможность использовать ресурсы с умом и воспользоваться моментом, чтобы привести Гринклиф к настоящему процветанию!"

NCH_businesses_do_not_stand_idle:0 "Выкупить Саор"
NCH_businesses_do_not_stand_idle_desc:0 "Специальная Экономическая Зона Саор выполнила свою задачу и должна вернуться в родную гавань. Конечно, это будет недёшево, но Улисс – это наш город, а не владение Объединённой Речной Компании. Пора оформить сделку."

NCH_bee_productivity:0 "Проект «Apis»"
NCH_bee_productivity_desc:0 "«Apis» – уникальная экспериментальная добавка для чейнджлингов, созданная учёным Франсером Целарлом. Эта инновация повышает работоспособность и способность к концентрации. На ближайшем заседании Эряхтаса Франсер представит свой проект."

NCH_brood_of_working_drones:0 "План «Formicidae»"
NCH_brood_of_working_drones_desc:0 "Гринклиф не бесконечен, и даже после освоения Эйслинга или Рощи, население продолжит расти. Ксилопа Вальга представила так называемый план «Formicidae» – амбициозный архитектурный проект подземного гражданского строительства. Этот проект не только решает проблемы пространства, но и оказывается стратегически важным с военной точки зрения, поскольку подземные города смогут выдержать любую бомбардировку, если, не дай Матрона, война всё же придет в наш дом."

NCH_ensure_full_employment:0 "Невидимое копыто рынка"
NCH_ensure_full_employment_desc:0 "Никто в нашем правительстве не доверяет концепту свободного рынка, особенно после действий ОРК. Поэтому Королевский Институт имени Эньи выдвинул две концепции для возможного выбора экономической мысли страны: «Восточный Феникс» и «Гармонический солидаризм»."

NCH_gaining_economic_power:0 "Поддержка среднего класса"
NCH_gaining_economic_power_desc:0 "Средний класс – это опора любой цивилизованной нации. Чем больше его представителей, тем стабильнее будет наше общество. Правительство должно приложить все усилия, чтобы большая часть граждан принадлежала именно к этой категории, имела возможность не просто существовать, но и жить."

NCH_mobilizing_the_economy:0 "Восточный Феникс"
NCH_mobilizing_the_economy_desc:0 "«Восточный Феникс» – это концепция централизованного рыночного этатизма, где экономика строится на экспорте, индустриализации и жёстком государственном контроле над стратегическими сферами. Государство активно вмешивается в рынок, создавая условия для роста производства и предпринимательства. Через частный сектор правительство управляет экономикой, направляя усилия на укрепление внутреннего производства и укрепление позиций на внешнем рынке."

NCH_economics_of_friendship:0 "Гармонический солидаризм"
NCH_economics_of_friendship_desc:0 "«Гармонический солидаризм» – это экономическая система, основанная на сотрудничестве и общественном благе, вдохновленная принципами гармонии и канонами церкви Матроны. Суть солидаризма заключается в кооперативной собственности и межклассовом социальном партнерстве. Важной частью этой системы является планирование, которое станет основой для организации производства и распределения ресурсов, что позволит обеспечить баланс и стабильность в экономике, ориентированной на общее благо."

# Gytha diplomatic patch #
NCH_we_are_not_alone:0 "Мы не одни"
NCH_we_are_not_alone_desc:0 "События кризиса ясно показали, что блаженная изоляция осталась в прошлом. Пришло время познакомить мир с Гринклифом, держа наготове и перо, и меч."

NCH_new_opportunities:0 "Взор на Восток"
NCH_new_opportunities_desc:0 "На Востоке мы видим континент, раздираемый войнами и конфликтами, где балом правят насилие и слёзы по минувшим дням. Но там же мы видим и свет надежды – Речную Коалицию. Очевидно, что наши судьбы будут связаны с речными пони. Вопрос лишь в том, насколько тесными станут эти узы?"

NCH_our_mission:0 "Взор на Запад"
NCH_our_mission_desc:0 "За непроходимыми ледниками и проливами лежит наш дом – Эквус. Почти тысячу лет ни одно копыто чейнджлингов из родов Леманн и Ойр не ступало на его землю, но мы точно знаем, что Эквестрия существует по сей день. Нам необходимо встретиться с ними, чтобы понять, какова ситуация на родных просторах. Конечно, пони будут рады чейнджлингам... не так ли?"

NCH_neighborhood:0 "Добрососедство"
NCH_neighborhood_desc:0 "В ходе кризиса мы выяснили, что помимо племён Фарбрука, на холмах живут ещё два сообщества пони – Ручьеград и Еловые Деревни. Нам следует обратить на них внимание, закрепить своё влияние и... цивилизовать их."

NCH_another_visit:0 "Верный друг в холмах"
NCH_another_visit_desc:0 "Среди холмов есть одно сообщество, которое привлекло особое внимание королевы – Ручьеград. Святые источники, богатые минералами воды, и удивительно мирное сосуществование делают это квази-государство самым стабильным в регионе. Именно поэтому так важно заручиться поддержкой Хранительницы Изелин."

NCH_pacts_exchange_for_support:0 "Предлагая дружбу"
NCH_pacts_exchange_for_support_desc:0 "Мы официально предложим пони холмов помощь в индустриализации и обучении населения в обмен на любовь и поддержку Гринклифа в настоящем и будущем, тем самым обновляя Великие Соглашения. Посмотрим, согласятся ли они."

NCH_long_cooperation:0 "Пожиная плоды"
NCH_long_cooperation_desc:0 "Получив, наконец, плацдарм в регионе, нам необходимо разработать план дальнейшей интеграции холмов в королевство. Королева явно не будет рада, если они откажутся от нашей дружбы, так что следует подтолкнуть их к принятию."

NCH_not_so_different:0 "Не такие уж и разные"
NCH_not_so_different_desc:0 "Всё обошлось, и пони холмов готовы принять нас! Это радостное событие доказывает, что наши ценности едины, и в честь этого мы как можно скорее начнём строить единое сообщество, демонстрируя всему миру образец гармонии."

NCH_bring_them_harmony:0 "Всё-таки мы разные"
NCH_bring_them_harmony_desc:0 "Некроманты, варлорды, дикари, язычники... Холмы оказались куда более опасным и непредсказуемым местом, чем мы ожидали, в результате чего Семпер Фай издаёт указ о насильственной депортации экстремистских элементов в необитаемые земли дальнего севера. Так или иначе, но гармония вернётся в эти края."

NCH_new_great_agreement:0 "Континентальные префектуры"
NCH_new_great_agreement_desc:0 "Военно-морской флот под командованием Семпера Фая одержал триумфальную победу, расширив границы нашего королевства почти втрое. Теперь необходимо немедленно организовать процесс интеграции новых префектур и начать колонизацию слабозаселённых районов с максимальным уважением к местным сообществам."



# LEFT #
NCH_river_pf_opportunity:0 "Река возможностей"
NCH_river_pf_opportunity_desc:0 "Речные правительства ведомы наиблагороднейшей из идей: идеей единства. Нам известно, что пони востока грезят федеральным проектом, но не все из них согласны с этим, а даже среди согласных хватает оппортунистов и злодеев, желающих соединить народы насилием ради своих плутократических интересов. Мы не позволим им убить эту идею – или утопить её в крови невинных."

NCH_peaceful_coexistence:0 "Мирное сосуществование"
NCH_peaceful_coexistence_desc:0 "Нами движет любовь, как и любым другим действительно разумным существом этого мира. Неглупые создания этого мира придумали прекрасное слово для этого: «пацифизм». Именно такую политику мы собираемся вести с Коалицией. В конце концов, разве не мирное небо – это мечта каждого поколения?"

NCH_trade_development:0 "Развитие торговли"
NCH_trade_development_desc:0 "Объединённая Речная Компания не равна национальным экономикам речных пони. Несмотря на тяжёлое прошлое, связанное с Саором, сегодня мы готовы к диалогу на равных, что принесёт большие выгоды как им, так и нам."

NCH_open_up_the_shopping_districts:0 "Золотой Полумесяц"
NCH_open_up_the_shopping_districts_desc:0 "Одним из способов продемонстрировать нашу дружбу станет предложение странам побережья провести совместную военно-морскую операцию, которая навсегда обезопасит морские пути региона от чудовищ, пиратов и колдунов Мейджхолда. Из-за ледниковых ограничений на западе маршрут будет огибать континент, превращаясь в безопасный обходной путь для торговцев из Зебрики и Грифонии."

NCH_scout_the_situation:0 "Разведать обстановку"
NCH_scout_the_situation_desc:0 "Из неприятных новостей: нам стало известно, что не все пони в Коалиции симпатизируют чейнджлингам. Некоторые из них откровенно враждебны – застряв в своих дремучих ксенофобских взглядах."

NCH_visit_to_riverlands:0 "Посольство в Даль Мор"
NCH_visit_to_riverlands_desc:0 "Мы официально открываем посольство в столице Понайяна – Даль Море! Это место выбрано не случайно. Понайян Ан Тах-Фада – уникальный пример мирной гармонии и сосуществования в Коалиции. Конечно, организовывать посольства в племенной конфедерации непросто, но у нас есть на то стратегические причины."

NCH_cit_thrpugh_the_bureaurcracy:0 "Разобраться в бюрократии"
NCH_cit_thrpugh_the_bureaurcracy_desc:0 "Поправка А39 Кольтстримского Договора указывает следующие требования для государства, собирающегося его подписать: иметь общие границы с альянсом, обладать легитимным нетираническим режимом. Из дополнительных требований: иметь гарантии от стран договора, состоять в Коалиции или быть военным союзником стран, воюя с ними на одной стороне."

NCH_embed_agents_in_goverments:0 "Операция «Патриоты»"
NCH_embed_agents_in_goverments_desc:0 "Кто-то крайне недоволен нашими попытками наладить контакт с речными пони. Некоторые политики настраивают народ против нас, а где-то наших подданных даже избивают, как в Бакбанбурге. Пора кое-кому поменять свои взгляды..."

NCH_not_so_united:0 "Не такая единая"
NCH_not_so_united_desc:0 "Что ж, это было очевидно, но, несмотря на внешнее единство, Речная Коалиция больна изнутри. Некоторые её части поражены болезнями превосходства и коммунизма, а когда один орган перестаёт работать – сбоит весь организм."

NCH_finding_allies_in_coalition:0 "Три в идеальной паре"
NCH_finding_allies_in_coalition_desc:0 "На пути к объединению с речными пони нам необходимо гарантированно заручиться поддержкой участников альянса. Гита делает весьма неожиданную ставку на, казалось бы, страну-аутсайдера..."

# RIGHT #
NCH_their_light_beckons_us:0 "Проблемы на домашнем фронте"
NCH_their_light_beckons_us_desc:0 "Эквус. Дом. По крайней мере, был им столетия назад, пока рода Дитрисума не изгнали нас. Пора навестить родные края спустя столько лет..."

NCH_emvassy_to_equestria:0 "Родная страна"
NCH_emvassy_to_equestria_desc:0 "Гита, генерал Латро и лорд-протектор Базальт Шоу наведаются в так называемые Земли Чейнджлингов, единую страну нашего рода, родившуюся сравнительно недавно под стальным копытом некой королевы, которая зовёт себя Кризалис. Надеемся, они ещё помнят дитрисиумский диалект."

NCH_princess_in_a_high_castle:0 "Маяк Гармонии"
NCH_princess_in_a_high_castle_desc:0 "Ойрен вместе с контр-адмиралом Семпером Фаем и генералом Эйпексом Кэррионом посетят от имени королевства Эквестрию. Мы не были там около тысячи лет, и понятия не имеем, как пони нас воспримут, поэтому группу сопроводят моряки из Бакары, любезно согласившиеся предоставить нам свои услуги."

NCH_harmpony_in_every_heart:0 "Эквестрийская философия"
NCH_harmpony_in_every_heart_desc:0 "Поразительно, как Эквестрия умудряется сохранять гармонию на протяжении стольких веков. Нам есть чему поучиться у них, и именно с этой целью мы откроем у себя филиал так называемой “Школы Дружбы”, куда пригласим в том числе педагогов оттуда."

NCH_our_best_qualities:0 "Блиц"
NCH_our_best_qualities_desc:0 "Ситуация шаткая. Обе страны, наша древняя родина и маяк наших идеалов, собираются начать рвать друг друга в кровавой массовой войне. Наше появление удивило обе стороны, так что у нас может быть шанс хотя бы отсрочить это."

NCH_beacon_harmony_in_the_east:0 "Использовать режим Кризалис"
NCH_beacon_harmony_in_the_east_desc:0 "Хоть режим Кризалис и тоталитарен, но мы хотя бы можем получить какую-то выгоду от сотрудничества с ними. Главное не злоупотреблять, ибо в конце концов она не самая спокойная особа."

NCH_our_values:0 "Наши ценности"
NCH_our_values_desc:0 "Нам тоже есть, чему их научить. Мы поделимся с Эквестрией уроками, которые мы извлекли из индустриализации и борьбы с коммунизмом. Храни Матрона, у них они умудрились буквально украсть кусок страны!"

NCH_friendship_delegation:0 "Вондерболты Востока"
NCH_friendship_delegation_desc:0 "Рэинбоу Дэш, одна из национальных героинь Эквестрии, предложила нам помощь в организации ВВС с открытием целого филиала Вондерболтов и обучением уже наших асов! Будет непростительно глупо отказаться от такого щедрого предложения."

NCH_lessons_in_friendship:0 "Нежданный гость"
NCH_lessons_in_friendship_desc:0 "Земли Чейнджлингов желают поддерживать с нами отношения, ради чего выделили нам посла. Ну, или просто вспомнили о предназначении Гринклифа и выслали к нам неугодного... в любом случае, он вскоре прибудет в Блосмпорт, лучше подготовиться ко встрече."

NCH_equestria_support:0 "Эквестрийская защита"
NCH_equestria_support_desc:0 "В обмен на нашу политическую помощь и перенятие некоторых из их гармонистских концепций, мы просим встречную услугу: военную защиту. Разумеется, это скорее формальный шаг, поскольку нам никто не угрожает, а Эквестрия занята с Кризалис, но это откроет нам определённые возможности для развития отношений в будущем и действий на самом Эквусе."

NCH_shield_and_sword_harmony:0 "Напомнить о правах на трон"
NCH_shield_and_sword_harmony_desc:0 "Мы не марионетки и не отдадим Гринклиф. Кланы Леманн и Ойр – это законные наследники власти в Дитрисиуме. Однако, поскольку Земли Чейнджлингов теперь едины, ещё и под копытом тирана, это может стать уникальной возможностью вернуть свет нашей древней родине и вернуться туда самим."


# Gytha federation patch #

NCH_Queen_Gytha_Patch:0 "После шторма"
NCH_Queen_Gytha_Patch_desc:0 "Мы сумели выйти из кризиса, но королеве предстоит ещё очень много дел... Кризис заколил её волю. Гита планирует провести более радикальные внутриполитические и внешнеполитические реформы. Кажется, у неё есть план... и амбиции."

NCH_dreems_of_more:0 "Основы реальной политики"
NCH_dreems_of_more_desc:0 "Геополитическая реальность проста: нам никуда не деться от речных пони – мы зависим от них. Быть может, пришла пора сделать и их зависимыми от нас?"

NCH_agents_stand_by:0 "Промышленный саботаж"
NCH_agents_stand_by_desc:0 "Нужно иметь в виду: не все страны согласятся на масштабный проект единства, какие бы усилия мы ни прилагали. Поэтому, если военное столкновение станет неизбежным, наши агенты ослабят потенциальных противников заранее."

NCH_friends_and_allies:0 "Запачкать копыта"
NCH_friends_and_allies_desc:0 "Грандиозный проект Свит Спринкл заложил базис в каждой стране Речной Коалиции. Наши союзники из числа „9 Звёзд“ готовы действовать – остаётся лишь дать им сигнал и направить их усилия в нужное русло."

NCH_light_f_fire_in_their_hearts:0 "Адаптация «Стратегии Йосипа»"
NCH_light_f_fire_in_their_hearts_desc:0 "Коммунистические партизаны Речной Республики на удивление сообразительны: особенно их лидер Нова Вирл. В арсенале их партии есть так называемая «Стратегия Йосипа»: медленная, изощрённая идеологическая обработка и постепенное заражение населения красными идеями. Нам стоит адаптировать их методику, но направить её на распространение идеалов гармонии."

NCH_operation_raging_river:0 "Операция «Бурная Река»"
NCH_operation_raging_river_desc:0 "Время пришло: мы отправляем официальный запрос на вступление в Речную Коалицию. Наши верные друзья в Понайяне пообещали поручиться за нас, а население соседних стран всё больше воспринимает нас как союзников. А если нет – благодаря работе оперативников у нас остался козырь в рукаве."

NCH_under_one_flag:0 "Это случилось здесь"
NCH_under_one_flag_desc:0 "Отныне мы официально едины с Коалицией. Пусть так есть и будет всегда, ибо с момента вступления в этот великий проект наша судьба уже неразрывна с судьбами речных жителей."

NCH_what_we_bring:0 "Мечты о Федерации"
NCH_what_we_bring_desc:0 "Королеве крайне импонирует идея федерализации Коалиции. Создание могучей нации, сильной в своём разнообразии и готовой отстаивать идеалы гармоничного сопроцветания – это амбициозная, историческая задача, но однажды нам будут завидовать даже пони Эквестрии."

NCH_economic_community:0 "Совет экономической взаимопомощи"
NCH_economic_community_desc:0 "Очередная инициатива Гринклифа – создание перераспределительной финансовой системы в рамках Речной Коалиции. Цель проста: формировать централизованные фонды для оказания целевых дотаций нуждающимся странам. Разумеется, далеко не все граждане захотят платить налоги в общий котёл. Однако в долгосрочной перспективе эти инвестиции себя оправдают."

NCH_a_sample_of_unity:0 "Блосмпортская организация сотрудничества"
NCH_a_sample_of_unity_desc:0 "БОС – это инициатива нашей страны по созданию единого силового и следственного блока в пределах Речной Коалиции. Интеграция служб безопасности стран обеспечит тотальный обмен информацией. В будущем ни один террорист не сможет проскользнуть незамеченным, ибо о нём будет знать весь Восток."

NCH_bring_together:0 "Совместные военные учения"
NCH_bring_together_desc:0 "Глупо отрицать, что вооруженные силы наших государств слишком отличаются друг от друга по уровню подготовки. Чтобы стать единой военной силой, с которой придётся считаться, мы обязаны ввести единые стандарты для всего: от тренировок до калибра винтовочных патронов."

NCH_example_for_ponies:0 "Языковой вопрос"
NCH_example_for_ponies_desc:0 "Коалиции необходим общий язык, обеспечивающий свободную коммуникацию в любом уголке Востока. Конечно, нам бы польстило, если бы этим языком стал гринклифский, однако лингвисты из нескольких стран предложили альтернативу – «междуречный». Этот искусственный язык гармонично объединяет основные черты главных национальных языков Коалиции. Со временем он станет нашим вторым родным."

NCH_general_institutions:0 "Виттенбургский процесс"
NCH_general_institutions_desc:0 "Виттенбургский процесс – это непрерывный академический диалог между университетами стран Коалиции для унификации стандартов высшего образования. Через несколько академических циклов специалист, обучившийся в Нимбусии, будет полностью сопоставим со специалистом из Депонии, что расширит рынок труда и упрочит интеллектуальное единство региона."

NCH_racial_differences:0 "Сенат Коалиции"
NCH_racial_differences_desc:0 "Сенат станет первым представительным органом для стран Коалиции, обозначив серьёзный и масштабный шаг в сторону политизации Союза. Коалиция теперь – не просто оборонный или экономический блок, а нечто большее."

NCH_make_us_stronger:0 "Декларация прав существ"
NCH_make_us_stronger_desc:0 "Символический, но важный шаг на пути к единству – признание и гарантия равных прав для всех разумных существ: чейнджлингов, пони, алмазных псов и других. Вместо феодализма приходит равенство, за которым, однако, неизбежно следует бремя ответственности и гражданской сознательности."

NCH_river_science_program:0 "Наднациональное управление"
NCH_river_science_program_desc:0 "Теория автономных штатов в составе потенциальной федерации довольно быстро набирает популярность среди граждан стран Коалиции. Это значит, что, даже будучи монархией, федеральный штат может сохранить свою династию и внутреннюю символику – при условии, что он подчинился общей конституции и верховенству федерального закона."

NCH_what_we_strive_for:0 "Прощай, отчаяние"
NCH_what_we_strive_for_desc:0 "Надежда охватила умы и сердца жителей Востока – надежда на нечто большее, чем очередной союз ради выгоды. Это надежда на единство. На симбиоз. На высшую форму любви, разума и взаимопонимания в неспокойном мире. И эта надежда – надежда о федерации."

NCH_first_president:0 "Хартия Федерации"
NCH_first_president_desc:0 "Хартия – это первый общий федеральный закон, определяющий наши основные нормы и ценности как новой, единой нации. Необходимо рассмотреть и принять лучший их вариантов, на что у Сената есть целых два месяца. Дискуссии явно будут бурными, следует приготовиться к стуку ботинок по столу со стороны отдельных личностей..."

NCH_inity_as_the_highest_good:0 "Реализация Мечты"
NCH_inity_as_the_highest_good_desc:0 "Коалиция отныне – история, и на её месте рождается Федерация – маяк гармонии, стабильности и счастья на всём изрезанном войнами континенте. Слёзы радости увлажнили щеки многих в этот исторический день, включая и лицо нашей королевы."

NCH_adopt_consitution:0 "Первые федеральные выборы"
NCH_adopt_consitution_desc:0 "Федерация затаила дыхание, ожидая того, кто поведёт её в будущее. Хотя, откровенно говоря, этот выбор достаточно очевиден, учитывая Её усилия по созданию федерального проекта: все экзитполы предсказывают победу одной конкретной фигуре вне зависимости от соперников."


# Gytha Chrysalis patch #

# ARMY #
NCH_rule_greneclyf:0 "Rule Greneclyf!"
NCH_rule_greneclyf_desc:0 "The royal court has been given the opportunity to focus on the state of our army. It's time to bring the Guard into proper shape!"
#
# Navy #
NCH_at_seas:0 "Upon the Waves"
NCH_at_seas_desc:0 "The Eithne Reforms have greatly expanded the capabilities of our navy. Now, more than ever, we must seize the moment and hasten our pace of modernization. Just a few more steps and Greneclyf shall reign over all the seas of the East!"

NCH_expand_blosmport_yards:0 "Expand the Blosmport Shipyards"
NCH_expand_blosmport_yards_desc:0 "Greneclyf is an island nation. Its shipyards are its lifeline to the world. To bolster trade and protect vital shipping lanes, we must expand our drydocks and harbor stations, and increase the number of skilled workers in their service."

NCH_hard_armor:0 "Reinforced Armor"
NCH_hard_armor_desc:0 "Pursuing refinement of our existing doctrines begins, first and foremost, with the strengthening of our ships’ hulls and the development of new alloys for future vessels. To this end, we shall employ advanced metallurgical techniques acquired through our cooperation with the River Coalition."

NCH_Greneclyf_pride:0 "Kraken of the East"
NCH_Greneclyf_pride_desc:0 "Hetcher, the foremost pride of the Greneclyfian Navy, stands ready for modernization and rearmament to become the true Kraken of the East. Once improved, the Hetcher will replace tales of tentacled monsters with legends of chromed barrels, thundering across the waves and dragging enemy fleets to their watery graves."

NCH_silent_hunters:0 "Silent Hunters"
NCH_silent_hunters_desc:0 "Should we choose the doctrine of raider control over maritime routes, our navy will pivot toward the development of a submarine-dominant fleet. Armed with torpedoes and mining systems, these low-cost killers will slit the throat of any beast we go to war with, severing their lifelines and starving them into submission."

NCH_sharks_ice_waters:0 "Sharks of the Frozen Deep"
NCH_sharks_ice_waters_desc:0 "Our submarine fleet shall establish a wide-ranging communications net, codenamed Shark. Upon detecting an enemy formation, a scout sub will immediately transmit data to the underwater command center and initiate pursuit. Meanwhile, the rest of the Shark Pack will position themselves in the surrounding waters, ensuring the prey cannot escape."

NCH_experomental_developments:0 "Mass Production"
NCH_experomental_developments_desc:0 "With strategic priorities now set, we are poised to launch serial production of naval vessels, significantly accelerating the growth of Greneclyf’s maritime strength. Our enemies will think twice before daring to threaten us again."

NCH_assing_new_command:0 "The New Admiralty"
NCH_assing_new_command_desc:0 "During the crisis, several agents trained in naval warfare abroad managed to return home. Rear Admiral Semper Phi shall present a report to the Queen after consulting with the returning cadets, in order to determine the optimal course for our fleet’s development."

NCH_marine_corp:0 "„Go brách dílis”"
NCH_marine_corp_desc:0 "To maintain command over the sea, our forces must possess swift, mobile marine units — ready to land anywhere and hold the ground until reinforcements arrive. With this objective in mind, under the leadership of the Greneclyf Navy, the Royal Marine Corps shall be established."

NCH_naval_academy:0 "CeNaCo"
NCH_naval_academy_desc:0 "To ensure the continued modernization of our fleet, it has been decided to grant it greater autonomy through the creation of the Central Naval Committee, headquartered in Blosmport. Broader operational freedom will strengthen the navy’s ability to act swiftly and adapt to changing circumstances."

NCH_Blosmport_navy_institute:0 "Blosmport Naval Institute"
NCH_Blosmport_navy_institute_desc:0 "With the founding of the Blosmport Naval Institute under the auspices of CeNaCo, Admiral Semper proposed a dual-purpose mission: to reform naval education and enhance our strategic capabilities. From now on, our naval theorists shall be trained at the national level — not in abstract doctrine, but in principles tailored to the unique realities of Greneclyf."

NCH_security_trade:0 "Securing Our Trade"
NCH_security_trade_desc:0 "One of Greneclyf’s enduring hardships is that the waters surrounding our island remain frozen for half the year, posing major obstacles to trade. The Queen has now tasked the Navy with a clear mandate: to conquer nature itself, breaking the ice barrier and ensuring uninterrupted maritime commerce all year round."

NCH_merchant_navy:0 "The Merchant Fleet"
NCH_merchant_navy_desc:0 "Our first order of business is to retrofit existing trade ships with means of traversing the brutal northern winters. Greneclyf’s first fully integrated merchant flotilla will be outfitted with prototype icebreakers, capable of shattering frozen waterways and securing trade routes even in the deepest frost."

NCH_break_ice:0 "Shattering the Ice"
NCH_break_ice_desc:0 "Some of our scholars have proposed testing an obsidian-infused alloy for use in icebreaking equipment. They claim this material can slice through ice as if it were parchment. If the trials prove successful, the technology will be deployed not only on trade and research ships, but also on military vessels, rendering our fleet nearly immune to winter’s grip."

NCH_resources_for_fleet:0 "Resources for the Fleet"
NCH_resources_for_fleet_desc:0 "The Royal Court has approved Rear Admiral Semper Phi’s decree to develop new resource sites in the Aisling mines and other territories across the realm. This initiative will not only provide new employment opportunities for Greneclyf’s citizens, but also generate surplus materials to support other sectors of the economy."

NCH_investing_in_shipbuildings:0 "Investment in Shipbuilding"
NCH_investing_in_shipbuildings_desc:0 "The previous merchant flotilla has proven its worth in withstanding the harsh winter seas. However, as the kingdom’s economy grows, so too does its volume of trade. We must expedite the construction of additional drydocks and berths at key ports to prevent shortages of merchant vessels."

NCH_domestic_development:0 "Project Boreas"
NCH_domestic_development_desc:0 "The success of the obsidian component trials has inspired the Navy to pursue further innovations. Thus was born an ambitious design: the world’s first icebreaking torpedo cruiser — Project Boreas. This vessel will be capable of serving military, civilian, and scientific purposes alike. With such a fleet, Greneclyf shall chart and command even the coldest, most uncharted waters of the North, where no nation has yet dared to venture."

NCH_our_future_at_sea:0 "Rule Greneclyf the Waves!"
NCH_our_future_at_sea_desc:0 "With its navy swiftly expanded and reforged, Greneclyf cements its hegemony over the region’s waters. We are strong, but this is only the beginning. We shall continue to grow our maritime might until the world knows, without doubt or defiance: Greneclyf is master of the seas!"



# Army #
NCH_on_land:0 "The Future of the Guard"
NCH_on_land_desc:0 "The high command, including Generals Carrion and Latreau, convened to determine the future of Greneclyf’s Royal Guard. Yet the meeting sowed division among the military elite — each general offering a conflicting vision for the army’s role in the world to come. Now it falls to Oireachtas to hear them both and choose which path to follow."

NCH_priorize_integrity:0 "Carrion’s Doctrine"
NCH_priorize_integrity_desc:0 "Oireachtas chose to embrace Carrion’s vision, and the Royal Guard now begins a sweeping transformation. Troop numbers will surge, and a true standing army shall be forged from the soil of Greneclyf. Soon, the realm shall witness the rise of a new generation of defenders, marching in step and numberless in their ranks."

NCH_discipline_is_key_to_order:0 "Political Commissars"
NCH_discipline_is_key_to_order_desc:0 "Latreau’s concerns were not without merit: without firm oversight, the regular army could easily devolve into a mob of brutes. To address this, Carrion introduced the institution of Political Commissars — ideological zealots whose primary mission was to enforce order, discipline, and moral rigor. Their presence would not only crush hazing and disorder but instill a higher sense of honor and duty in the ranks."

NCH_pass_law_on_consctiption:0 "Universal Military Service"
NCH_pass_law_on_consctiption_desc:0 "The next stage of reform is clear: the introduction of universal conscription for all physically and spiritually capable citizens, regardless of gender. Every Greneclyfan must be prepared to defend their kin, their home, and the Kingdom that nurtures them. Service is not a burden, but a sacred duty repaid."

NCH_queen_of_the_fields:0 "Project “Basilisk”"
NCH_queen_of_the_fields_desc:0 "Though our army now marches in numbers, every soldier is still worth their weight in gold. We must not squander lives in fruitless assaults when the enemy can be obliterated from afar. Project Basilisk seeks to dramatically increase our artillery’s firepower, even at the cost of higher production demands. Obsidian alloys adapted for military use will give our cannons lethal force, able to pierce any fortification."

NCH_goddes_of_war:0 "Project “Hydra”"
NCH_goddes_of_war_desc:0 "Power is born from the barrel of a rifle. The more rifles we wield, the more power we hold. Project Hydra introduces a revolutionary new rifle architecture, drastically reducing production costs via an innovative firing mechanism. However, tests have revealed a troubling instability: the mechanism tends to jam. But if every soldier carries not one weapon but several, then quantity will overcome unreliability."

NCH_expamd_production:0 "Military-Industrial Growth"
NCH_expamd_production_desc:0 "Feeding and arming a large standing force demands vast industrial capacity. It is time to attract investment and scale up our military factories. Greneclyf is mobilizing for war and nothing will stop the gears of progress now."

NCH_auxiliary_battalions:0 "Latreau’s Doctrine"
NCH_auxiliary_battalions_desc:0 "Oireachtas chose General Bermondt Latreau’s doctrine: the Royal Guard would remain an elite corps, composed of the best of the best. There would be no conscription — only volunteers, true professionals who devoted their lives to the art of war. A soldier is not a peasant in uniform. He is a weapon honed to perfection. Soldiering is a calling, not a burden. And our citizens deserve peace — not to be herded to slaughter."

NCH_anyone_can_be_hero:0 "Private Practice"
NCH_anyone_can_be_hero_desc:0 "A private military company known in Greneclyfan as 'Saighdiúirí Gan Teorainneacha' is one of the most seasoned shadow armies in the world, boasting extensive combat experience. General Latreau proposed hiring their instructors to train the new Guard elite. To secure this, he arranged a private meeting with their notorious leader named Orb Seller."

NCH_inspire_by_example:0 "Military Meritocracy"
NCH_inspire_by_example_desc:0 "A truly formidable army is not built on flattery, but skill and initiative. Only a fool punishes genius for being different — and our army will not tolerate such fools. Visionaries will be given command, and the Guard will follow them into glorious victory."

NCH_greuling_workouts:0 "Exhaustive Training"
NCH_greuling_workouts_desc:0 "The lands of Greneclyf harden us from childhood. This is our advantage — and we will weaponize it. Every candidate must complete a grueling arctic survival course. Those who fail are not worthy of carrying the Guard’s banner."

NCH_best_of_the_best:0 "Special Forces Integration"
NCH_best_of_the_best_desc:0 "Our light special forces, codenamed Jaegers, have proven unmatched in hostile terrain, particularly forest warfare. Silent, agile, and remorseless, they will become a living nightmare to any enemy unlucky enough to cross paths with them. Let the enemy fear every rustle in the dark."

NCH_faith_in_queen:0 "Divine Wind"
NCH_faith_in_queen_desc:0 "As a soldier, Latreau understands that no amount of pay alone can forge a warrior. There must be belief — but in what?"

NCH_bugsmere_war_institute:0 "Institute of War Studies"
NCH_bugsmere_war_institute_desc:0 "The Institute of War Studies in Bugsmere — such is the monumental title of our new military academy and first national war university. The 'Unity' draft program will not only provide us with qualified theorists, but will serve as a foundation for our future officer corps. These changelings will learn the intricacies of modern warfare, and shape the next generation of defenders of the Motherland."

NCH_greneclyf_tanks:0 "Greneclyf’s Tanks"
NCH_greneclyf_tanks_desc:0 "We’ve chosen to prioritize research into the continent’s tracked monsters, which will become the backbone of our offensive power. Their deployment promises battlefield dominance — if, of course, we ensure proper supply to keep these beasts running."

NCH_mechanization_of_brigades:0 "Motorized Brigades"
NCH_mechanization_of_brigades_desc:0 "We’ve chosen to focus on motorizing our infantry. These mobile units will use speed and surprise to cut the enemy off from supplies and support the main army in surrounding enemy forces, turning those pockets into mass graves for our foes."

NCH_greneclyf_school_of_war:0 "Greneclyf School of War"
NCH_greneclyf_school_of_war_desc:0 "After a long road of reform, our army is finally ready for war and worthy of the name Armed Forces of the 11th Century. Whoever comes to challenge us now will face the Guard and receive a response worthy of legend."



# AIR #
NCH_native_development:0 "Domestic Designs"
NCH_native_development_desc:0 "We enter the age of aviation with almost nothing: no powerful industry, no reliable resource base. Yet it is precisely this hardship that forces our engineers and scientists to search for unconventional solutions. If we support their endeavors, in time we may build our own school of aviation—unique and independent..."

NCH_foregine_development:0 "Foreign Purchases"
NCH_foregine_development_desc:0 "Why spend years on catching up in research when others have already walked this path? We can purchase proven aircraft on the world market, gain access to advanced models, and use them as the foundation for the future growth of our air force."


NCH_and_in_the_air:0 "Birth of the Air Force"
NCH_and_in_the_air_desc:0 "To wage modern wars effectively, air superiority is essential. Our air force doesn’t yet exist, but specialists with foreign experience will lay the foundation for a uniquely Greneclyfan school of aerial warfare."

NCH_who_else_but_us:0 "Raptor Wings"
NCH_who_else_but_us_desc:0 "“Raptors” will be the name of our airborne operations program. As an island nation, it’s vital we possess the means to drop raider-diversion units deep behind enemy lines: strike teams trained to destroy infrastructure, seize key positions, and hold cities until reinforcements arrive."

NCH_flying_school:0 "Flight Schools"
NCH_flying_school_desc:0 "We must clear ground for the construction of pilot training schools. Constant drill and routine will reduce the risk of fatal accidents and prepare our aviators for the realities of combat."

NCH_build_new_airbases:0 "Develop Test Ranges"
NCH_build_new_airbases_desc:0 "Airbases and test ranges are not just for military use — they are strategic infrastructure linking Greneclyf to the wider world. Perhaps one day, even tourists will fly here."

NCH_defense_island:0 "Iron Dome"
NCH_defense_island_desc:0 "Potential enemies are developing their own air forces and one day they may try to bring war to our shores. The first line of our aerial defense will be the Iron Dome project: a woven mesh of anti-air systems, ready to unleash a hailstorm on intruders. Let them try."

NCH_radar_development:0 "Radar Stations"
NCH_radar_development_desc:0 "One of the most important technologies from abroad is radio detection. Radar will give us the power to see through darkness and distance, anticipate the enemy, and never lose our way in the sky."

NCH_night_training:0 "Terror in the Night"
NCH_night_training_desc:0 "Studying the art of combat under cover of darkness will leave any enemy trembling, when our silent aircraft strike from above with engines cut, catching them off-guard just before their final breath. Our first such squadron will be named the Night Witches."

NCH_flying_like_butterfly:0 "On Wind’s Swift Trail"
NCH_flying_like_butterfly_desc:0 "In the stillness of the hangars, doctrine is born — each maneuver a prayer to the skies. Let the heavens become a living scripture written by Matron herself, to whom our pilots reach with daring hearts."

NCH_aisling_air_institute:0 "Aisling Aviation University"
NCH_aisling_air_institute_desc:0 "Aisling is the perfect site for the creation of our national aviation university. Around it will grow an aviation town where pilots — both civilian and military — will live, study, and train."

NCH_domestic_parts:0 "Aviation Military-Industrial Complex"
NCH_domestic_parts_desc:0 "Aircraft production requires not just resources, but dedicated space for design and assembly. Wicksite has offered to convert two old plants in her domain into innovative assembly centers for airframes — a proposal we cannot refuse."

NCH_rocket_science:0 "Project Zenith"
NCH_rocket_science_desc:0 "Delving deeper into aviation tech, Wicksite and her team synthesized a high-energy fuel unsuitable for aircraft. Months of blueprints and simulations led them to design a machine based on principles of acceleration and thrust inspired by... fireworks. The Prefect sees great potential in the project and requests a test site in Bugsmere."

NCH_hotter_thousands_suns:0 "Project Phoenix"
NCH_hotter_thousands_suns_desc:0 "Celarl proposed a terrifying new weapon, one combining the heights of science with breakthroughs in magical theory. Wicksite strongly supported the initiative, promising that the destructive potential of this device would surpass the heat of a thousand suns."

NCH_experimental_developments:0 "Innovation Grants"
NCH_experimental_developments_desc:0 "Our scientists are making major strides in nuclear energy and jet propulsion. We may even be the first nation to develop a true jet fighter. Progress cannot be halted and we must catch up and overtake any threat by pushing the frontier ever further."

NCH_tactical_aviation:0 "Strategy of Annihilation"
NCH_tactical_aviation_desc:0 "By focusing on striking enemy reserves and infrastructure, we can cripple their war machine without meeting them head-on. Of course, if our bombers can reach them..."

NCH_naval_bomber_project:0 "Cather 22"
NCH_naval_bomber_project_desc:0 "Cather 22 is a joint Navy-Air Force initiative to develop a flying boat — a heavy maritime bomber capable of striking enemy ships, supporting our fleet, and sinking convoys, cutting off supply lines and denying the enemy control over the seas."

NCH_figher_aircraft:0 "Doctrine of Air Superiority"
NCH_figher_aircraft_desc:0 "A doctrine built around air superiority will grant us control of the skies. Our fighters will eliminate airborne threats and protect our frontlines. Deep strikes won’t be needed as enemy aircraft will be downed almost immediately, and at little cost to us."

NCH_air_support:0 "Raider 10"
NCH_air_support_desc:0 "Raider 10 is a ground-attack aircraft project designed for frontline support. These planes will carve paths for our infantry and disrupt enemy reinforcements during their advance."

NCH_sorry_as_bee:0 "In Cloud’s Pale Veil"
NCH_sorry_as_bee_desc:0 "The truths of war aren’t in numbers, but in testimony. We’ll listen to those who have touched the sky — those who whispered with the clouds, who fell and rose again. Who better to help us chart the heavens than those who nearly made it?"

NCH_angry_hive:0 "Wasp Swarm"
NCH_angry_hive_desc:0 "Our air force has grown from an idea into a terrible force holding the line as our paratroopers shatter enemy strongholds, and attack planes cut down reinforcements. Any who dare threaten our hive will be met by the full fury of the swarm."


### ARMY ###

### ARCTIC ###

NCH_land_behind_seas:0 "Терра инкогнита"
NCH_land_behind_seas_desc:0 "Отчаянные времена требуют отчаянных мер. Раньше мы опасались ледников на севере, но теперь они могут послужить нам чем-то большим, чем просто барьером в море. Возможно, в этой неизведанной земле можно даже обосноваться?"

NCH_colony_development:0 "Поселения особого типа"
NCH_colony_development_desc:0 "С поспешным возведением полярных станций у нас появилась возможность расширяться немного дальше. Хотя мы и стараемся быть как можно более осторожными, некоторые голоса озвучили идею строительства вокруг станций небольших городков. Ворвань и рыболовный промысел позволят им быть в определённой степени самообеспеченными, а значит, эта идея может окупиться, обладая к тому же научным потенциалом благодаря улучшению условий на станциях."

NCH_economic_development_in_ice:0 "Новый торговый путь"
NCH_economic_development_in_ice_desc:0 "Робкое освоение Севера обладает огромным торговым потенциалом из-за географии нашей планеты. Уже сейчас ледокольные суда могут проходить сквозь льды, добираясь до северного Эквуса. В будущем мы сможем даже проложить железнодорожные станции через ледники, сократив время доставки товаров кратно."

NCH_trade_in_snow:0 "Морские ресурсы"
NCH_trade_in_snow_desc:0 "Море богато не только рыбой: ворвань, нефтехимия, различные морские растения и минералы. Всё это можно не только добывать для нужд Гринклифа, но и продавать на мировом рынке в промышленных масштабах. Хотя, разумеется, главное – не перестараться: нельзя забывать о природе и экологическом балансе."

NCH_resorurces_digging:0 "Геологоразведка"
NCH_resorurces_digging_desc:0 "Геологическая разведка позволяет предполагать наличие на Севере полезных ископаемых. Кто знает, что мы сможем обнаружить под снегом: уголь, нефть или даже залежи кристаллов?"

NCH_militarization_north:0 "Военная эксплуатация"
NCH_militarization_north_desc:0 "В Генштабе предложили в качестве эксперимента создать на северных территориях несколько военных объектов. Они аргументируют это желанием проверить выносливость новобранцев в суровых условиях, а также необходимостью защиты торгового флота и обитателей станций от пиратов и налётчиков."

NCH_army_base_behind_homeland:0 "Экспериментальные полигоны"
NCH_army_base_behind_homeland_desc:0 "Северные территории удобны по своему ландшафту. Это позволяет нам – по крайней мере в теории – соорудить в некоторых местах полигоны и лётные станции, одинаково пригодные для гражданских и военных целей."

NCH_dockyards_for_navy:0 "Заправочные станции для флота"
NCH_dockyards_for_navy_desc:0 "Для эффективного освоения Севера необходимо обеспечить флот ресурсами на месте. Станции дозаправки, стоянки для танкеров и кораблей – всё это будет полезно."

## CHRYSALIS ##
NCH_hive:0 "Великая партия"
NCH_hive_desc:0 "За океаном, на востоке, лежит Эквус – наш родной дом, раздираемый конфликтом между двумя великими державами, между нашей кровью и нашими идеалами. Мы не можем стоять в стороне, безмолвно наблюдая за убийствами и несправедливостью. Наш долг – вмешаться."

NCH_seek_support:0 "Уча орла полёту"
NCH_seek_support_desc:0 "Адлер фон Дитрисиум – брат королевы Хельвии и постоянный атташе от Кризалис. Гита давно положила на него глаз – и, вполне возможно, не только из-за его должности в УОБВ и родства с Хельвией..."

NCH_pressure_chrusalis:0 "Связаться с тораксиканцами"
NCH_pressure_chrusalis_desc:0 "Торакс давно ведёт борьбу с игом Кризалис в подполье. Он опытен и прекрасно знает устройство общества Ульев изнутри. Нам необходимо выйти с ним на связь и начать поддерживать его силы, пусть и тонко намекнув, кто здесь теперь главный."

NCH_spy_everywhere:0 "Шпиономания"
NCH_spy_everywhere_desc:0 "Кризалис не могла ожидать, что против неё развернётся не просто второй фронт, но тайный. Наши оперативники могут доставить ей немало хлопот прямо в глубинах её тыла, пнув диктаторшу под круп."

NCH_Queen_Ditrisium:0 "Королева Дитрисиума"
NCH_Queen_Ditrisium_desc:0 "Хельвия... прекрасная роза в челюстях военной машины Кризалис. Она – это шанс на великое будущее для Ульев. Президент уже имеет с ней прямой контакт, и теперь нам нужно обсудить детали свержения тирании."

NCH_equipment_suppporter:0 "Старая кровь"
NCH_equipment_suppporter_desc:0 "Некоторые высокопоставленные чиновники и аристократы, с которыми имеет контакты Хельвия, тайно выразили желание лично выйти на тропу войны с Кризалис. Отдельные личности даже присягнули в верности лично королеве Дитрисиума, ностальгируя по временам до объединения. Мы воспользуемся ситуацией с умом."

NCH_idea_of_harmony_in_hives:0 "Методы 9 звёзд"
NCH_idea_of_harmony_in_hives_desc:0 "Федерализация кое-чему нас научила. А именно – иногда насилие необходимо. Любое средство приемлемо в борьбе против Кризалис... не так ли?"

NCH_take_a_equipment:0 "Выждать момент"
NCH_take_a_equipment_desc:0 "Восстание должно быть хорошо подготовлено. Время играет против нас, но нельзя превращать целую операцию по смене власти в мимолётное самоубийственное фиаско."

NCH_give_hope:0 "Тайная коллаборация"
NCH_give_hope_desc:0 "Агенты Адлера связались с некоторыми видными генералами Ульев и представителями оружейного бизнеса, которые согласились помочь в перевороте против Кризалис – разумеется, за определённые уступки. Может, они и ведомы шкурными интересами, но здесь они будут очень полезны."

NCH_fangs_dug:0 "Незабываемая ночь"
NCH_fangs_dug_desc:0 "Пришло время положить конец деспотии Кризалис и вернуть Ульям нормальность. С нашей поддержкой Дитрисиум восстанет и объединит земли под единым флагом, сокрушив весалипольское чудовище, закабалившее наш род!"

NCH_rethinking_history:0 "Немыслимое"
NCH_rethinking_history_desc:0 "Земли чейнджлингов пали под натиском врага. Мы ожидали, что это будет Эквестрия, но в итоге Кризалис сокрушила иная сила, а сама королева исчезла... Госпожа президент отдала приказ немедленно открыть порты и готовиться к приёму беженцев с континента."

NCH_accept_refugees:0 "Распределить беженцев"
NCH_accept_refugees_desc:0 "Наши сородичи продолжают прибывать, и центры распределения не справляются с потоком тех, кто бежал от войны. Мы задействуем другие государственные органы, чтобы спасти как можно больше."

NCH_loyal_elite:0 "Кипучая ярость"
NCH_loyal_elite_desc:0 "Вместе с простыми гражданами к нам попали чиновники Кризалис, солдаты, аристократия. Адлер встретился со своей сестрой, рассказавшей об ужасах войны. Кэррион выслушивает ветеранов, организует им поддержку... Мы должны помочь им разделить боль."

NCH_our_legarl_right:0 "Осудить оккупацию"
NCH_our_legarl_right_desc:0 "Наш долг как чейнджлингов – осудить произвол и грубое нарушение международного права на землях нашей родни. Да, Кризалис была жестока, но Гегемония была официально признанным государством и даже сотрудничала с Империей Грифонов. У оккупанта нет права подвергать сомнению саму легитимность существования страны нашего рода."

NCH_all_or_nothing:0 "Вендетта"
NCH_all_or_nothing_desc:0 "Месть. Именно это чувство движет нашими братьями по роду, прибывшими с континента. Они хотят вернуть свой дом – и это даёт нам удобный casus belli для объявления специальной военной операции по восстановлению гражданского порядка. Сложно отрицать: даже гринклифские чиновники зарядились реваншизмом за родину чейнджлингов."

NCH_unity_summit:0 "Чрезвычайная делегация"
NCH_unity_summit_desc:0 "Мы должны немедленно отправить военную делегацию в Эквестрию для обмена информацией о состоянии фронтов и официального начала взаимного ленд-лиза, поддерживая друг друга в борьбе."

NCH_start_negotiations:0 "Поддерживать переговоры"
NCH_start_negotiations_desc:0 "У нас есть своё видение будущего Ульев, и наши дипломаты будут искать более тесный контакт с эквестрийской стороной. Селестия – наш давний друг, и мы уверены, что она может доверить нам участие в организации будущей власти."

NCH_menace_chrysalis:0 "Официальное объединение альянсов"
NCH_menace_chrysalis_desc:0 "Гидру фашистского режима Кризалис можно добить только скоординированным ударом плечом к плечу с пони! Гегемония будет неприятно удивлена, когда на обоих фронтах её встретят боевые машины Эквестрии и Федерации, и солдаты, несущие на штыках смерть её тирании!"

NCH_after_war_plans:0 "Блосмпортская конференция"
NCH_after_war_plans_desc:0 "Принцесса Селестия и Твайлайт Спаркл предложили провести встречу на высшем уровне в Блосмпорте, чтобы обсудить послевоенное устройство оккупированных территорий. У нас есть интересные идеи и полезные связи, так что стоит поискать точки соприкосновения с эквестрийцами."

NCH_all_wars_ends:0 "Нимбусский Процесс"
NCH_all_wars_ends_desc:0 "Операция «Змеед», вынудившая Гегемонию капитулировать, завершилась нашим триумфом. Но испытания ещё не окончены: нас и Эквестрию теперь ждёт долгий, изнурительный трибунал над Кризалис и её правительством."

NCH_collective_management:0 "Идущие с миром"
NCH_collective_management_desc:0 "Переговоры с Кантерлотом... прошли не так гладко, как мы надеялись. Никто не осмелится оспорить результаты конференции, но военные Эквестрии выступили против идеи единого федеративного устройства бывшей Гегемонии. Вместо этого они настаивают на втором плане: создании двух режимов, разделённых по демаркационной линии между нашими альянсами."

NCH_burnings_they_hearts:0 "Стабилизация общества"
NCH_burnings_they_hearts_desc:0 "Отныне у наших братьев вновь есть дом, где они могут жить и процветать под нашим мудрым надзором и советом. Но сейчас общество зациклено лишь на одном факте: война окончена, и теперь мы можем выдохнуть. Во всех городах нашей страны проводятся парады и празднование так долго желанного и наконец наступившего дня – дня победы."

NCH_union_hives:0 "Долго и счастливо"
NCH_union_hives_desc:0 "У каждой истории есть свой конец, но за каждым концом следует начало. Мы исполнили свою историческую задачу. Наша молодая страна сделала более чем достаточно и заслужила своё мирное «Долго и Счастливо». Лишь от наших поступков зависит, каким это «счастливо» будет. И лишь потомки, новое начало, оценят его, вспоминая нас добрым... или горьким словом."








## CHAR ##

Hart:0 "Харт"
NCH_Desc_Hart:0 "§gХенрих Харт - молодой и перспективный адмирал, родом из высоких гор северной части острова. Его внимание к деталям всегда отмечалось командирами, равно как и мастерское планирование на военных учениях. Его подчиненные с удовольствием общаются с ним, а сам Харт с удовольствием проводит выходные дни со своими боевыми товарищами.\n\nЯвляясь сторонником создания крупнотоннажного флота, он активно выступает за развитие мощного кораблестроения. По его мнению, только наши огромные пушки, направленные в моря и океаны, могут обезопасить нас от потенциальных захватчиков.§!\n\n§YАвтор портрета:§! dallkory"

NCH_new_stats_hart:0 "§gУровень§!: §Y3§!, (£trait_attack §Y3§!, £trait_defense §Y2§!, £trait_maneuvering §Y2§!, £trait_coordination §Y4§!)\n§gЧерты§!: §C$superior_tactician$§!, §C$ironside$§!\n\n"

Lorri:0 "Лорри"
NCH_desc_Lorri:0 "Адмирал Лореллей Лорри яркая звезда военно морской академии Блосмпорта. Хитёр и скрытен - так бы его описали его враги. Он всегда держит уши востро, что немудрено для подводника, ведь каждый, даже самый незначительный звук на морской глубине может свидетельствовать либо о близкой добыче, либо о смене роли.\n\n\Лорри начинал свой путь на подводной лодке прибрежного типа. В своих первых походах, будучи капитаном, он предложил иновационную тактику - использование подводных лодок в "акульих стаях". Позже, эти формирования получили известность как акулы арктических вод. Лорри выступает за расширение подводного флота. В его представлении, Гринклиф не обладает достаточными ресурсами и материально технической базой для содержания и строительства крупнотонажного флота, поэтому, необходимо сделать ставку на малозаметные, но весьма эффективные подводные лодки нового типа - подводные крейсеры.\n\n§YАвтор портрета:§! dallkory"

NCH_new_stats_lorri:0 "§gУровень§!: §Y4§!, (£trait_attack §Y5§!, £trait_defense §Y1§!, £trait_maneuvering §Y2§!, £trait_coordination §Y2§!)\n§gЧерты§!: §C$seawolf$§!\n\n"

NCH_Merelay:0 "Марелей"
NCH_Marelay_stats:0 "§gУровень§!: §Y2§!, (£trait_attack §Y2§!, £trait_defense §Y2§!, £trait_planning §Y1§!, £trait_logistics §Y2§!)\n§gЧерты§!: §C$infantry_leader$§!, §C$hill_fighter$§!\n\n"


