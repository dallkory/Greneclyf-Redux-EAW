# greneclyf_base.32.t:0 ""

greneclyf_base.25.t:0 "Beneath the Crown"
greneclyf_base.25.d:0 "‘What is this supposed to be?’, Oyren asked, looking at Gytha in a white dress.\n\n‘Well… how do I look?’, the queen asked shyly.\n\n‘What are you plotting? Gytha, answer me instead of boring holes into me with that stare.’\n\n‘I… well, I was thinking about how we might obtain more love for our people, and I came to an idea… Why not arrange a morganatic marriage with someone? Even that alone would cause a powerful surge of emotions.’\n\n‘Riiight. And who exactly have you decided to marry?’, the Judge narrowed her eyes suspiciously.\n\n‘W-with… well… Tselhelm.’\n\nOyren collapsed out of her chair in laughter, utterly shattering the image of a usually restrained official. Gytha, blushing furiously, lowered her head.\n\n‘W-what are you laughing at? What’s so funny about it?’\n\nThe Judge barely managed to get back up, catching her breath after the fit of laughter.\n\n‘Gytha, I love you, but this is the stupidest idea you have ever even considered. Sit down, we need to talk.’\n\nShe sat back down, waiting for the queen to do the same.\n\n‘Take a look at Sweet Sprinkle’s report. Even though she ended up here under rather… unusual circumstances, the mare does her job as administrator of the Zone honestly. That gave me a few ideas.’\n\nThe queen flipped through the Bakaran trader’s papers.\n\n‘It seems things are going rather well. Surprisingly well.’\n\nOyren took a sip of tea and gazed thoughtfully out the window.\n\n‘You see, Gytha, if our country is already behaving like a sold mare, then that mare should have a certain dignity. And a way to profit from what is happening even more. Love can be harvested in many ways, and the love foolish visitors have for gambling is also love we can take for ourselves.’\n\n‘What are you getting at, dear?’\n\n‘That we can stage a diversion by secretly placing disguised changelings among croupiers and casino staff. Basalt’s trained agents will be able to transform the addictions of gamblers, addicts, alcoholics, and other scum into a concentrate of love, which we will distribute to citizens. It is not much, and it is not the highest-quality love, but we must take it all—’\n\n‘I fully agree, Oyri,’ a sudden voice interrupted.\n\nThe black-haired prefect of Llir, Baroness Vixit herself, had appeared in the office.\n\n‘And I will help with this by directing my inventors to serve your charming plan. The right mechanisms and extraction methods will give us both the love we need and valuable experience for future developments. What do you say, my queen?’\n\nGytha, still sitting in the utterly inappropriate wedding dress, thought for a moment, then nodded eagerly.\n\n‘Yes! I see nothing wrong with this. But I ask you both—be as careful as possible. We do not need to sow panic among the URC. You are dismissed.’"

greneclyf_base.25.a:0 "‘And I need to… take this off and think about how I came to such a decision’"

greneclyf_base.40.t:0 "Bound"
greneclyf_base.40.d:0 "‘You see, Your Majesty, since the River Coalition is still far from federalization, and the rivbit remains only at the discussion stage, reforms will proceed gradually. As a partner of the economic zone, you will receive many preferences, but…’ Sweet Sprinkle hesitated.\n\n‘Do not stall. In matters like these there is always a “but”,’ the queen cut her off.\n\n‘Very well, I will be frank, if you permit. Separate treaties with each country would drive the kingdom into a debt trap. Therefore, as your broker and administrator of Saor, I recommend signing a compromise agreement with the URC. URC shares are stable, and even if some countries leave the Coalition, the company itself will endure. This will allow you to stabilize the situation and avoid famine.\n\nJust… keep in mind that this is not aid, Your Majesty. This is business. Everything has its price. But it is better to pay less for something reliable than to squander funds aimlessly, is it not? Even your investment in hiring me proved sound: my appointment as chair of Saor may have shocked me, but for you it was a far more tactically advantageous move than letting yet another URC corporatocrat take the seat.\n\nSo… let us work together to solve your problems. You are not alone.’\n\nGytha nodded and signed the contract expanding the powers of the United River Company within her country. Before that, she consulted with Oyren and secured the right for the Guard to participate in Saor’s internal affairs, despite the pressure.\n\nFrom this moment on, the main engine of Greneclyf’s economy became a conglomerate of foreign companies."

greneclyf_base.40.a:0 "‘They sold us the rope. Will we hang them with it?’"

greneclyf_base.41.t:0 "Crimson Sunset"
greneclyf_base.41.d:0 "Carrion, together with a detachment of the Praetorian Guard, carried out a series of crushing raids on underground cells following tips from Lord Shaw. Nests of conspiracy were uncovered throughout the capital region. The prefect was beside himself with fury that treacherous rats had been roaming and plotting right under his nose, yet they gave no chance for interrogation—anyone caught would immediately kill themselves, by poison or by gunshot.\n\nThe case archives swelled: signs, pamphlets, records, confiscated weapons. A coup had been maturing in the country, spurred by communists intending to exploit the recent crisis as a pretext. Their so-called party was not even registered in the kingdom, let alone known to the citizens.\n\nFinally, when a liaison officer burst into yet another cleared room, he quickly spoke with Carrion—the secret service had deciphered fragments of one ‘revolutionary’s’ diary. They described an emergency plan of action in case the underground was exposed.\n\nThe Praetorian Guard intercepted the agents in the port of Aisling. Shaw and Carrion watched through binoculars as a small vessel faced them, several changelings with their families staring back. The general raised a hoof to order an artillery strike, but the lord-protector stopped him.\n\n‘They have learned their lesson, prefect. Send them to Tartarus. We have no need to become child-killers.’\n\n‘What about the data?’, Carrion asked, still observing through the binoculars what had once been the greatest threat to the kingdom.\n\n‘We will study everything thoroughly and develop counter-strategies. We must understand the enemy and its goals. And understand them well.’\n\nThe soldiers and agents dispersed, and soon a detailed report on the “Crimson Sunset” case lay upon Gytha’s desk."

greneclyf_base.41.a:0 "‘How far the tentacles of communism have reached’"

greneclyf_base.42.t:0 "Fallen Revolutionaries"
greneclyf_base.42.d:0 "Today comrades in ideas arrived from a distant eastern island. They report that their revolution has failed and offer to extend a helping hoof in our righteous cause—the spread of Marxism across all of Griffonia."

greneclyf_base.42.a:0 "‘Welcome!’"

greneclyf_base.33.t:0 "Dawn Over the Island"
greneclyf_base.33.d:0 "The queen was enjoying the early dawn in her garden when the door creaked and the Lady Judge found her. Oyren did not say a word—she simply sat beside her and shared the quiet with her sworn sister.\n\nBoth understood that the times ahead might prove even harsher than the crisis they had endured. Moments as calm as this one would grow fewer, so there was no need to spoil it with talk. Still, Oyren could not help looking at Gytha. The wind gently stirred her rose-colored hair, and her gaze held firmness and certainty. She was no longer who she had been before the famine began; now, before the Judge stood a strong, matured monarch, ready to lead an entire nation.\n\nSuddenly, from the open door came the strikes of a great clock, announcing five in the morning. Gytha rose slowly, smiled at Oyren, and walked back into the palace, leaving Her Excellency alone in the garden."

greneclyf_base.33.a:0 "‘Duty does not wait’"

greneclyf_base.700.t:0 "A Drop of Ink That Changes the World"
greneclyf_base.700.d:0 "‘Strange place you chose, Gagat,’ Shaw said, inspecting what had once been a bakery workshop and had now become the kingdom’s mouthpiece under the name “printing house.” He grimaced slightly as he took in the setting: the smell of dough still lingered in the air, and the old wooden beams lent the place an atmosphere of something outdated and ill-suited to ambitious plans.\n\nA heavyset changeling, puffing on a cigar, stared at the building with enchanted eyes and only after a delay—having finally heard the crown’s lord-protector—replied, ‘Basalt, what does it matter where it is? This is the future, you understand? This is not just a gold mine—it’s a real way to shape public opinion!’ Gagat began to dissolve into blissful laughter, so hard that tears streamed from his eyes, yet he could not stop.\n\n‘And I see you’re fired up about it. Good thing Baroness Vixit loves innovations, and you were lucky to find her patronage,’ Shaw added, carefully studying the buildings around them. ‘The court is considering creating a new department for work with the populace. I might even head it. So, my friend, we’ll keep in touch about printed materials as well.’\n\nGagat beamed. ‘Of course! If only you knew how the little colt inside me is rejoicing right now! I’m putting my hoof to something truly great—being the director of the first printing house in the country.’ He took another deep pull and shouted at the workers to carry the presses more carefully.\n\nSatisfied with the process, Shaw filled out paperwork with his old companion and then asked, ‘And what will you call the newspaper?’\n\nGagat stepped closer to Basalt and slowly traced a hoof through the air:"

greneclyf_base.700.a:0 "‘Crónán na Fírinne’"

greneclyf_base.34.t:0 "The Blue Envelope"
greneclyf_base.34.d:0 "As Gytha signed decrees, her eye caught a blue envelope tied with a ribbon. It smelled of expensive perfume, so the queen immediately guessed who had sent it. Setting the decrees aside, she opened the envelope and began to read:\n\n‘My dearest queen,\n\nThe situation in the Holy Grove has stabilized, and I finally have both the time and the desire to investigate the possible influence of witches in this region. Enclosed, I attach an official petition requesting that You allow me to personally lead the investigative measures aimed at uncovering sorcerous activity.\n\nYours sincerely,\n\nPrefect of Llir, Baroness Vixit Lehmann’\n\nThe queen quickly scanned the letter, glanced at the copies of the coven’s marks, and then at the report on the strange harvest and the mysterious healings that had occurred during the crisis."

greneclyf_base.34.a:0 "‘Very well. But do not overdo it.’"

greneclyf_base.35.t:0 "The Search"
greneclyf_base.35.d:0 "It was not the first time Vixit had handled investigations personally. She had always felt a genuine pull toward anything that stirred her mind, and so the desire to prove or disprove the existence of witches in her lands became another captivating game of intellect for the baroness.\n\nAfter questioning subjects and guards, she assembled approximate information: the witches might number anywhere from four to six, and after each of their “operations” they leave a coven mark—just like the one Vixit had found in the letter during the investigation of the plot where witches’ seeds had sprouted.\n\nThe inhabitants’ opinions were divided. Some were certain the witches did evil, others that they did only good, and a third group denied their existence altogether, attributing everything to Matrona’s miracles.\n\nSmiling with satisfaction and leisurely exhaling a thread of bluish smoke through her holder, Vixit headed for the last place where witch activity had been seen—on the outskirts of the Holy Grove.\n\n‘Decided to show up for once in a century?!’ a local priest, Xido, barked at her irritably.\n\n‘Watch your tone, rabble. Do not forget who you are speaking to,’ the baroness tilted her head coldly. ‘I have come by direct order of the queen to investigate the actions of the witches’ coven.’\n\nThe priest grimaced, but soon perked up. ‘High time. There was an arson recently, part of the flock died—and the marks! The cursed marks, everywhere! Matrona is my witness, it is certainly the fault of those impious women!’\n\n‘Marks..? Tell me more about the fire.’\n\nXido sighed heavily. ‘I… I arrived only when it was already burning. You should speak with little Briona—she is the only one who survived from poor Tadin’s family. She lives in a barrack by the church now.’"

greneclyf_base.35.a:0 "‘Très bien, this promises to be interesting.’"

greneclyf_base.36.t:0 "The Survivor"
greneclyf_base.36.d:0 "The baroness visited the last survivor of the farming family. It was a thin, trembling drone with several years left before adulthood.\n\n‘For you, this is undoubtedly a great tragedy. However, I ask you to set emotions aside, for I have come to establish the truth and punish the guilty. Please tell me what happened that night.’\n\nThe teenager looked at the baroness with frightened eyes, searching for words. She was silent for a long time before speaking: ‘I-it was at night, two days ago. I h-heard voices behind the wall… evil laughter… And then lightning struck our house! But not from the sky, I swear! It came from the side!’\n\nThe drone sobbed, trying to hold back tears. ‘Father went to see what was going on, but the cursed…’ Her voice broke, and she finally gave in to her emotions. ‘The cursed witches burned him alive! And then they destroyed our home… They left their marks… everywhere…’\n\nVixit calmly exhaled a ring of smoke. ‘Where was your house?’\n\nAfter the answer, she nodded and went to the place now called the Pyre.\n\nWandering among the charred ruins, the baroness found mysterious signs left on the walls and floor. She studied them closely and frowned. These marks did not match those she had seen earlier in the letter. They were rougher and more ornate.\n\nShe returned to the dignitary: ‘Where are the bodies?’\n\n‘Being prepared for burial, in the—hey!’\n\nThe priest did not have time to finish: Vixit shoved him aside and hurried into the church basement.\n\nIn the darkness of the cold room, she found the family’s bodies covered with veils. One by one she uncovered them, carefully examining the charred remains of her former subjects. Xido prayed behind her, wailing about blasphemy.\n\nThe baroness rose indifferently and threw out, ‘I am staying here for the night. Prepare a bed for me.’"
greneclyf_base.36.a:0 "The priest nodded wearily"

greneclyf_base.37.t:0 "Past Midnight"
greneclyf_base.37.d:0 "In the darkness, Vixit hurriedly left the church, heading back toward the Pyre.\n\nShe already suspected someone would return to the ruins—and she was right. Among the wreckage darted a hooded figure, hunched over the signs left behind, whispering something softly.\n\n‘Stop!’ the baroness shouted.\n\nThe stranger gasped, flinched, and without hesitation bolted. Vixit surged after her at once, and the chase vanished into the forest’s darkness.\n\nShe ran through thickets, branches cracking under hoof. Out of breath, the prefect finally stopped before an old manor. The house looked ancient, but it was clearly cared for. Warm light glowed in the windows.\n\nThe baroness exhaled, steadied herself, and opened the door.\n\nAnd inside, she saw them.\n\nA zebra was brewing some sort of potion, sprinkling it with dried herbs with a coltish zeal, while a batpony—apparently the one Vixit had been chasing—rushed up to her, chattering rapidly. A unicorn and a doe broke off their tea, freezing and staring at the unexpected guest. And a pegasus with gleaming fangs kept writing something.\n\n‘Oh… is that you, baroness?’ the zebra spoke first.\n\nThen, giving the batpony a calming look, she added, ‘Do not worry, Nachtalina. That is our prefect.’\n\nVixit swept her gaze around the room.\n\n‘You…’ she narrowed her eyes, ‘you are the “sisters”? The very witches?’\n\nThe doe smiled:"

greneclyf_base.37.a:0 "‘A pleasure to finally meet you, my lady.’"

# Багрянец восхода
greneclyf_base.38.t:0 "Crimson of the Dawn"
greneclyf_base.38.d:0 "Vixit stamped her hoof. ‘I already figured out you weren’t behind the arson in the village. Your mark in the letter is different from the runes left there.’\n\n‘Correct. It was our Gismirra who drew it—she came up with the design of our sign herself,’ said the unicorn, stepping toward the satisfied pegasus.\n\nThe baroness went on: ‘And one more thing. The farmer’s family’s bodies were cut up… by something long and thin.’\n\n‘Long and thin?’ The pegasus turned to the doe. ‘Valfrida, does that tell you anything?’ The doe shook her head.\n\n‘Purvita?’ Gismirra turned to the unicorn.\n\n‘I never took an interest in pagan rites, forgive me, dear,’ the unicorn replied, tossing her head.\n\n‘Demonic marks!’ Nachtalina continued, speaking excitedly. ‘It was them, Sanctella, I’m sure! The village is in danger!’\n\nThe zebra frowned, folding her forehooves across her chest. ‘Runes… a long implement for killing…’ she murmured. ‘Feels like demon-worship. Someone was sacrificed.’\n\nShe snapped her head toward Vixit. ‘Your Grace, please—let us postpone introductions. We must save the village immediately. I will help you!’\n\n‘And…’ Purvita had begun, but the zebra raised a hoof, stopping her.\n\n‘No, girls. Stay here. The baroness and I will handle this.’\n\nThe way back passed in tense silence between Vixit and Sanctella—until the sharp stink of smoke hit them. They quickened their pace, then broke into a run. The prefect readied her magic to strike, while the zebra feverishly leafed through a small book of spells and ancient script.\n\nA blood-red dawn greeted them as they neared the settlement: the scarlet sky of early morning blended with the thick, black reek of fires.\n\nThey reached the church and threw open the heavy doors. Corpses with dreadful faces lay in the pool of their last communion. Dark streams spread like tongues across the floor, flooded the tiles, curled in thin rivulets along the steps—where, among the slain, lay hooks and hacksaws.\n\nVixit felt nausea overtake her, her certainty slipping for a moment. Sanctella, however, surveyed the scene with a cold, hard stare.\n\nAnd then she rose.\n\nA thin, fragile little body shook in a fit of soundless laughter. An empty, crazed gaze fixed on the sorceress and the prefect.\n\n‘Briona…’ Vixit breathed. ‘I should have guessed.’\n\n‘No, Miss Vixit.’ The zebra’s voice was even, but heavy. ‘This is not a child. This is a demon that seized her soul and devoured it. Unfortunately, there is no saving her.’\n\n‘Then we can lay her to rest!’ the baroness shouted, firing magic at the convulsing body. It sprang aside like a coil. The monster erupted into another fit of chilling laughter and, with a motion both elegant and grotesque, hurled a sheaf of daggers at the baroness—when Sanctella shoved her aside, saving her from death.\n\nThe monster kept laughing and laughing. The baroness trembled for the first time, feeling fear. But the zebra continued reading aloud—her voice growing louder, her words gaining force—and in answer to them the creature began to writhe in convulsions. Staring straight into the empty, rolled-back eyes, Sanctella stepped closer, raising her voice into a shout. Taking the final step, she forced a vial into the creature’s mouth; once it was emptied, the thing let out an unbelievable scream and collapsed dead.\n\nSanctella helped Vixit to her feet, and they left the village that had become a mass grave for hundreds of parishioners. After the events, the baroness ordered the remaining ruins of the settlement razed.\n\nSome time later, the Coven was found again—on another day, in another place. And this time the baroness convinced them to meet Gytha in person."

greneclyf_base.38.a:0 "‘Let’s see what the queen will say.’"

greneclyf_base.39.t:0 "Quintet"
greneclyf_base.39.d:0 "Gytha read Vixit’s report with mounting тревога. Her gaze kept shifting from the paper to the witches seated before her. Rumors of their existence had proven not merely true—they truly worked miracles and all this time had been secretly helping in the Holy Grove.\n\nA daytime breeze fluttered the white curtains in her office as Gismirra gave an annoyed snort and tugged her veiled hat lower, hiding from the bright sunlight.\n\n‘Well… I’ll be frank: I’m shocked.’ Gytha drew a breath, looked at the witches again, and leaned forward. ‘You… You are all truly heroines. But why did you never make yourselves known?’\n\nPurvita sighed sadly. ‘All we ever wanted, dear queen, was peace. Our story is long and joyless—we never wished to become heroines.’\n\n‘Still better than being secret troublemakers,’ Valfrida smirked.\n\n‘Besides, we don’t even have any legal grounds to be here…’ Nachtalina added gloomily.\n\n‘And some of us have, shall we say, certain… difficulties with the surroundings, including sunlight,’ Gismirra drawled, tugging her hat down even further.\n\nGytha looked at them in bewilderment. ‘You saved my prefect. My aunt. You deserve more than citizenship… you deserve recognition!’\n\nSanctella inclined her head. ‘But what can we do? Protect Greneclyf from wickedness like the kind practiced by the necromancers of the League of Dread?’\n\nGytha smiled broadly and clapped her hooves on the desk.\n\n‘Exactly!’"

greneclyf_base.39.a:0 "‘From now on, girls, you are the core of Majestic V!’"

greneclyf_foregin.1.t:0 "A Visit to the Guardians"
greneclyf_foregin.1.d:0 "Semper Fai, dressed in his uniform, stood out against the backdrop of the Brookvale ponies staring at him in astonishment as he followed robed figures toward a beautifully painted wooden structure. Entering, he saw ponies sitting in a circle in similar cloaks—the figures accompanying him took their places among them. A Farbrook pony standing beside him waved a hoof, inviting Semper to sit opposite the one called Izelynn. The changeling began speaking in broken Farbrook speech, using an interpreter.\n\n‘My name is Semper Fai, Guardian. I represent the Kingdom of Greneclyf on the island beyond the hills, and first of all allow me to sincerely thank you for the help Brookvale provided during the crisis that struck us. I know your community was deeply surprised to learn of changelings, but your kindness saved many.’\n\nIzelynn listened to the interpreter, then nodded with a small chuckle. She babbled something and then held out a large mug of something fizzy to the counter-admiral. The changeling shot a questioning look at the interpreter. The interpreter gave only a faint nod, hinting that he should drink. Taking a sip, Semper felt a wave of calm—and the taste of something very natural… and salty.\n\nIzelynn set down her own mug and also took a sip, showing she was ready to hear more.\n\n‘But my queen is interested in a deeper friendship with your community, respected Guardian. We want…’ Semper hesitated, searching for a word the Brookvale ponies would understand instead of “integration,” ‘…to marry you?’\n\nHearing the translation, Izelynn, cheeks faintly pink, flicked her ears in confusion, her gaze fixing on the counter-admiral—who was already thumping a hoof against his forehead as the meaning sank in. The advisers around her began whispering.\n\n‘I… I mean a state union, you understand?’ Semper swallowed nervously. ‘T-that is, our two peoples will be like spouses to one another, t-that’s all…’\n\nIzelynn rose from her place and looked the changeling over carefully, then said something to the council. After that she brought out fine mugs filled with water that was now pink.\n\n‘What, do I have to drink something again?’ Semper asked the interpreter. The interpreter only shrugged, clearly hiding something in his gaze.\n\nThe changeling was already preparing to drink when Izelynn began to feed him herself. Guessing instinctively, he returned the gesture. When the vessels were empty, the interpreter said briefly, ‘Congratulations.’\n\n‘For what?’\n\n‘For your engagement.’\n\nThe counter-admiral’s eye twitched. Of course the queen had ordered him to secure an alliance with Brookvale at any cost, but…"

greneclyf_foregin.1.a:0 "‘FOR WHAT?!’"

greneclyf_foregin.2.t:0 "An Offer from Greneclyf"
greneclyf_foregin.2.d:0 "Queen Gytha offers us help with industrialization, educating our populace, and developing trade in exchange for love. This agreement may have long-lasting consequences... Shall we accept the bugs’ proposal?"

greneclyf_foregin.2.a:0 "Of course!"
greneclyf_foregin.2.b:0 "No trust in changelings!"

greneclyf_foregin.3.t:0 "Order 1400"
greneclyf_foregin.3.d:0 "From: Department of International Relations, Secret Chancellery\n\nTo: Commander Semper Fai\n\nYou are hereby informed that Her Royal Majesty Gytha has ordered the initiation of an operation to assimilate the vast hill-lands regardless of the wishes of the shamans and tribes inhabiting them. The regional naval forces are granted the right of autonomous coercion to harmonize communities in the event that leaders display ideological extremism or refuse to submit to integration into the kingdom.\n\nGlory to Greneclyf!"

greneclyf_foregin.3.a:0 "‘Someone’s about to show their face.’"

greneclyf_foregin.4.t:0 "Always Faithful"
greneclyf_foregin.4.d:0 "The counter-admiral was studying the new agreements—written in many languages—when General Latro approached with his usual dignified stride and, stopping before the desk, snapped a crisp salute. Semper returned it, watching the general expectantly.\n\n‘I hereby notify you on behalf of Her Excellency the Lady Judge that you have been officially appointed prefect-primaris of the so-called hill region for the duration of the integration of the new prefectures, counter-admiral.’\n\nFai nodded. It was expected: Oyren surely wanted him to take on a civilian post and impose order in the region.\n\n‘And setting formalities aside—quite the wife you found yourself, Fai,’ the general added with a sly grin.\n\nSemper frowned and adjusted his cap.\n\n‘Her accent in Greneclyfian is dreadful, but at least she’s trying to learn it, which is very much worthy of praise,’ Latro continued.\n\n‘Stop clowning, Latro. If that’s all, I’d like to get to work.’\n\n‘Of course, of course,’ the general of the life guard said, placing a whole stack of administrative orders from Oyren and Gytha before Fai.\n\n‘And I wasn’t joking, actually,’ he added, turning with a grin. ‘Half the command is jealous of you. You really did get lucky with Izelynn—however absurdly it all turned out.’\n\nChuckling softly, Latro left the office as the counter-admiral exhaled wearily, propping his cheek on a hoof."

greneclyf_foregin.4.a:0 "‘Yeah. I know.’"

greneclyf_foregin.5.t:0 "A Woman of the Times"
greneclyf_foregin.5.d:0 "‘This… is unfair!’ Gytha blurted out after getting the answer to her question.\n\n‘But that’s reality, Your Majesty. Ponies in the Riverlands aren’t exactly known for friendliness—believe me, I spent my whole life there,’ Sweet Sprinkle replied with a shrug.\n\n‘You see, the alliance formed historically, but out of necessity—defense against those cursed griffons. After all, they even kept their own in slavery not that long ago. Or they do again? Forgive me, I don’t follow Wittenland news. Not to mention we have to put up with diamond dogs and their lout of a king.’\n\nThe broker dared to lay a hoof over the distressed queen’s.\n\n‘Your Majesty… don’t be sad. It’s like with neighbors, you understand? They always sling mud at you behind your back. That’s the world.’\n\n‘No, Sprinkle,’ Gytha replied, placing her other hoof atop Sweet’s, ‘that isn’t normal. And I want you to help me convince them—to help build a fundamentally new society.’\n\n‘But… it won’t happen without violence, Your Majesty.’\n\n‘I understand.’"

greneclyf_foregin.5.a:0 "‘You don’t make revolutions in white gloves.’"

greneclyf_foregin.6.t:0 "The Organizer"
greneclyf_foregin.6.d:0 "‘This queen is insane. But I kind of like it,’ Sweet Sprinkle muttered under her breath, sketching something on a canvas.\n\n‘A job’s a job. I’ll jump into Tartarus and kick Grogar in the rump if you pay me for it. And here—pff—just create a new party across eight states, somehow organize tight coordination between them, prepare a supranational coup, and brainwash millions of ponies into believing federation is the purpose of their lives… ha-haaa… You get it? Easy!’\n\nShe tipped over her coffee mug, staring with red-rimmed eyes at her kitten Pickles, then flopped onto the couch as the little furball curled up beside her. The next morning Gytha herself came into her office and watched with curiosity as the pony lay sprawled on the floor—having slid off the couch overnight—and now snored peacefully.\n\n‘Miss Sprinkle?’\n\n‘Wah! Yes, ma’am! No! Aye-aye! What?!’\n\nShe looked around, saw the queen already studying her desk with interest, and—after fumbling with her glasses—shuffled over, clearing her throat.\n\n‘I wrote the details here and here, but the short synopsis: I have certain contacts in the political circles of the Republic, Bakara, and Ozagrad. With your funding and agents, we can spread the idea of federation to all the River states. The concept is called “9 Stars”—a supranational pro-federal party with its own combat detachments, whi—’\n\nSweet broke off into a long yawn, after which Pickles cozily settled on top of her head.\n\n‘…which will be packed with your operatives and start removing anyone undesirable, while agitators wash the public’s brains. Give the project a couple of years, a mountain of money, and talented managers—and the Coalition, already tilting toward federalization, will be unified.’\n\nGytha barely suppressed a chuckle at the kitten perched on Sweet’s head, but still asked:\n\n‘But why “9 Stars”? Aren’t there eight countries?’\n\n‘Oh, that’s simple.’"

greneclyf_foregin.6.a:0 "‘The ninth is Greneclyf.’"

greneclyf_foregin.7.t:0 "The Idea"
greneclyf_foregin.7.d:0 "‘MAKE HISTORY—JOIN “9 STARS”!\n\nWe stand on the threshold of a new era—an era of strength, unity, and fateful decisions. Nine great peoples, divided by artificial borders yet bound by a single destiny, are ready to become the cradle of progress and peace for all the East.\n\nThis is your democracy. Create it. Defend it. Preserve it for your children and spread it. Let a new nation be born—a nation of peoples, races, and faiths, united in their pursuit of freedom.\n\nFederation is a song.’"

greneclyf_foregin.7.a:0 "‘And it must be sung together.’"

greneclyf_foregin.8.t:0 "A Useful Place"
greneclyf_foregin.8.d:0 "‘So what is it?’ The changeling in a tux gave the foreman a skeptical look. ‘Will it be ready for commissioning soon or not?’\n\n‘Give us a couple of months for finishing and polishing, and it’ll be ready,’ the foreman hesitated.\n\n‘You know… this is strange. Why an embassy in this hole, and not, say, in Rechkograd?’\n\n‘That’s none of your business. Just build, get paid, and move on,’ the politician said dryly, heading for his automobile.\n\n‘Everything’s moving fast, my lord-protector. One or two months and we can open.’\n\n‘Understood. Excellent, Dusk. Soon you’ll be working here yourself. But for now we’ll check the other sites,’ Shou replied.\n\nThe car rolled along country roads lined end to end with construction: railways, the concreting of potholes, various civic buildings. It looked as if Greneclyf had decided to industrialize Ponaidhean tribes out of pure kindness. But behind it all was a reason—and the reason was simple: political predictability. While other states of the Coltstream Agreement still had old nobles, fascists, communists, and other psychopaths, Ponaidhean had calm, fresh air, harmony, and a certain stability. And you don’t need more than that to advance your interests abroad."

greneclyf_foregin.8.a:0 "‘Life is good.’"

greneclyf_foregin.9.t:0 "The Bakbanburg Pogrom"
greneclyf_foregin.9.d:0 "‘This is a political scandal!’ the Greneclyf ambassador to the Coalition, Emerald Dusk, cried out at the guard looking down his nose at him. ‘How dare you allow Greneclyf citizens to be beaten so brutally?’\n\n‘Listen, Deponia has enough problems of its own without babysitting outsiders. Nobody died, right?’\n\n‘I can’t believe my ears! How dare you, long-faced ignoramus! Mark my words—I won’t let this go, you—’\n\n‘Well, well, what have we here, little changeling?’ The politician’s tirade was cut off by a tall white pony standing before him, staring at Dusk with an even more arrogant look.\n\n‘You’ll regret this, Miss Punch. You and your barbaric propaganda!’ Dusk hissed, returning to his car and slamming the door shut."

greneclyf_foregin.9.a:0 "‘Now I understand why the queen chose Ponaidhean.’"

greneclyf_foregin.10.t:0 "Clean Hit"
greneclyf_foregin.10.d:0 "“Thank you for subscribing to our newsletter! We appreciate your interest in the common cause. Federation is not a country. It is an idea.”\n\nAchoit Purple wasn’t sure what he’d gotten himself into. He loved his country. He believed in the queen. He believed “9 Stars” was a chance to protect her. But now, staring at a letter filled with dreams of a state that didn’t yet exist, and remembering the agitator’s words, he suddenly felt a chill crawl down his spine.\n\nA ring cut through the silence.\n\n‘Hi, this is “Storm” from Animal Control Oversight. We need you on shift today. 104 North Street. The owner’s complaining—her dog got loose. Handle it and deliver it to the shelter. Move fast; others will clean up after you. And don’t bother the neighbors!’\n\nIt might have sounded like a wrong number, but Purple understood exactly what it meant. They knew who they were calling. They knew he would understand.\n\nDark streets, sparse lamps. At the roadside stood a cloaked figure, still as stone—just another shadow. In the distance, a vehicle approached. A black sedan, rich enough for Deponia, and by the plates he already recognized it. Caramel Punch. Deponia’s top nationalist. The pony who hated changelings. The one who, in every interview, said their place was in reservations, not in the Coalition.\n\nPurple and the shadow exchanged looks. ‘Allure’—a slight nod and the click of a safety being taken off. The bullet entered the wheel at the exact moment the car crossed the intersection. Tires shrieked, metal screamed—and the sedan’s body tore through the roadside barrier.\n\nAchoit was there before the last shards of glass finished scattering. Disguised as a pony, he wrenched the car door open and dragged out the politician, who didn’t even have time to scream. Once she was finally bound, Purple glanced once more at his “colleague.”\n\nThe other was already walking toward them, taking the shape of a traffic inspector and acting as if he’d arrived to assess the crash. Everything followed the script—until a shot rang out alongside a rasping wheeze. Nobody was hit; Punch’s dying bodyguard dropped his pistol as the “inspector” approached, pressed a hoof to his nose, and listened for a moment to the wet, strangled gurgling.\n\nA second later Achoit vanished into an alley, carrying the politician on his back—this same pony who, only days ago, had spoken confidently about Deponia’s independence. He didn’t know what would happen to her. That wasn’t his job. His job was to leave the package where it needed to be.\n\nA week later the country shook. Caramel Punch—the nationalists’ symbol, their voice—suddenly changed her position. Now she spoke of unity, of the necessity of integration, of the time to forget the past for the sake of a common future.\n\nKing Grimhoof listened. The people listened. And Achoit listened too, with an empty expression, waiting for the next call."

greneclyf_foregin.10.a:0 "‘Allure.’"

greneclyf_foregin.11.t:0 "At Crimson’s Court—and the Queen’s"
greneclyf_foregin.11.d:0 "“I must admit,” Crimson began, “I’m genuinely flattered by your offer of friendship, Queen Gytha. Few take us seriously, preferring to do business with republicans or princes.”\n\n“Oh, come now—your confederation is a model for other Coalition countries of what harmony should look like, Crimson. The only thing you lack is progress and industrialization, and we are more than willing to help you with that. As friends.”\n\nCrimson was slightly touched by such frank flattery, but kept her composure. “Tell me, Gytha… I’m no stranger to understanding both friendship and trade customs. Harmony is built on mutual exchange, so tell me: how can I repay you for helping with industrialization?”\n\nGytha brightened at how understanding the pony before her was.\n\n“Oh, nothing special—only that you recognize our friendship officially. Isn’t it wonderful when two countries can tell the whole world they care about each other and are ready to cover one another’s flank?”\n\nCrimson laughed at Gytha’s line of thought, taking a long sip of tea. “I like how that sounds. Unlike the puffed-up, self-satisfied nobles of Wittenland, you aren’t demanding submission. No—this sounds like a declaration of love between peoples!”"

greneclyf_foregin.11.a:0 "“Then let’s make it official!”"

greneclyf_foregin.12.t:0 "Off We Go"
greneclyf_foregin.12.d:0 "“I still think this is very risky,” Basalt said, watching the queen pack her suitcases.\n\n“News from the West is unsettled. Coalition ponies said there’s some tension between our kind and Equestria.”\n\n“Then I’ll find out personally!” the queen replied, sitting on the suitcase to close it.\n\n“We’ll make two visits: to Equestria and to home. I’ll go to the homeland with you and Latro, and Equestria will be visited by Oiren, Semper, and Carrion. Of course, all with guards—but with good intentions. So get ready: it’s time to go home!”"

greneclyf_foregin.12.a:0 "“I still don’t like this.”"

greneclyf_foregin.13.t:0 "A Warm Welcome"
greneclyf_foregin.13.d:0 "“Matron Almighty! What are you doing?!” Oiren shouted as Carrion’s soldiers pulled her back from the hole in the concrete, while Semper’s marine detachment leveled rifles at the Equestrian naval border guards.\n\n“I repeat! Return to your country—we don’t need Chrysalis’s agents here!”\n\n“Who even is this Chrysalis?!”\n\nThe pony shifted his gaze dully, keeping his rifle up, until a fellow servicemare jabbed him in the shoulder: “Maybe they’re Thoraxicans? Listen—their speech is weird.”\n\nAt the sound of a shot, a Bakaran sailor burst from the cabin, looked from side to side, then began gesturing and shouting at the Equestrians in their language: “Calm down! These are representatives of the Kingdom of Greneclyf in the far East—our neighbors!”\n\n“You must have gotten heatstroke, eastern cousin, if changelings are your neighbors now.”\n\n“I’m telling the truth, you paranoid stubborn idiot—look!” He pointed at the flagstaff and at the ship’s papers filled out in Greneclyfian.\n\nThe border guards exchanged glances. One spat and lowered his weapon. “Whatever. Stay here, Light Splash—I’ll call the police, let them sort it out. Maybe they really are some kind of Thoraxicans, and maybe they’re our friends.”\n\nRifles lowered on both sides as Oiren drilled the insolent pony with her stare.\n\nThat evening, after Equestrian military police escorted them to Vancouver City Hall, Princess Twilight Sparkle—and Celestia herself—arrived in the city on urgent notice.\n\nOiren watched them with cool condescension, chin propped on her hoof, while Twilight examined her and the entourage—until Celestia began:\n\n“Greetings, Greneclyfians! It has been a long time since I last heard anything of you—so long that it seems nearly a thousand years have passed. Please forgive me for the actions of”—she turned her head toward the naval patrol captain—“my little ponies. You see, in our lands Greneclyf has long become the stuff of old scrolls, and even textbooks no longer mention that such a place exists. How have you been?”\n\n“How have we— Indeed. How have we been after your paranoiacs almost shot us? What was that, Princess Celestia—where did that aggression come from?!” Carrion snapped.\n\n“Greneclyfians… a separate people…” Twilight Sparkle murmured in surprise. “Allow me to give you a brief explanation of what has been happening on Equus over the last—um—hundred years.” Twilight hurried out and returned with books and a thick stack of scrolls, while Oiren’s eyes widened slightly at the sheer size of the manuscripts."

greneclyf_foregin.13.a:0 "“We’re in for one hell of an evening…”"

greneclyf_foregin.14.t:0 "After the Lecture"
greneclyf_foregin.14.d:0 "“And that brings us to today—when the border situation is at a boiling point, and your entire kind is in the shackles of a tyrant. Oh! Sorry—that was harsh,” she added with a nervous laugh.\n\n“But now you’re here! Real Greneclyfians—changelings who chose a different path, judging by your answers and stories. Incredible—this means you can help Thorax!”\n\n“Alright. Wait, Princess—slow down for a minute,” Oiren replied wearily. “This is all… a bit too much. First I need rest—and I need to discuss everything with my queen before we talk politics. I understand the continent is tense, but I came first and foremost as an emissary to establish diplomatic relations between us. Let’s start with that, Miss Twilight… Celestia?”"

greneclyf_foregin.14.a:0 "“Why, of course!”"

greneclyf_foregin.15.t:0 "Report on the Visit to Equestria"
greneclyf_foregin.15.d:0 "Initial diplomatic contact established, nearly escalating into a scandal; fresh information obtained on recent continental events, presented through the lens of Equestrian propaganda.\n\nSociety becomes tense at the sight of a changeling. Apparently, perceptions of our species were damaged by the actions of a certain Chrysalis—the current tyrant of our homelands, which were unified under her hoof relatively recently. Ideologically, Equestria is close to us, and will most likely use our image in propaganda as that of a “good changeling.”\n\nRecommended: develop political relations while shifting public perception of our kind. A full strategy can only be developed after visiting Chrysalis herself. A mediator role would give us a unique position on Equus.\n\nP.S. The country is still ruled by Princess Celestia—some things don’t change even after a thousand years. Her trusted aide is Princess (a relative?) Twilight Sparkle, who briefed us on the situation."

greneclyf_foregin.15.a:0 "“And her pink friend cooks deliciously, too.”"

greneclyf_foregin.16.t:0 "Outsiders"
greneclyf_foregin.16.d:0 "When Gytha and her entourage stepped ashore, everything around them felt strangely empty. But after only a few steps into the wasteland, they found themselves surrounded by drones—whose aggression quickly gave way to confusion.\n\n“And you… who are you?” the taller one asked. “I don’t recognize your scent, and you look like a queen. But none of the queens I know look like you.”\n\nThe soldiers began arguing over whether the visitors were impostors or something else, until Gytha cut in.\n\n“My dear drones! I represent House Lehmann and rule the distant overseas hive of Greneclyf! No hoof of our clan has set foot on these lands for nearly a thousand years, and therefore I demand an audience with your leader”—Shou whispered a name in her ear—“Chrysalis, yes!”\n\nOne drone pulled an awkward face while another scratched the back of his head. “Did you understand anything?”\n\n“Yeah. Quiet—this is Ditrysiumian, just… insanely complicated and kind of wrong. Better take them to Queen Helvia. And let’s not involve those UOBV hounds, alright?”\n\nA soldier raised a hoof at Gytha and shouted loudly: “I! WALK!”, pointing at himself and then in the direction to go."

greneclyf_foregin.16.a:0 "“Well then—shall we follow him?”"

greneclyf_foregin.17.t:0 "Old and New Worlds"
greneclyf_foregin.17.d:0 "“Strange. Why do you think they aren’t suspicious, but even… submissive?” Latro asked.\n\n“Probably they sense a queen. It’s in their nature—after all, they’re drones, and I’m right here,” Gytha replied as their escort knocked and opened a large door.\n\nInside, Gytha saw a beautiful changeling mare arguing insistently into a telephone. When she finished, she slammed the receiver down in anger—then looked up and froze in surprise.\n\n“And who are you supposed to be?!”\n\nGytha shifted her gaze, preparing to introduce herself again, but Basalt cut in: “Apologies for the disturbance, w—”\n\nThe mare interrupted: “Is that Ditrysiumian?” She instantly switched dialect. “And such a strange one… I’m completely lost. I know this dialect because I am Helvia, Queen of the Hive Ditrysium. And how do you know it? You’re not from my hive—I’m seeing you for the first time. And you”—she pointed at Gytha—“are clearly a queen as well. What is going on..? Did Chrysalis decide to replace me?!”\n\n“Wait! Tell me—have you heard of a ruler named Queen Mirel the Mighty?”\n\n“What is this, a history lesson? There was such a queen in Ditrysium at the start of the last millennium. She ruled for a relatively short time before vanishing in yet another coup.”\n\n“You’re not her descendant?”\n\n“No. Maybe you’ll finally ex—”\n\nGytha placed her hoof on Helvia’s gesturing hoof, holding a steady smile. “My name is Gytha Lehmann. Nearly a thousand years ago, Mirel exiled my family and House Oir to a distant island in the west.”\n\n“…Greneclyf,” Helvia frowned."

greneclyf_foregin.17.a:0 "“You need to speak with Chrysalis.”"

greneclyf_foregin.18.t:0 "A Queen in a High Castle"
greneclyf_foregin.18.d:0 "“So, Greneclyf, you say? I thought that expedition died out centuries ago—taking its exiles with it. But we are changelings, after all: we endure any conditions, don’t we?” Chrysalis smirked as she studied Gytha and her entourage, whom Helvia had brought before her.\n\n“And you’ve got a cute outfit. You must serve some important role?” She shifted her gaze to Latro.\n\n“Captain of the Royal Guard, Your Highness. I command the elite.”\n\n“Oh, the elite, huh? One day I should set up a little competition between you and Trimmel.”\n\nChrysalis turned to Trimmel and laughed loudly; her subordinate followed suit—then she stopped abruptly.\n\n“So, Gytha. Tell me—what do you think of the Hives? I’m curious what such a unique kinsling as you has to say.”\n\n“W-well…,” the Queen of Greneclyf hesitated. “Honestly, I never expected the Hives to become a single state. You’ve clearly outdone yourself—managing to unite so many clans that used to squabble with each other.”\n\nChrysalis flicked her forelock, plainly proud of herself. “And everything would be going wonderfully if it weren’t for those damned ponies in the east. We are hungry. We need the love those sickeningly saccharine creatures can give us—and we will take what we need by force. You should understand me better than anyone, Queen.”\n\nEveryone in the entourage shifted uneasily, making Chrysalis arch a brow.\n\n“How do I put this…,” Shou began.\n\n“Do you know what the traders of Ditrysium were known for back in the day, Chrysalis?” Gytha asked.\n\n“For cunning. That’s why Vesalipolis made an axis with those leeches—bringing the rest to heel, right, Helvia?”\n\n“In a certain sense.”\n\nGytha shook her head. “And cunning can be used in different ways. Let’s put it like this: our methods differ from yours—but I want to learn more about your country and offer you friendship.”\n\nChrysalis grimaced. “Cooperation. I like that word better.”"

greneclyf_foregin.18.a:0 "“Well then—cooperation it is…”"

greneclyf_foregin.19.t:0 "Behind the Curtain"
greneclyf_foregin.19.d:0 "“There’s something unpleasant about them, Helvia. As if they act like ponies from time to time. Does isolation really ruin us that badly?”\n\nThe Queen of Ditrysium silently watched as the puffed-up Chrysalis paced back and forth.\n\n“But you know what’s interesting? If Greneclyf is alive, then in time they can become part of the Hegemony! Imagine it: connections, intercontinental smuggling, a united kind under MY banner! And besides—we won’t just rule Equus, we’ll squeeze Griffonia from both sides, dictating terms to the locals.”\n\n“Can I go now?” Helvia exhaled. “You dumped a mountain of tasks on me this morning. I have to do them somehow, or you’ll just lose it again.”\n\nChrysalis stared her down for a moment, narrowing her eyes, then hissed: “Go.”\n\nAfter leaving the hall, Helvia leaned against a window frame, watching yet another parade."

greneclyf_foregin.19.a:0 "“I liked them…”"

greneclyf_foregin.20.t:0 "Report on the Visit to the Changelings’ Lands"
greneclyf_foregin.20.d:0 "Primary contact established; the visit was surprisingly peaceful. We obtained our kin’s perspective on the past and held dialogue with Supreme Leader Chrysalis and Queen Helvia of Ditrysium.\n\nSociety is deeply militarized and настроено toward conflict with non-kin. The autocratic regime is leading them into a dead end, offering an exit through violence rather than the cooperation we pursue. Chrysalis may, in time, seek unification on her terms (unacceptable).\n\nRecommended: cautious political engagement while maintaining dialogue. Chrysalis is crude and cruel, but when she is interested in something, that can be leveraged to our advantage.\n\nP.S. Queen Helvia of Ditrysium is not connected to House Mirel; therefore, our opponents did not keep the throne. Vengeance across the centuries is satisfying."

greneclyf_foregin.20.a:0 "“And she’s rather cute, too.”"

greneclyf_foregin.21.t:0 "Greneclyf Volunteers to Mediate!"
greneclyf_foregin.21.d:0 "Recently reappearing on our continent, Greneclyf has offered to act as a third party in our conflict with [INSERT COUNTRY NAME AND MIRROR FOR THE OTHER]. They see the threat of war and propose diplomatic measures to delay the conflict. Shall we listen to them?"

greneclyf_foregin.21.a:0 "Fine."
greneclyf_foregin.21.b:0 "Absolutely not!"

greneclyf_foregin.22.t:0 "Trade with Greneclyf"
greneclyf_foregin.22.d:0 "The eastern changelings are offering us profitable economic projects at the cost of certain concessions. Should we agree to the deal?"

greneclyf_foregin.22.a:0 "Sure—why not"
greneclyf_foregin.22.b:0 "This isn’t a priority right now"

greneclyf_foregin.23.t:0 "Chrysalis Rejects the Deal"
greneclyf_foregin.23.d:0 "The regime of the Changelings’ Lands has rejected our proposal for cooperation, adding that this does not mean a severing of ties—simply that the proposed deal is not in their interests at present."

greneclyf_foregin.23.a:0 "Then—another time"

greneclyf_foregin.24.t:0 "The Midnight Guest"
greneclyf_foregin.24.d:0 "A changeling stepped off the ship in a tight green frock coat; the very first thing he did was bow and kiss Gytha’s hoof.\n\n“Deeply honored, Your Majesty. I will be glad to serve as the liaison between our countries.”\n\nGytha nodded with a smile and let the delegation pass, while Shou raised an eyebrow.\n\n“That’s someone from Helvia’s family. Possibly a brother. We should get to know him better.”\n\n“How did you figure that out, Lady Gytha? Blond hair?”"

greneclyf_foregin.24.a:0 "“No, Basalt—he’s just as handsome.”"

greneclyf_foregin.25.t:0 "Rainbow Splash"
greneclyf_foregin.25.d:0 "Watching the aerobatic pirouettes of Greneclyf’s aircraft, Dash was not very impressed, declaring that these were standard military tactics.\n\n“No, no, no, no, NO! You’re doing it all wrong, guys—this is basic stuff! Let me show you something actually awesome!”\n\nDash hopped into one of the fighters, climbed rapidly, and began demonstrating a series of fast, aggressive maneuvers with sharp changes in altitude and heading—then moved on to loops, barrel rolls, and steep dives with pullouts back into level flight.\n\nIn the end, after a dash toward the ground within millimeters of the surface, she landed and jumped from the cockpit in front of the stunned pilots.\n\n“Oh yeah! Did you see that? That’s how aces fly!” She slapped the engine casing with a hoof—then, a second later, it dropped to the ground, unable to handle the overheating.\n\nRainbow gave an awkward grin when one of the pilots dared to ask her:\n\n“Miss Dash—no offense, but you didn’t come to Greneclyf only to teach us suicidal tricks, right?”\n\n“Uh… kinda. A tree told me.”\n\n“A tree..?”\n\n“Long story. Anyway, I’ve got some kind of purpose here—and I’m here to figure it out and fix it.”"

greneclyf_foregin.25.a:0 "“Or I’m not the Element of Loyalty!”"

greneclyf_foregin.26.t:0 "Trade with Greneclyf"
greneclyf_foregin.26.d:0 "The eastern changelings are offering us profitable economic projects at the cost of certain concessions. Should we agree to the deal?"

greneclyf_foregin.26.a:0 "Sure—why not"
greneclyf_foregin.26.b:0 "This isn’t a priority right now"

greneclyf_foregin.27.t:0 "Celestia Declines the Trade Offer"
greneclyf_foregin.27.d:0 "Princess Celestia has politely declined our proposal for cooperation, adding that this does not mean a severing of ties—simply that the proposed deal is not in their interests right now."

greneclyf_foregin.27.a:0 "Then—another time"

greneclyf_foregin.28.t:0 "Greneclyf Requests Protection!"
greneclyf_foregin.28.d:0 "Our distant ally in the east is asking for formal guarantees. The step is largely symbolic—but if anything threatens them, we would have to sail across the whole world. Do we agree?"
greneclyf_foregin.28.a:0 "Friendship is magic!"
greneclyf_foregin.28.b:0 "But it’s so far away..."



# CORE GYTHA - MAIN #
# Реалполитик \n\n
greneclyf_core.1.t:0 "Realpolitik"
greneclyf_core.1.d:0 "«Знаешь, мне кажется, у нас действительно странное государство», – сказала Гита, глядя на что-то вновь пишущую Ойрен.\n\n«Расплывчато. Будь поконкретнее», – ответила Ойрен, макая перо в чернильницу.\n\n«Мы используем методы и левых, и правых. Наша экономика централизована, но при этом и децентрализована. Мы даже адаптировали что-то из концептов Бикколини, которого поливают грязью и революционеры, и реакционеры половины мира. И всем этим управляет королева... Быть может, это и есть реальная гармония?»\n\nОйрен медленно моргнула, качнув головой: «Скорее, это Realpolitik. Прагматизм, иным словом. Забавно: грифоны когда-то придумали этот вид политики – и сами же утонули в войнах и разногласиях по любому поводу».\n\n«Скорее уж печально... Но, знаешь, этот подход мудрый. Его стоит адаптировать и в отношениях с нашими соседями. Будем честны: мы во многом зависим от них. Скоро они снова попытаются диктовать нам условия, как во времена кризиса», – задумалась королева.\n\n«Да что ты. Хочешь разорвать связи и наложить эмбарго, объявив автаркию?»\n\n«О нет, ни в коем случае. Торговля полезна. Просто я всё думала – как бы их сделать зависимыми от нас... И у меня есть замечательная идея».\n\nСудья устало подперла челюсть копытом, слабо улыбнувшись Гите: «Буду рада послушать».\n\n«Продать им идею, милая. Купить умы их граждан, показав, как мы живём. Внушить им, что быть с нами лучше, чем без нас», – довольно ответила королева.\n\n«Амбициозно. И как мы это будем реализовывать? Плакаты раскидаем и толкнём пару речей, получив в итоге от каких-нибудь стражников Речкограда за политагитацию?»\n\n«Элементарно, дорогая Ойрен!» – отрезала Гита."

greneclyf_core.1.a:0 "«Мы сделаем это прагматично!»"

# Гринклиф просит вступления в Коалицию 
greneclyf_core.2.t:0 "Гринклиф просит вступления в Коалицию"
greneclyf_core.2.d:0 "Королевство Гринклиф направило официальный запрос о вступлении в Речную Коалицию. По сути, они уже давно считались неофициальным кандидатом, полностью соответствуя всем требованиям и принося значительные торговые выгоды. Кроме того, их инвестиции в развитие Понайяна вызвали положительную реакцию местных пони."

greneclyf_core.2.a:0 "«У нас нет причин отказывать королеве Гите»"
# ОТКАЗ 
greneclyf_core.2.b:0 "«Мы предпочитаем дружить на расстоянии»"

# Коалиция принимает нас
greneclyf_core.3.t:0 "Коалиция принимает нас!"
greneclyf_core.3.d:0 "Отличные новости из Речкограда: Речная Коалиция официально приняла нас в свои ряды! Мы долго к этому стремились – и, к счастью, наши старания увенчались успехом.\n\n«Ура» Коалиции и слава нашей мудрой королеве!"

greneclyf_core.3.a:0 "«Ура!»"

# Бурная река 
greneclyf_core.4.t:0 "Бурная Река"
greneclyf_core.4.d:0 "Базальт,\nключевое звено наших операций оказалось захвачено антиконституционными тираническими элементами. Свирл и Речная Республика жизненно необходимы как для целей Гринклифа, так и для поддержания баланса в регионе.\n\nВоенное руководство под ведением Гектора Липиззана планирует совершить путч для восстановления гражданского законного правительства. Поддержи их, любой ценой приведя к победе – местные оперативники „9 Звёзд“ готовы оказать содействие.\n\nПровал недопустим.\n\nУдачи"

greneclyf_core.4.a:0 "«Будет исполнено»"

# Il Principe
greneclyf_core.5.t:0 "Il Principe"
greneclyf_core.5.d:0 "На стене кабинета висела огромная карта Коалиции, исписанная заметками и стрелками. Гита изучала их внимательным взглядом, слегка улыбаясь.\n\n«Ойри, ты помнишь, как мы в детстве играли в "Совет мира"? У нас были неполные карты мира, и мы ставили флажки туда, где хотели, чтобы больше не было войн. Когда мама рассказала мне о грифоньих революциях и гражданских войнах, мы истыкали этими флажками весь неказистый узор графств Герцленда. Помнишь?», – спросила она с неожиданной нетерпеливостью.\n\nОйрен взглянула на подругу, слегка нахмурившись: «Да... Мы ещё устраивали "суд над тиранами" – Гроверы, Кемерскай, какая-то знать Речных Земель. К чему вся эта ностальгия?»\n\nКоролева не двинулась, сверля взглядом карту. «Теперь у нас настоящие тираны. И реальная возможность стать теми, кто заставит мир прекратить войны. Я сделала всё, чтобы нас приняли. Реформы, уступки, подкуп – ты знаешь, как это было. Но теперь, когда мы стали частью Коалиции, мои глаза, наконец, узрели правду. Коалиция – это рынок, а не мечта. Все играют друг против друга, всё вертится вокруг дотаций, махинаций, превосходства...»\n\nГита повернулась, глядя через плечо прямо на Ойрен: «Я знаю про ту девчонку, которую в Саоре убил посол. Тогда, пару лет назад... это потрясло меня до глубины души».\n\nСудья поморщилась: «Гита, мы ведь тогда решили э-»\n\n«Нет!» – резко перебила королева и подошла ближе. Ойрен рефлекторно отступила.\n\n«Ты не понимаешь, Ойри. Смысл в том, что подобную мерзость из Коалиции выкорчевать способны лишь мы. Дорогая моя, даже говоря, что они гармонисты, эти пони врут нам, врут самим себе. Им неведома настоящая гармония, и покажем её им именно мы»\n\nМонарх сделала шаг назад и мягко улыбнулась ошарашенной судье: «Они не поймут язык убеждения. Их можно только переиграть. Объединить. По-настоящему объединить. Видишь карту?»\n\n«Я сделаю это одной страной»\n\nОйрен помрачнела. «Гита, чем это отличается от нелюбимых тобой тиранов? Ты идешь наперекор своим принципам»\n\n«Мои принципы всё те же – истинная гармония»\n\n«Какой ценой?! Как ты вообще убедишь их на это согласиться? А если откажутся, то пошлёшь армию?!», – выпалила судья, переходя на свою манеру из выступлений в Эряхтасе.\n\n«Поверь, у меня есть свои методы. А что до несогласных... История всегда требует жертв. К сожалению. Н-но...но Ойри, разве не лучше, если этих жертв будет мало и сейчас, чем потом, когда проклятые экстремисты окрепнут и нападут на нас?»\n\nОйрен покачала головой, потрясённая: «Ты звучишь как Гровер Второй перед походом на Речные Земли. Кажется, история повторяется, но на сей раз с востока. Неужели террористы девятизвёздочники – это твоих копыт дело?»\n\nГита промолчала, отвернувшись к окну.\n\n«Гита... Я люблю тебя. И я тебе предана. Но подумай, кем ты становишься». Судья направилась к двери, оставив королеву наедине с самой собой: «Увидимся позже»."

greneclyf_core.5.a:0 "«Цель... оправдывает средства?»"

# Мать-основательница
greneclyf_core.117.t:0 "Мать-Основательница"
greneclyf_core.117.d:0 "Когда были объявлены результаты выборов, она не удивилась. 73% избирателей избрало её в качестве первого президента Федерации. Теперь взгляды были устремлены на неё не только в Гринклифе – за каждым её шагом следили народы всей новой великой нации.\n\nПосле победы она почти ничего не почувствовала. Некоторые регионы голосовали из страха перед террором „9 Звёзд“, в других просто исчезли все альтернативные кандидаты-сепаратисты, оказавшиеся неудобным.\n\nОна долго смотрела в своё отражение в зеркале. Можно ли с уверенностью сказать, что всё это того стоило? Возможно, на этот вопрос смогут ответить только историки и грядущие поколения. Пока она не знала.\n\nНо она знала другое: теперь на её плечах лежит ответственность, куда большая, чем прежде.\n\nВыйдя из комнаты, она наткнулась на Базальта Шоу.\n\n«Ваше ве-...госпожа президент. Всё ли готово?»\n\nОна закрыла глаза. «Я оставила бумаги для Ойрен. Она пока не в духе, не хочет видеться со мной... Попроси потом Кианита передать ей: на время исполнения мною обязанностей президента она официально назначается леди-регентом Королевства Гринклиф. Я не могу совмещать обе должности – таковы правила».\n\nГлава её секретной службы, ставший одним из главных представителей федеральной разведки, кивнул, подтверждая приказ.\n\n«Как только передашь – можем отправляться»."

greneclyf_core.117.a:0 "Королева поведёт Гринклиф и Речные Земли в новую эпоху!"
greneclyf_core.117.b:0 "Возможно, нам подойдёт Ривер Свил..."

# Роял-флеш
greneclyf_core.7.t:0 "Роял-флеш"
greneclyf_core.7.d:0 "Свит Спринкл зачитывала перед Советом директоров ОРК официальное требование королевства: выкупить СЭЗ Саор по весьма щедрой цене.\n\nДиректора были в бешенстве. Комната закипела от споров, пока один из членов Совета – представитель Депонии – не обратил внимание на хитрую ухмылку Свит Спринкл.\n\n«Госпожа администратор, а чему вы так улыбаетесь? Вы ведь теряете свою работу».\n\nСвит только шире улыбнулась: «Теряю ли? Господа, рада сообщить, что по уникальному пункту соглашения о продаже Саора я получаю специальные преференции от королевства: гражданство и должность в правительстве».\n\nЗал вздрогнул. Кто-то разинул рот, кто-то недоверчиво фыркнул.\n\n«Более того», – Спринкл прищурилась, – «внимательнее перечитайте оригинальный договор о создании СЭЗ. Конкретно отредактированный пункт о том, что в случае предложения выкупа со стороны Гринклифа вы обязаны согласиться. В качестве компенсации вам полагаются дивиденды на длительный срок».\n\nВ комнате воцарилась тишина.\n\n«Так что прошу вас поскорее закончить этот балаган, подписать проклятую бумагу и не задерживать нас тут».\n\nОна встала, легко потряхивая копытами: «Ах да, и примите мою увольнительную. Брокером ОРК я больше не работаю»."

greneclyf_core.7.a:0 "«Та-та, джентельпони!»"

# Новый кардинал 
greneclyf_core.8.t:0 "Новый Кардинал"
greneclyf_core.8.d:0 "Гита помнила обещание, данное старику в Блосмпорте, и оставалась верна своему слову. Сегодня вечером колокола Блосмпортского Аббатства пробили долгожданную мелодию, которую верующие ждали десять лет.\n\nКак глава Церкви Святой Леди Матроны, королева Гита приняла присягу претора Актино, даровав ему сан кардинала Геральда III. С этого момента он будет определять развитие религиозной мысли на долгие годы, прекращая раскол.\n\nПриняв святые регалии, Геральд III поприветствовал паству, которая пала на колени в молитве."

greneclyf_core.8.a:0 "«Да будет воля Её услышана!»"

# Королева и конституция
greneclyf_core.9.t:0 "Королева и Конституция"
greneclyf_core.9.d:0 "Когда Ойрен презентовала Гите проект Конституции, она едва сдерживала радость и гордость за проделанную работу. С горящими глазами она рассказывала о каждой статье, о ротации чиновников, о выборных сроках, пока не остановилась на пустом поле. \n\n«А это место пока свободно», – сказала Ойрен. «Здесь должна быть статья о структуре исполнительной власти».\n\nГита нахмурилась: «Хм... почему же оно пусто? Ты что-то задумала?»\n\n«На самом деле да», – кивнула Ойрен. «У меня есть два предложения касательно этой части Конституции: Вариант первый – мы сохраняем статус-кво, но фиксируем его в законе. Иначе говоря, полнота власти остаётся за королевой, которая сама решает, что утверждать, а что нет.\n\nВариант второй – мы вводим институт премьер-министров. Гита, ты делаешь слишком много, каждой королеве нужно второе официальное лицо, которое будет опорой. У меня есть детальные проекты для обоих вариантов, но я хочу услышать твоё мнение».\n\nКоролева задумалась, медленно перелистывая страницы..."

greneclyf_core.9.a:0 "«Я считаю, что мы должны оставаться гибкими»"
greneclyf_core.9.b:0 "«У меня есть как раз кое-кто на примете для поста премьера»"

# Да, министр
greneclyf_core.10.t:0 "Да, Министр!"
greneclyf_core.10.d:0 "Ойрен перекривилась, нервно задергав глазом. Единственное, что она смогла выдавить из себя, было приглушённое «Хе?..»\n\n«Ну да. Кто ещё лучше справится, если не ты?» – беспечно ответила на её удивление королева.\n\n«Гита, Гита, Гита, ГИТА! Это невозможно! Я – Верховная Судья! Я представляю законодательную власть!»\n\n«Ну, а я говорю, что возможно» – хихикнула Гита. «Ты не только Верховная Судья, но и Мать Конституции, Ойрен из рода Ойр. Если кто и заслужил этот пост, то явно ты, а не какой-нибудь префект вроде хвастуна Кэрриона».\n\nГита сделала шаг вперёд и мягко посмотрела ей в глаза: «Пожалуйста, Ойри. Ты мне нужна».\n\nОйрен глубоко вдохнула, затем выдохнула... после чего завыла в потолок и рухнула мордой на стол.\n\n«Да уж... Я явно не была готова к тому, что стану официальной второй особой страны, таща на себе и законодательную, и теперь ещё часть исполнительной власти... Может, ты мне и корону свою отдашь?», – саркастично пробормотала она, сверля Гиту уставшим взглядом.\n\nКоролева рассмеялась: «Может. Правда, скорее, твоим детям».\n\nОйрен застыла, а её щёки будто бы на секунду отдали розовым. Затем с глухим стуком она снова уткнулась мордой в стол, зарыв лицо в копыта."

greneclyf_core.10.a:0 "«Ах, до чего же поэтично всё вышло, Ойри!»"

# Ubi mel, ibi apes  #####! Ключа этого ивента я не нашел. Фокус Проект «Apis», внутренняя политика
greneclyf_core.6.t:0 "Ubi mel, ibi apes"
greneclyf_core.6.d:0 "Целарл спокойно выждал, пока депутаты заняли свои места. Затем он поправил очки, включил проектор, и на огромном полотне появились снимки дронов с поясняющими подписями. \n\n«Приветствую, уважаемый созыв. Без лишних вступлений, сегодня я хочу представить вам результаты моих исследований в области повышения эффективности труда. Однако мои эксперименты касались вовсе не экономических стратегий. Нет, я исследовал явление, относящееся к биологии. И вот что мне удалось выяснить: видите ли, в каждом из нас есть определенный недостаток апилактозы, весьма сложного соединения, вырабатываемого... пчёлами», – в зале раздались шёпоты. Учёный прокашлялся и невозмутимо продолжил.\n\n«В ходе лабораторных экспериментов я провёл серию тестов на добровольцах, вводя им раз в неделю смесь раствора апилактозы и специфических гормональных соединений, которые в простонародье называют “любовью”. Результаты оказались поразительными. Испытуемые ощутили прилив сил, снижение тревожности и улучшение концентрации на сложных задачах. По оценкам моих ассистентов, их трудоспособность возросла в среднем на 26,765%. Уважаемые делегаты, я предлагаю организовать промышленное производство этой смеси и использовать её в качестве добавки в школьном питании и на предприятиях. Разумеется, под мою ответственность.».\n\nНаступила пауза. Затем начались ожесточённые дебаты. Оппозиция кричала про «этику и мораль», но приверженцы прогресса утверждали, что Гринклифу нужны инновации."

greneclyf_core.6.a:0 "С небольшим перевесом проект был принят"


## ARCTIC ##
# Арктика найдена ##### не нужно, нарратив по фокусам есть. Я могу добавить, но резона нуль – перегруз будет текстом
greneclyf_arctic.1.t:0 "Рыбалка"
greneclyf_arctic.1.d:0 "Руди и Чароит стояли над могилой. Несколько дней назад Тинакс начал кашлять, пока они пытались поймать хоть что-нибудь, разбухая от голода в своей лодке, и вчера отдал Матроне душу прямо там же. Их лица уже не выражали ничего – даже на жалость уже не было сил.\n\nУтром они пришвартовались к скалистому острову, чтобы похоронить своего товарища. Руди бросил взгляд на их последнего спутника – старика Керне, который даже в момент похорон пытался что-то удить в мёртвой воде.\n\nЧароит беззвучно поплёлся к нему. Хотя он не мог этого выразить, в голове у него зрело желание утопить Керне: маниакальная одержимость старика рыбалкой вызывала в нём непреодолимую злость.\n\nВстав рядом с сгорбившимся компаньоном, он замахнулся камнем, но заметил, что у того что-то начало клевать. Впервые за недели отсутствия улова. Парой ловких движений Керне выловил большого лосося, голову которого разможжил Чароит. Троица молча развела костёр, съела рыбу и, наконец, нашла в себе силы говорить.\n\n«Мы должны рассказать другим. Дому нужна еда», – сказал Руди, разгребая угли в костре.\n\nКерне просто молча кивнул, пока Чаорит не поморщился: «Знать бы ещё где мы находимся. Мы просто плыли на север?»\n\nСтарик вновь кивнул, ворча что-то неразборчивое.\n\n«Давайте...помолимся за Тинакса», – сказал Руди, поглаживая крест Церкви Матроны на шее.\n\nНаловив рыбы на несколько дней пути и вернувшись в Ллир, рыбаки поведали об удивительно плодовитых северных ледниках, заинтересовав официальные власти в освоение региона."

greneclyf_arctic.1.a:0 "Соответствующий эдикт был выпущен довольно скоро."

# Сектор сирпински
greneclyf_arctic.2.t:0 "Сектор Сирпински"
greneclyf_arctic.2.d:0 "Ронове обустраивалась на своей новой работе на полярной станции. Она всегда была замкнутой – порой это становилось причиной травли, особенно в школе. Окончив обучение в Эйслинге, она сразу же подала заявку на участие в программе освоения Севера. Получив довольно быстро положительный ответ, она покинула свой нелюбимый дом.\n\nВ окне она смотрела на бескрайние снежные просторы, изрезанные силуэтами многоэтажных жилых зданий, выросших за годы освоения. Там жили другие пионеры севера: учёные, солдаты. Были и такие же, как она, волонтёры.\n\nВпервые за всю свою жизнь она ощутила... покой. Может, жизнь в арктической пустыне, постепенно обрастающей зданиями, и не мечта каждой молодой чейнджлингини, но её нынешнее положение устраивало более чем.\n\nРонове сделала несколько щелчков на массивном радиопередатчике, мимолётно взглянув на постер с изображением отдающего честь солдата в противогазе. Настроив нужную волну, она отхлебнула кофе, слегка отодвинув в сторону лежащие рядом пластинки, которые иногда ставила в эфир, и начала говорить в микрофон:"

greneclyf_arctic.2.a:0 "«Внимание. Внимание. 39486 60170...»"

# Forces #
greneclyf_forces.3.t:0 "Безопасность арктической торговли"
greneclyf_forces.3.d:0 "Полгода моря вокруг Гринклифа скованы льдом, и торговля превращается в постоянную борьбу с самой природой. Купцы жалуются на убытки, капитаны проклинают замёрзшие волны, а экономика королевства страдает от непредсказуемого ритма сезонов. Однако королева заявила, что этот гнёт больше не будет терпим. Перед флотом стоит новая задача: не просто защищать наши берега, но и разорвать ледяные цепи, сковывающие торговлю. Ледоколы, новые маршруты и смелые экспедиции могут превратить северные моря из преграды в жизненную артерию - если у нас хватит воли выдержать это испытание."

greneclyf_forces.3.a:0 "Море будет служить нам, а не мешать."


# Перепутье
greneclyf_forces.4.t:0 "Перепутье"
greneclyf_forces.4.d:0 "«Ваше Величество, Ваше Превосходительство», – отсалютовал Семпер Фай, войдя в кабинет с двумя увесистыми папками, –«после длительных и оживлённых бесед с вашими любезными курсантами и теоретиками спешу сообщить, что наш флот находится в весьма достойном по современным меркам состоянии».\n\n«Что ж, это радует», – ответила Судья.\n\n«Однако, чтобы сохранить стратегическое превосходство в регионе, нам необходимо определиться с дальнейшей доктриной. Видите ли, в современном мире выделяют три основные концепции развития военно-морского флота. Однако последняя – экспериментальная и невероятно дорогая в производстве, поэтому, как контр-адмирал королевства, я предлагаю исключить её из рассмотрения и сосредоточиться на первых двух».\n\nФай прокашлялся, поймав одобрительные кивки главных лиц государства, и затем положил перед ними папки.\n\n«Красная папка представляет доктрину, сосредоточенную на совершенствовании существующей структуры нашего доблестного флота с учётом современных реалий. Наш флот силён, и я настаиваю на развитии нашей ударной флотилии. Тогда, –Семпер быстро стукнул по столу, –мы обгоним даже проклятых бакарцев, фактически заявив права на весь регион».\n\nПока Ойрен с удовлетворённым видом изучала папку, Гита спросила адмирала: «А что же зелёная папка? О чём она?»\n\nФай слегка замялся: «Это альтернативный план развития флота, но... скажем так, запасной. Он исходит из заведомо осторожной, если не пораженческой, позиции – что нашего флота недостаточно для доминирования в морях, а потому следует сосредоточиться на подводных лодках и рейдерских атаках на вражеские суда. Мне этот план не очень по душе не только из-за уязвлённой гордости, но и из-за его подхода. Основная ресурсная база наших потенциальных соперников находится на континенте, а значит, нам будет сложно нанести решающий удар. Однако в условиях политической нестабильности региона это позволит буквально задушить континент, лишив его связей с внешним миром»."

greneclyf_forces.4.a:0 "«Мы покажем этим бакарцам!»"
greneclyf_forces.4.b:0 "«Стоит быть осмотрительными...»"

# Заседение комитета по обороне
greneclyf_forces.5.t:0 "Заседание Комитета по Обороне"
greneclyf_forces.5.d:0 "В середине дня на заседание Комитета по Обороне Эряхтаса собрались высшее военное руководство, депутаты и сама королева. Предстоял утомительный, но чрезвычайно важный разговор о будущем армии – вопрос, который не мог быть решён простым королевским указом из-за масштабности инициативы. Генералы настаивали на введении обязательной воинской повинности для граждан Королевства.\n\n«Слово предоставляется Эйпексу Кэрриону, префекту Блосмпорта и генералу Королевской Гвардии», – постановила Ойрен, наблюдая за приближающимся военным.\n\n«Приветствую достопочтеннейших депутатов. Ваше Величество».\n\nКэррион окинул собравшихся строгим взглядом и заговорил: «Перед нами стоит важнейший вопрос: каким должен быть фундамент нашей армии? Ответ очевиден – нам нужна сильная, дисциплинированная и многочисленная регулярная армия, основанная на воинской повинности.\n\nВо-первых, безопасность государства не может зависеть от кучки элитных солдат. Войны выигрывают армии, а не горстка героев. Нам нужно знать, что у нас есть сотни, тысячи подготовленных воинов, готовых держать рубежи нашей страны. Во-вторых, воинская повинность укрепит нашу нацию. Военная служба – это школа дисциплины, единства и гражданского духа. Прошедший службу – не просто солдат, он патриот, готовый встать на защиту своей родины в случае опасности.\n\nМы не можем позволить себе строить оборону государства на узком круге людей. Нам нужен народ под ружьём, а не избранные рыцари. Я призываю вас поддержать доктрину регулярной армии и воинской повинности! Только так мы обеспечим безопасность нашей страны и её граждан».\n\n«Ваша позиция была услышана, префект. Время», – стукнула молотком Ойрен, призывая удалиться поклонившегося Кэрриона. «Слово предоставляется генералу Лейб-Гвардии Бермондту Латро».\n\nК трибуне вышел статный офицер в чёрной форме своего полка с характерными нашивками. Он снял фуражку, широко вытянув её в приветствии депутатов.\n\n«Достойные господа! Возлюбленная королева! Мир изменился, и война изменилась вместе с ним. Наступило время не численности, а качества. Армия будущего – это мобильные, высококвалифицированные, элитные подразделения, способные наносить молниеносные удары и решать задачи, которые обычная пехота даже не поймёт.\n\nЭлита – это сила, которая действует точно и эффективно. Регулярная армия – это масса, которую нужно кормить, одевать и вооружать. За регулярной армией необходим присмотр, что сулит нагрузку на бюрократический аппарат королевства. А это коррупция и безалаберность в войсках.\n\nКонфликты сегодня – это не бесконечные фронты и огромные армии. Это спецоперации, диверсии, скорость. Кто справится с этим лучше – элитный солдат, обученный до совершенства, или призывник, едва успевший понять, как держать оружие?\n\nНе говоря о том, что никакой дисциплины не хватит для наведения порядка среди насильно согнанных масс, в каждом из которых дремлет насильник и злодей, трус и паразит, готовый предать товарищей по оружию. Мой план реформ – это путь к победам, а не к бессмысленным потерям».\n\nПосле выступлений Эряхтас принялся голосовать. Решающим оказался голос Лорда Шоу, который выбрал..."

greneclyf_forces.5.a:0 "Доктрину регулярной армии Кэрриона"
greneclyf_forces.5.b:0 "Доктрину элиты Латро"

# Нарушитель
greneclyf_forces.6.t:0 "Нарушитель"
greneclyf_forces.6.d:0 "Даск Лорий полусонный стоял в строю после изматывающего ночного караула. Кто-то из новобранцев, посчитав тревогу отличной шуткой, поднял на уши весь лагерь.\n\nВнезапно к старшине подошёл скромно одетый политрук, таща за собой трясущегося юнца. Получив кивок, он повернулся к солдатам. «Равнясь!»\n\nЕго голос прозвучал как удар хлыста, мгновенно пробудив многих.\n\n«Товарищи-призывники! В полку беспорядок. Хулиганьё устраивает диверсии. И вам, как старшим, поручено провести суд и наказать непутёвого, наставив его на путь чести и благородства, чтобы впредь никто не смел играть с такой вещью, как боевая тревога. На первый-второй рассчитайсь!»\n\nПосле быстрого расчёта политрук приказал бойцам выстроиться в две шеренги и раздал каждому винтовочные шомполы. Солдаты напряжённо переглядывались, не понимая происходящего. У того самого юнца покосились колени.\n\n«За лишение сна боевых товарищей и ложную тревогу, которая в иной ситуации могла стоить жизни, призывник Елен Бромум наказывается двумя сотнями ударов шпицрутенами. Приговор исполнить немедленно. Каждый, кто откажется, получит пятнадцать ударов сам».\n\nСкулящий Бромум попятился назад, но политрук резко пнул его вперёд. Другие подняли шомполы, готовясь наносить удар.\n\nЛорий замялся. Глядя на корчившегося от боли Бромума, он вспомнил, как всю ночь не мог сомкнуть глаз из-за идиотской тревоги. Сжав зубы, он нанёс удар, пожалуй, даже сильнее, чем остальные.\n\nКомиссары порой перегибали с наказаниями, но постепенно солдаты начали видеть в них не надзирателей, а старших товарищей – строгих, но справедливых. Дедовщина была искоренена, а Кодекс стал настольной книгой каждого новобранца."

greneclyf_forces.6.a:0 "«Честь и совесть нации»"

# Псы войны
greneclyf_forces.7.t:0 "Псы Войны"
greneclyf_forces.7.d:0 "Орб Селлер сразу произвёл на Латро сильное впечатление. Глава ЧВК резко контрастировал с генералом лейб-гвардии: пока первый раскуривал сигару, время от времени осклабляясь, второй изучал его с холодной сдержанностью.\n\n«Итак», – выпустил облако дыма Селлер, – «Кажется, вы хотели о чём-то поговорить, Ваше Благородие?»\n\nЛатро глянул на часы. Прошла всего минута, а ощущалось, будто час.\n\n«Да, именно так, господин Селлер. Мне известны методы вашей армии, я видел служивших там существ и нахожу рациональным предложить вашим профессионалам работу. Королевство хочет нанять вас для подготовки наших будущих солдат. Мы слишком долго жили в мире и критически нуждаемся в опыте практиков, а не теоретиков».\n\nПони слегка приспустил свои солнечные очки, пристально взглянув на генерала.\n\n«Ха, а я-то думал, что вы планируете переворот или что-то подобное. Ясно, низкоприоритетный контракт, значит. Что ж, это вполне можно устроить. Но!» – Селлер по-деловому разложил перед ним бумаги, – «прочтите условия. Моим бойцам необходима постоянная ротация: они не могут сидеть на месте, им нужно участвовать в операциях, а не только дрессировать ваших новобранцев».\n\nЛатро внимательно изучил контракт, затем поднял глаза.\n\n«Вы уверены, что такая текучка кадров не повлияет на качество подготовки? Рекруты и наставники не успеют сформировать связь».\n\nСеллер хмыкнул.\n\n«А что, если эта связь окажется негативной? Не переживайте», – он протянул генералу перо, – «мы знаем, что делаем».\n\nПосле нескольких секунд раздумий Латро подписал контракт. На мгновение ему показалось, что он заключает сделку с демоном. Орб Селлер довольно улыбнулся, будто читая его мысли."

greneclyf_forces.7.a:0 "«Мы ещё увидимся, генерал»"

# Мысли о божественном
greneclyf_forces.8.t:0 "Мысли о Божественном"
greneclyf_forces.8.d:0 "Генерал вёл очередную свою беседу с Селлером, расхаживая из стороны в сторону на взлётном полигоне, пока пони следил за ним взглядом.\n\n«Идея, Селлер, должна лежать в душе каждого солдата. Даже будучи наёмником, ты это понимаешь лучше прочих. И вот скажи мне: какой может быть связующая идея для Гвардии? Родина? Семьи?»\n\nСеллер повёл ушами. «Я верю в войну, Латро. Родина – это флаг, который предаст тебя в случае необходимости. Семья не вечна, королева смертна. Война – это испытание воли: своей и чужой, при этом внутри воли более великой. Война – это последняя, абсолютная игра, ибо она превращает само существование в единое целое».\n\nЛатро задумался.\n\n«Это идеальная философия для пса войны, но не для национальной армии. Мы привязаны к Гринклифу – он наш дом. Мы верим в королеву и... в Матрону».\n\nСеллер поднял бровь.\n\n«Матрона?»\n\n«Это наша богиня. Культ Леди Матроны, дарящей любовь и защиту. Нашей святой защитницы и покровительницы»\n\nГлава ЧВК поднял голову: «Мой Бог – это сама война. Но я понимаю тебя и твою мысль. Религия действительно может быть хорошим средством единения для солдат, если правильно её преподнести. Бог вечен. Бог бессмертен. Бог не предаст»\n\nГенерал довольно улыбнулся:"

greneclyf_forces.8.a:0 "«И Бог с нами»"

# Механические звери \n\n
greneclyf_forces.9.t:0 "Механические Звери"
greneclyf_forces.9.d:0 "Перед Базальтом лежали два одновременно поступивших запроса от разных инициативных групп Института Изучения Войны. Первая продвигает уделить особое внимание изучению грифоньих тактик танкового блицкрига, в то время как вторая настаивает на том, что нам не хватит ресурсов на танковые исследования, акцентируя внимание на моторизированных бригадах и потенциальных проектах бронетранспортеров.\n\nОднако, учитывая ограниченность ресурсов, можно выбрать только один проект. Шоу подумал немного и поставил свою печать на..."

greneclyf_forces.9.a:0 "проекте изучения блицкрига"
greneclyf_forces.9.b:0 "проекте моторизированных бригад"

# Проект "феникс"
greneclyf_forces.10.t:0 "Проект «Феникс»"
greneclyf_forces.10.d:0 "«Именно так. Подобное, с позволения сказать, ОМП будет настолько мощным, что даже малогабаритная боеголовка сможет стереть с лица земли целый город, не оставив никого в живых. А из-за физических свойств заряда, окружающая территория останется заражённой на многие годы», – ответил Целарл на вопрос Гиты.\n\n«Это ужасно...», – с грустью ответила королева.\n\n«Гита, дорогая, ты ведь была против даже адаптации для армии помповых ружей, считая их излишне жестокими. Но в итоге наши передовые диверсанты используют автоматические дробовики, которые в замкнутых пространствах куда эффективнее любого пистолета-пулемёта», – заметила Виксит и положила копыто ей на плечо.\n\n«Послушай... Чокнутые диктаторы и монархи других стран тоже рано или поздно придут к такому решению. И чтобы они не уничтожили нашу родину, нам хотя бы для виду нужно иметь оружие, способное уравновесить их амбиции».\n\nКоролева выглядела подавленной, отвела взгляд в сторону и тихо прошептала:"

greneclyf_forces.10.a:0 "«Помилуй и прости нас, Матрона»"

# ИСКРА №
greneclyf_hive.1.t:0 "Искра"
greneclyf_hive.1.d:0 "«Довольно необычное место для встречи, мадам президент», - заметил Адлер, попивая кофе на веранде.\n\n«Мне просто захотелось развеяться. Не волнуйся, снайперов здесь нет», - ответила Гита.\n\nОн усмехнулся, но быстро посерьёзнел. Гита отставила чашку и посмотрела ему в глаза.\n\n«Кому ты лоялен, Адлер?»\n\n«Вы гарантируете мою безопасность?»\n\n«Клянусь», - спокойно ответила она.\n\nАдлер снял фуражку.\n\n«Я лоялен только своей сестре и Дитрисиуму. Я не поддерживаю ни Торакса, ни Кризалис. Вот так - прямо признаюсь лидеру иностранного государства, что не верен своей королеве».\n\n«Расслабься», - сказала Гита. - «Мне важно это услышать. Значит, у нас есть общее. Мне больно видеть ульи в таком состоянии, и я хочу помочь нашему роду».\n\n«Интервенция?»\n\n«Я хочу выбить дверь и обрушить гнилой фасад. Ради мира. И ради твоей сестры тоже».\n\nАдлер отвёл взгляд:\n«Если с Хельвией что-то случится...»\n\n«Случится, если Кризалис останется у власти», - мягко ответила Гита. - «А если мы вмешаемся, Хельвия может стать новой королевой. Она справится».\n\nОн долго молчал, затем кивнул.\n\n«Хорошо, мадам президент. Я помогу. Но вы должны гарантировать Хельвии убежище в случае провала».\n\n«Безусловно».\n\n«И наденьте что-нибудь менее формальное в следующий раз», - добавил он с усмешкой, уходя.\n\nГита проводила взглядом его фигуру в форме УОБВ"

greneclyf_hive.1.a:0 "«Кто бы говорил»"

# ПОДАРОК #
greneclyf_hive.2.t:0 "Подарок"
greneclyf_hive.2.d:0 "«Идея жива. Многое предстоит сделать», - прочитал Кулицид, изучая содержимое вскрытого ящика и записку, лежавшую поверх аккуратно уложенных винтовок.\n\nКогда-то он сражался в рядах тораксиканского сопротивления, но после чисток Кризалис ушёл в подполье, сменив имя и жизнь, скитаясь, словно моряк без порта. Тем не менее кто-то знал о нём куда больше, чем следовало.\n\nВзгляд Кулицида задержался на оружии. Его охватила тоска по тем временам, когда он был нужен - и по идее, ради которой стоило рисковать жизнью. Возможно, мечта о свободе ещё не умерла.\n\nВозможно, пришло время вновь взяться за оружие.\n\nИ он знал, где искать того, кто всё ещё мог повести их за собой."

greneclyf_hive.2.a:0 "Пришло время, мой старый друг"

# ЗОЛОТАЯ РОЗА ДИТРИСИУМА #
greneclyf_hive.3.t:0 "Золотая роза Дитрисиума"
greneclyf_hive.3.d:0 "«Ради всего святого, зачем вы заикнулись о правах на трон Дитрисиума?! Вам что, жить надоело? Я получила это место по праву - я правлю там, а не Кризалис!» - взорвалась Хельвия, одетая в гражданское. Её голос дрожал от ярости и непонимания, пока Базальт Шоу сохранял каменное выражение лица.\n\n«Госпожа фон Дитрисиум, прошу. Это было необходимо, чтобы отвлечь внимание. Кризалис должна начать видеть угрозу в Гринклифе».\n\nХельвия тяжело выдохнула:\n«Зачем? Что она... нет, что вы все задумали?»\n\nШоу замялся, переходя на два тона тише:\n«Видите ли... Именно ради этого меня и направили к вам. Госпожа фон Дитрисиум, моя президент планирует переворот в королевстве. Ваш брат уже осведомлён и поддерживает план, только-»\n\nХельвия резко оборвала его:\n«Умолкни!» - вскрикнула она, едва услышав имя брата. - «Что... Адлер... Что вы, Тартар вас раздери, творите?! Вы вообще понимаете, что будет, если Кризалис об этом узнает?»\n\nШоу отвернулся, глядя в сторону:\n«Госпожа фон Дитрисиум, я не леди Гита. Я не умею играть на эмоциях других и обернуть этот диалог в сторону, где вы с радостью примете реальность, так что прошу вас, просто выслушайте. Адлер участвует, Гринклиф гарантирует вашу безопасность, если план будет раскрыт. В данный момент мы также кооперируемся с ячейками тораксиканцев, так что у вас будет поддержка. У вас в этом плане центральная роль: коро- кхм, мадам президент видит вас будущей королевой Ульев. Пожалуйста, нам нужна ваша помощь».\n\n«Да что вы за эгоисты...» - с обидой протянула Хельвия. - «Я не люблю Кризалис, но какое у вас право взваливать на меня такую ответственность, ломать мою нынешнюю жизнь...»\n\nОна отвернулась от Шоу, явно не желая его видеть.\n«Я не знаю, как вы добились, чтобы в этом участвовал мой брат. Но я не могу подвергать его опасности. Оставь мне документы и пошёл вон из моей комнаты»."

greneclyf_hive.3.a:0 "Через какое-то время она вышла на связь"

# СЛУХИ О ЗАГОВОРЕ НА СЕВЕРЕ #
greneclyf_hive.4.t:0 "Слухи о заговоре на севере"
greneclyf_hive.4.d:0 "В командование просочились тревожные слухи о подготовке тораксиканского восстания на севере. Кто-то вновь осмелился бросить вызов установленному порядку, подрывая гегемонию изнутри.\n\nПроклятый предатель так и не усвоил урок, продолжая действовать из тени. Но куда более тревожным остаётся другой вопрос - откуда у мятежников оружие?\n\nЕсли слухи подтвердятся, промедление может дорого обойтись. Однако поспешные действия рискуют лишь спугнуть заговорщиков и сорвать возможность выявить всю сеть."

greneclyf_hive.4.a:0 "УОБВ разберётся с изменой"

# КРИЗАЛИС РАСКРЫВАЕТ ЗАГОВОР #
greneclyf_hive.5.t:0 "Ужасные новости"
greneclyf_hive.5.d:0 "Ужасные новости: королева Кризалис каким-то образом выяснила о подготовке восстания в Дитрисиуме и немедленно отреагировала, полностью изолировав улей от внешнего мира.\n\nСвязь прервана, передвижение ограничено, а все попытки получить достоверную информацию о происходящем внутри пресекаются. Мы не уверены, как именно будет развиваться ситуация дальше, но наиболее вероятный сценарий выглядит мрачно.\n\nТораксиканцы, загнанные в угол и лишённые возможности координировать действия, могут открыть огонь по солдатам диктаторши, тем самым всё же начав бои - неподготовленными, разрозненными и без чёткого плана."

greneclyf_hive.5.a:0 "Грядёт хаос"

# ПРЕДАТЕЛИ СРЕДИ НАС #
greneclyf_hive.6.t:0 "Слухи подтвердились"
greneclyf_hive.6.d:0 "Слухи оказались правдивы: в Дитрисиуме действительно готовится восстание. Наши агенты успели перехватить посыльных, и после допроса выяснилось, что за происходящим так или иначе стоят наши мягкотелые сородичи с Гринклифа.\n\nЭти змеи не только спонсировали Торакса у нас под носом, но даже умудрились подговорить Хельвию предать корону. Значит, дело больше не ограничивается внутренней изменой - это уже внешнее вмешательство, замаскированное под «помощь» и «сострадание».\n\nВремени на сомнения не осталось."

greneclyf_hive.6.a:0 "К оружию, раздавить их!"

# ПОРОХОВАЯ НОЧЬ #
greneclyf_hive.7.t:0 "Пороховая ночь"
greneclyf_hive.7.d:0 "Покой полуночного Дитрисиума прервала оглушительная серия взрывов военных объектов с королевским гарнизоном и административных зданий. Чейнджлинги без опознавательных знаков волнами врывались в помещения, выводя сонных и перепуганных представителей власти Весалиполиса; кое-где раздавалась стрельба. К вооружённым субъектам присоединились аристократы и некоторые чейнджлинги в униформах УОБВ, контролируя аресты и разгон удивлённых граждан.\n\nЧерез какое-то время на динамиках по всему городу и на всех домашних радиостанциях началась передача:\n\n«Дорогие сограждане, любимые подданные.\nГлубоко задумавшись над общими тенденциями в мире и условиями, которые сложились в наших Ульях сегодня, мною было принято решение, что повлиять на существующую ситуацию могут только чрезвычайные меры.\n\nДействительно, Кризалис объявила войну, искренне желая обеспечить самосохранение Ульев. Теперь она ведёт нас к временному триумфу, но стратегически - к пропасти. Цели Кризалис иррациональны. Победа ничего не стоит, если она обернётся гибелью нашей нации от копыт пони.\n\nКоролева забыла, что корона дана не для её личного кнута, а для служения народу, уже приведя нас к позору 1002-го года. Если мы не поднимемся сейчас, у нас не будет уже ни чести, ни страны, ведь вторая война может стать для нас не просто поражением, а исчезновением.\n\nМы - дети одной земли, но разве мать ведёт своих детей на гибель раз за разом? Вера в силу не должна быть равна вере в безумие. Власть, не умеющая отступать, в конце концов теряет всё.\n\nСегодня перед нами стоит вопрос: как нам спасти миллионы наших подданных и не унизить себя?\n\nМысли о тех офицерах и солдатах, всех тех, кто пал на полях сражений, тех, кто погиб на своём посту или встретил смерть иначе, обо всех их убитых горем семьях ранят наше сердце днём и ночью.\n\nЯ прошу нашу достойнейшую армию встать под знамёна Дитрисиума и предотвратить катастрофу, к которой нас ведёт обезумевшая от гордыни кобыла в Весалиполисе и её подхалимы вроде Триммеля.\n\nОбъедините всю вашу силу для созидания, для лучшего будущего. Пусть весь наш народ, как одна семья, твёрдо придерживается идеи нерушимости нашей молодой страны и будет стойко выносить то тяжёлое бремя ответственности, которое легло на плечи нации, которой ещё предстоит проделать большой путь. Идите строго по пути справедливости, благородства духа и работайте с той мыслью, что вы можете вознести вечную славу нашему роду».\n\nПосле окончания речи Хельвии на радиостанциях заиграла до боли знакомая мелодия, перемешиваясь с рёвом системы оповещения и звуком поднимающихся в небо истребителей. Старый гимн Дитрисиума, который подданные не слышали уже годы, вызвал у кого-то из слушавших слёзы."

greneclyf_hive.7.a:0 "Гегемония трещит по швам"

# ДЕБЮТ #
greneclyf_hive.8.t:0 "Дебют"
greneclyf_hive.8.d:0 "Кивнув услышанному в радиопередаче, Адлер резко встал из-за стола и поспешил к Гите. Вломившись в её комнату, он грубо разогнал находившихся там дипломатов и, как только они остались вдвоём, наконец произнёс:\n\n«Над Весалиполисом безоблачное небо. У нас... получилось».\n\nПрезидент на мгновение замерла, удивлённо глядя на него, а затем рассмеялась, звонко поцеловав оперативника в щёку и крепко обняв.\n\n«Ты огромный умница, Адлер! Я безумно счастлива, но мы не можем сидеть без дела. Нам срочно нужно организовывать поддержку Хельвии. Пойдём - у нас много работы».\n\nАдлер выдохнул и последовал за той, кто стала причиной его участия во всём этом."

greneclyf_hive.8.a:0 "Поспешим... Гита"

# ET - TU #
greneclyf_hive.9.t:0 "Et tu?"
greneclyf_hive.9.d:0 "«Не может быть! Да... да кем эта сволочь себя возомнила?!» - в ярости выпалила Кризалис.\n\n«После стольких лет работы, после всего произошедшего... Я убью её!»\n\nТриммель отсалютовал:\n«Артиллерия сотрёт предателей в порошок по вашему приказу, после чего танки втопчут остатки в землю. Однако есть проблема, моя королева».\n\n«Какая на сей раз?!»\n\n«Коммуникации. Мы слепы на севере. УОБВ скоро восстановит контакт, но сам факт разрыва означает, что в разведке были предатели».\n\nГлаз Кризалис дёрнулся. Предатели - даже на таком уровне? В её разведке? Где... где она допустила ошибку?\n\nКоролева с холодной яростью прошипела:"

greneclyf_hive.9.a:0 "Я лично их всех перестреляю"

# ГРАЖДАНСКАЯ ВОЙНА В УЛЬЯХ #
greneclyf_hive.10.t:0 "Гражданская война в Ульях!"
greneclyf_hive.10.d:0 "Ульи чейнджлингов, ранее единые под знаменем Гегемонии Весалиполиса и королевы Кризалис, столкнулись с неожиданным и ужасающим событием: на эти земли пришла гражданская война.\n\nКоролева улья Дитрисиум, Хельвия, объявила своё восстание необходимым шагом к спасению страны, призвав всех неравнодушных граждан встать под знамёна её Улья. По слухам, её также поддерживает Торакс, что придаёт происходящему дополнительный символический вес.\n\nЭксперты отмечают, что очевидным следующим шагом после победы для Хельвии может стать провозглашение себя кайзериной нового королевства, что окончательно похоронит прежнюю систему власти в Ульях.\n\nВесь мир пристально следит за развитием событий в Гегемонии, поскольку исход конфликта способен повлиять на всю международную обстановку. Некоторые аналитики прямо заявляют: за восстанием стоят чейнджлинги из Гринклифа, действующие из тени."

greneclyf_hive.10.a:0 "«Распался алмазный венец...»"

# ГРАЖДАНСКАЯ ВОЙНА - ПОВСТАНЦЫ ПОДАВЛЕНЫ #
greneclyf_hive.11.t:0 "Восстание Хельвии фон Дитрисиум подавлено!"
greneclyf_hive.11.d:0 "Гражданская война в Землях Чейнджлингов окончена. Победителем из конфликта вышла центральная власть Весалиполиса.\n\nКризалис, к удивлению прессы, не празднующая победу, отказалась от любых комментариев. По сообщениям приближённых, королева пребывает в траурном состоянии.\n\nНа плечи Гегемонии теперь легли не только продолжающаяся война, но и восстановление одного из важнейших Ульев, управление которым отныне ведётся напрямую из Весалиполиса."

greneclyf_hive.11.a:0 "«В наших глазах окрики “Стой!”»"

# ГРАЖДАНСКАЯ ВОЙНА - ПОВСТАЦЫ ВЫИГРАЛИ #
greneclyf_hive.12.t:0 "Восстание Дитрисиума увенчалось успехом!"
greneclyf_hive.12.d:0 "Гражданская война в Землях Чейнджлингов завершилась победой восставшей королевы Хельвии фон Дитрисиум. Её первым шагом стало подписание мирных договоров с несколькими иноземными державами.\n\nНовая властительница объявила о создании Федеративного Королевства Чейнджлингия, заключив торговые соглашения с рядом крупных стран, а также подписав несколько оборонительных пактов с Федерацией.\n\nБудущее новой страны остаётся туманным. Многие аналитики не уверены, чего стоит ожидать от новой королевы чейнджлингов."

greneclyf_hive.12.a:0 "«В наших глазах крики “Вперёд!”»"

# КАЙЗЕРИНА #
greneclyf_hive.13.t:0 "Кайзерина"
greneclyf_hive.13.d:0 "Хельвия приняла титул кайзерины без особого энтузиазма. Теперь на её плечах лежало восстановление неожиданно доставшейся ей страны.\n\nНесколько дней она только и делала, что кивала и искала компромиссы - с военными, промышленниками, иностранцами. В один из таких дней её посетила очередная делегация.\n\nУвидев своего брата, Хельвия крепко обняла его, прикусив губу, чтобы не расплакаться. Но, заметив вышедшую рядом Гиту, её лицо померкло, вновь приняв уставшее, бюрократическое выражение последних дней.\n\n«Итак», - начала она, - «зачем вы здесь?»\n\n«Дипломатическое представительство. Я прошу тебя определить легальный статус Адлера в нашей стране как посла. И, разумеется, у меня есть щедрые предложения по кредитам для Королевства», - ответила Гита, слабо скрывая, что они с Адлером не отрывают друг от друга взгляда.\n\nЗаметив это и услышав про кредиты, Хельвия стала ещё более понурой. Кредит. На восстановление того, что она, президент, и спровоцировала.\n\n«Безвозмездная помощь. Никаких кредитов. Мой народ уже заплатил кровью. Я не собираюсь платить ещё и процентами».\n\nГита слегка удивилась, но задумалась.\n«Да... да, это имеет смысл. Я поговорю со Спринкл. Мы выделим вам поддержку и оформим поставки гуманитарной помощи».\n\nХельвия повела глазами.\n«А мой брат остаётся здесь. Он нужен моей стране как глава новой разведки и для наведения порядка против сторонников Кризалис».\n\nОба - Адлер и Гита - были заметно расстроены этими словами, но Хельвия просто отвернулась от них.\n\n«Таково моё решение как кайзерины независимого и суверенного королевства. Вопросы я слушать отказываюсь. До новых встреч, мадам президент. Адлер, в офис».\n\nХельвия поправила чёлку и ушла, оставив пару позади."

greneclyf_hive.13.a:0 "Партнёр, а не марионетка"

# ГОЛОСА #
greneclyf_hive.14.t:0 "Голоса"
greneclyf_hive.14.d:0 "«Я должен был умереть под Враксом. Чтоб я сдох...» - приговаривал старый чейнджлинг на очередной встрече ветеранов.\n\n«Мою семью разорвало у меня на глазах. Когда Вракс штурмовали с химическим оружием и дробовиками, я...» - губы старика задрожали, а глаза сжались. Префект Кэррион мягко похлопал его по спине, давая понять, что можно не продолжать.\n\nЗатем он повернулся к остальным и произнёс:\n\n«Товарищи. Братья. Я бы никогда не подумал, что окажусь в ситуации, подобной вашей. Мне трудно представить, насколько вы этого хотите... но вы в правильном месте. Месть, братья - по форме и по крови! Мы разделим вашу агонию и вернём ваш дом, уничтожив осквернивших его паразитов!»\n\nВетераны смотрели на него сначала с недоумением, но затем подняли копыта, скандируя одно слово:"

greneclyf_hive.14.a:0 "ВОЙНА! ВОЙНА! ВОЙНА!"

# РЕШИМОСТЬ #
greneclyf_hive.15.t:0 "Решимость"
greneclyf_hive.15.d:0 "«Это чудовищно. Я даже не знала, я...» - Гита запнулась, не находя слов, глядя на подругу.\n\n«Не волнуйся об этом», - устало ответила Хельвия. - «И... проклятье, Гита, спасибо тебе. Если бы не ты, я, возможно, уже была бы мертва».\n\nОна отложила формальности и мягко обняла президента.\n\nКоролева Дитрисиума задумалась.\n«Знаешь, я... у меня было много контактов в прошлом. Думаю, большинство из них тоже бежали. Я поговорю с Адлером. Мы придумаем что-нибудь, чтобы помочь тебе. Поверь, лишним это не будет».\n\n«И, кроме того...» - Хельвия прищурилась. Её глаза словно сверкнули красным в холодном, решительном взгляде. - «Надеюсь, ты осознаёшь, что так всё оставлять нельзя. Это просто неправильно»."

greneclyf_hive.15.a:0 "Как чейнджлинг, ты понимаешь меня"

# ОСУЖДЕНИЕ ОККУПАЦИИ #
greneclyf_hive.16.t:0 "Президент Леманн осуждает оккупацию Земель Чейнджлингов!"
greneclyf_hive.16.d:0 "На сессии парламента президент Федерации Ост-Грифонии Гита Леманн выступила с призывом к открытому осуждению раздела и оккупации земель бывшей Гегемонии Кризалис.\n\n«Пусть она была тираном, но из-за этого не должны страдать мирные чейнджлинги», - заявила президент, подчеркнув недопустимость коллективного наказания.\n\nОккупационные власти на Эквусе отказались от комментариев, заявив, цитата, что происходящее «не её дело».\n\nМировое сообщество оказалось расколотым. Одни считают, что судьба земель бывшего деспота - дело победителей; другие и вовсе презирают чейнджлингов как вид. Однако звучат и значимые голоса, призывающие не допускать жестокости в отношении мирного населения и отстаивающие право существ на дом."

greneclyf_hive.16.a:0 "Эквус вновь на пороге войны?"

# ФЕДЕРАЦИЯ ПРЕДЛАГАЕТ ОБЪЕДЕНИТЬ АЛЬЯНСЫ #
greneclyf_hive.17.t:0 "Федерация предлагает объединить альянсы"
greneclyf_hive.17.d:0 "Блосмпортские дипломаты обратились к нашему военному командованию и лично к принцу Блюбладу с предложением временно объединить военные альянсы ради повышения эффективности действий на фронте против Кризалис.\n\nШтабы обеих сторон поддерживают инициативу, указывая на необходимость координации операций и совместного использования ресурсов. Однако окончательное решение остаётся за Селестией, и именно от неё зависит, будет ли сделан этот шаг."

greneclyf_hive.17.a:0 "Разумеется, какой может быть разговор?"
greneclyf_hive.17.b:0 "Альянс с чейнджлингами против чейнджлингов? Думаю, пони не поймут этого"

# ОТЧЁТ О КОНФЕРЕНСИИ #
greneclyf_hive.18.t:0 "Отчёт о конференции"
greneclyf_hive.18.d:0 "### ОТЧЁТ О КОНФЕРЕНЦИИ\n\nНа конференции были рассмотрены и закреплены два плана послевоенного обустройства Ульев.\n\nПлан «Кокатрикс» сосредоточен на федеральном совместном управлении и предполагает преобразование страны в парламентскую республику с пропорциональным представительством каждого улья в сенате. Кандидатуры на пост премьер-министра приведены в приложении А.\n\nПлан «Цербер» предусматривает разделение занятых территорий на два марионеточных государства: эквестрийцы получают юг и устанавливают там правительство тораксиканцев, тогда как мы забираем север, закрепляя на этих землях монархию Хельвии фон Дитрисиум.\n\nДокумент подписан обеими сторонами. Встреча прошла в приподнятом настроении."

greneclyf_hive.18.a:0 "Хельвия будет удивлена"

# ДЕМОНЫ ГЕГЕМОНИИ #
greneclyf_hive.19.t:0 "Демоны Гегемонии"
greneclyf_hive.19.d:0 "После утомительных переговоров нам удалось убедить Селестию в том, что суд над Кризалис должны проводить именно мы, передав пони всех военных лиц, задержанных нашими силами.\n\nКризалис была приговорена высшим военным трибуналом к пожизненному заключению в секретной колонии Эйслинга. Кроме того, в нашу юрисдикцию перешли учёные Гегемонии, ответственные за разработку оружия и проведение биологических экспериментов по извлечению любви из военнопленных.\n\nЧестно говоря, их захват стал делом чистой удачи во время штурма отдельных объектов врага. Узнав об этом, пони потребовали либо передать учёных им, либо казнить их за чудовищные преступления.\n\nОднако окончательное решение остаётся за нашим военным судом. Мы можем отправить их в тюрьму, казнить... или же использовать их обширные знания во благо Федерации.\n\nСуд постановил:"

greneclyf_hive.19.a:0 "...их немедленно расстрелять и широко оповестить об этом население"
greneclyf_hive.19.b:0 "...пожаловать иммунитет от преследования в обмен на доступ к результатам экспериментов"


# НАВСЕГДА? #
greneclyf_hive.20.t:0 "«Я скучала по тебе...»"
greneclyf_hive.20.d:0 "«Я скучала по тебе...»\n\nАдлер промолчал.\n\n«Я понимаю Хельвию, её обиду. Но-»\n\n«Гита...»\n\n«Я не договорила!» - вскрикнула президент.\n\n«Я стольким пожертвовала в своей жизни. Моя лучшая, моя единственная подруга детства, называвшая меня сестрой, теперь зовёт меня по титулу, отказываясь от встреч под надуманными поводами», - Гита говорила с плохо скрываемой болью. - «Твоя сестра... она ненавидит меня за войну в Ульях. Ещё... я своими копытами финансировала убийства и похищения политиков, выступавших против федерализации».\n\n«Я монстр. Я чудовище, и я не знаю, что скажет обо мне история. Может-»\n\nОна не выдержала. Слёзы потекли сами собой, тело задрожало.\n\n«Проклятье! Я себе здесь нервы треплю, я все нулевые под смертью ходила, да и сейчас не лучше. Чуть что - так шишки на меня», - Гита смахнула слёзы, размазав тушь. В её голосе стало больше злости, чем печали.\n\n«Гражданам подачки дай, военным дай, бюрократам дай. Как президентом стала - так вообще не разобрать, то ли завтра опять выслушивать, то ли по головке гладят. Гармония, реформы, реформы, гармония... То дай, это сделай. А я жить нормально хочу! Я не только королева, президент и Тартар знает кто ещё, но и обычная женщина, Адлер!»\n\nОна почти осушила бокал и замолчала, глядя на не решающегося ответить чейнджлинга.\n\n«...во время кризиса... я как-то чуть не совершила дурацкую ошибку. И сейчас я думаю, что могу себе её позволить. Уже обдуманно», - Гита подняла глаза на бывшего офицера УОБВ. - «Адлер. Будь моим мужем».\n\nОна усмехнулась, сама не веря произнесённым словам, и вновь сделала глоток.\n\nАдлер выдохнул, подошёл к Гите и нежно её обнял.\n\n«Суждение - удел истории, Гита. Я не собираюсь судить тебя. Никогда. И я хочу быть рядом даже тогда, когда нет Ойрен или Базальта», - он сглотнул. - «Я согласен. А ты затянула с этим».\n\nГлаза Гиты расширились, и она в ответ крепко обняла его. На ней лежит немало грехов и благих дел, и она искренне надеется, что однажды Ойрен и Хельвия простят её. Но даже если и нет - в её жизни наконец появился тот, кто не осудит и кто останется.\n\nОна не знает, каким будет их путь и сколько сил потребуется, чтобы удержать его рядом. Но сейчас это не имело значения. Как не имело значения ничего, кроме их чувств."

greneclyf_hive.20.a:0 "Навсегда"

# МИР В НАШЕ ВРЕМЯ #
greneclyf_hive.21.t:0 "Мир в наше время"
greneclyf_hive.21.d:0 "«Синовал? Пфф», - Гита хмыкнула, закрыв глаза. - «Может, это и сукин сын, но он наш сукин сын, улавливаешь?»\n\n«Ты, должно быть, шутишь. В чём смысл иметь в союзниках военного, копирующего Кризалис?» - с сомнением спросила Ойрен.\n\n«Нет, Ойрен. Я многое поняла за свою карьеру. И одно из самых важных: личность, хоть и важна, мало что решает в политике. У Кризалис был кабинет, и кабинет Синовала - это наш кабинет. Там сидят наши агенты, наша элита. По сути, его очаровательной националистической страной управляют наши же гармонисты, и мы сможем научить их хорошему. Со временем. Давить на них сейчас нельзя. После войны им нужна передышка».\n\nПрезидент улыбнулась, довольная своим объяснением.\n\n«Войны... Да на что они вообще годны, Тартар подери? Я клянусь, что сделаю всё для сохранения мира и для спасения нашей родни дома. Так и будет устроена наша коалиция с Синовалом. Ойрен, просто задумайся, насколько великолепна для будущего наша кооперация с Рейхом. Мы уже сейчас защищаем пострадавших, а со временем сможем изнутри вырастить новую федерацию - да хоть воплотить концепт оленийско-чейнджлингского союза!»\n\nОйрен задорно рассмеялась от этой идеи, отхлебнув кофе. Уничтожение Ульев Кризалис изменило её. Она не любила войны и жестокость, презирала тиранию, и сначала ей казалось, что падение режима - это хороший исход. Но когда до неё дошли новости о резне её сородичей-чейнджлингов и истории беженцев, единственное, о чём она думала, - это о спасении своей крови и воздаянии оккупанту.\n\nЕй всё ещё не нравилась идея диалога с Синовалом, но слова Гиты о правительстве её успокоили. По крайней мере, пока. Главное, что сейчас занимало её голову: она вновь пьёт что-то вкусное рядом со своей любимой подругой, чего не делала уже очень давно.\n\nУвидев её расслабленное лицо, Гита подмигнула ей и по-жеребячьи хихикнула:"

greneclyf_hive.21.a:0 "Нам снова нужен тот самый хиндийский чай!"

# ВСЁ КАК ОБЫЧНО #
greneclyf_hive.22.t:0 "Всё как обычно"
greneclyf_hive.22.d:0 "Гита перепроверила очередную телеграмму из Дитрисиума. Писала Хельвия - предлагала открыть филиалы нескольких строительных компаний для продолжающегося восстановления княжества.\n\nПрезидент уже говорила с ней ранее. Королева Дитрисиума явно была благодарна Гите за то, что та не воспользовалась планом восстания и не заставила её соотечественников убивать друг друга, хотя и сожалела, что страна теперь не была единой. Гите уже начинало казаться, что с воцарением мира на самом деле изменилось не так уж много, кроме...\n\nПопросив охрану уйти, президент подошла к решётке вплотную. Всё те же зеленоватые волосы, изумрудные глаза, изящная длинная шея и то самое ощущение превосходства.\n\n«...»\n\n«Нечего сказать, да?»\n\nСидящая по ту сторону решётки слегка повернула голову, уставившись на президента.\n\n«Я долго думала, почему ты меня не убила. Думала, что ты мягкотелая», - усмехнулась она, сверкнув глазами в полубезумной улыбке. - «Но я поняла. Наконец-то поняла, когда увидела твою Федерацию.\n\nТы не мягкотелая. О нет. Ты далека от этого. На самом деле из нас двоих ты страшнее меня, Леманн.\n\nВедь я была неумелой. Я объединила их, но моей опорой были страх и парады. А ты? Ты заставила их верить в себя, стала их иконой, промыла мозги не только пони, но и всем прочим живым тварям своего великолепно-омерзительного проекта. Меня боятся по причине, а тебя боятся лишь те, кто понимает твоё могущество. И, быть может, этого ты и пытаешься добиться - в том числе и от меня», - фигура начала смеяться, а её глаза будто бы пульсировать. - «Я ненавижу тебя за разрушение моего проекта, но при этом восхищаюсь величием твоего. Быть может, это перерастёт в одержимость. Ты гениальна. Ты внушила им мысль, что чейнджлинги будут править ими, и они будут счастливы этому!»\n\nГита перекривила лицо.\n\n«Мы не одинаковы. Зачем я вообще пришла тратить время на сумасшедшую старуху? Я и сама не понимаю, почему не отдала тебя эквестрийцам. Но сейчас это уже не важно. Приятного тебе вечного отпуска».\n\nПрезидент покинула тюрьму, ещё долго слыша в своей голове отголоски безумного смеха горделивой кобылы, которая однажды приняла её в своей стране. Стране, которую её гостья потом помогла уничтожить.\n\nДействительно ли между ними есть сходство? Это ли имела в виду тогда Ойрен...?"

greneclyf_hive.22.a:0 "...Мне не до этого. Хельвии нужна моя помощь"

