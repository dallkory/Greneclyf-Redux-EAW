  greneclyf_redux.1.t:0 "Наследие"
  greneclyf_redux.1.d:0 "Гита медленно просматривала отчёты за прошлый год и старые газеты, чтобы иметь максимально точное представление, какую страну получила в свои копыта.\n\n«Луддиты, луддиты, луддиты... кажется, когда я была младше, то их не было так много, не так ли?», - королева с тоской глянула в окно, хмурясь на собирающиеся тучи.\n\n«Вероятно, такова цена прогресса. Какая там самая ранняя запись о появлении недовольных машинами? 90-е? Святая Матрона, я ведь была совсем крохой! Всего за одно поколение Энья смогла настолько радикально поменять облик общества...», - Гита задумчиво изучала появляющиеся на окне капли, размышляя, как старая страна совместного труда быстро сменилась разделенным обществом гильдий, мануфактур, элиты и бедняков.\n\n«Ваше Величество?» - зашёл в кабинет лорд-протектор королевства Базальт Шоу, неловко постучав копытом по открытой двери. «Что-то тяготит вас?»\n\n«По всей видимости, индустриализация – это не только благо. Я даже не думала, что станки из Грифонии отобрали такое огромное количество работы! И луддиты...»\n\n«Ваше слово, и стража займётся ими, леди Гита»\n\n«Нет. Ни в коем случае, они мои маленькие подданные, невинные и голодные рабочие, у которых отобрали способ реализоваться. Никакая сила не должна быть использована против страждущих. Мы отобрали у них работу – нам это и исправлять. Я... я что-нибудь точно придумаю на созыве Эряхтаса. Это наша первая и наиболее актуальная проблема», - решительно выпалила Гита, глаза которой бегали по строкам, говорящих о том, как безработица привела к богатству новых промышленников и обнищанию рядовых дронов. «Ты, кстати, для чего пришел? Какое-то дело?»\n\nШоу кивнул с нейтральным выражением лица. «Королевская гвардия. Как новый главнокомандующий, у меня есть некоторые концепты для модернизации нашей армии, но, поскольку вы упомянули Эряхтас, то там это и решится. Не смею вас больше тревожить,» - лорд-протектор было повернулся, чтобы уйти, но остановился, будто бы что-то вспомнил: «Её Превосходительство верховная судья Ойрен просила передать, что хотела бы встретить вас в библиотеке этим вечером. Что мне ей ответить?»\n\nГита переваривала мысль о том, что ей предстоит как-то участвовать в вопросах модернизации армии, пока знакомое имя не вывела её из транса: «Ойрен?» - лицо королевы слегка расслабилось"

  greneclyf_redux.1.a:0 "Я буду там. Передай ей снова взять с собой тот хиндийский чай"


  greneclyf_redux.2.t:0 "Созыв Эряхтаса"
  greneclyf_redux.2.d:0 "Обе палаты представителей парламента собрались в древнем здании Блосмпортского Аббатства также, как они и их предшественники делают уже более 800 лет, но сегодняшнее заседание было несколько необычным: каждый из префектов, кардиналов, офицеров и бюрократов понимал, что невероятный прогресс. Обычные для Аббатства в период заседания крики и агрессивные споры сменились на возбужденные перешептывания, который прервал громкий удар молотком верховной судьи Ойрен из Ойр:\n\n«Порядок!» - она глубоко вздохнула, и продолжила в своей властной манере – «I заседание Эряхтаса при блаженном правлении Её Величества Гиты из Леманн объявляется открытым! Слово предоставляется самому монарху»\n\nОйрен направила свой выжидательный и суровый взгляд на Гиту, и только королева из всего зала могла видеть в таком выражении лица своей названной сестры мягкость и подбадривание начать речь.\n\n«Я... Кхм, рада впервые приветствовать представителей всех сословий нашего славного сообщества под одной крышей. Начавшаяся эпоха – это начало творения истории, для которого Славная Энья всю свою жизнь растила семена потом и кровью нашей нации. Пришло время сорвать плоды её стараний и приумножить их, не посрамив наследия прошлой королевы, и для этого я и все мы приложим максимум усилий! Впереди много работы: приведение Гвардии в состояние, достойного 11го века, наш народ жаждет работу, которую у него отобрали станки, бедность вернулась на улицы впервые со времён Первого Великого Голода,» - Гита продолжила, становясь слегка эмоциональнее – «Даже Аббатство! Кардиналы грызутся друг с другом за право верной трактовки слова Матроны; как мы дошли до такого?!» - королева снова встретилась взглядом с Ойрен, которая невербально намекала ей на необходимость сменить вектор выступления.\n\n«Но...но есть и те вещи, которые со времен Эньи работают как скайфольские часы – это наша новая система законов, Устав которой был написан в начале этого века, и введение системы префектур, которая показала себя максимально эффективно по сравнению с прошлой системой удел. Сегодня, как я ожидаю, префект Кэррион из нашей славной столицы поделится своим опытом с Эряхтасом, после чего будут услышаны прочие мнения и вопросы, из которых мы коллегиально решим, какой путь предстоит преодолеть нашей стране. Сердечно благодарю вас всех»\n\nСидящие в Аббатстве представители проводили королеву овациями, пока она возвращалась к своему месту возле Ойрен.\n\n«Ты молодец» - прошептала верховная судья, еле заметно улыбнувшись, после чего по обычаю властно крикнула «Порядок!». «Слово предоставляется Эйпекс Кэрриону, префекту Блоссмпорта»\n\nСтатный высокий чейнджлинг дворянской наружности поправил свой монокль, шагая к трибуне, и скрипучим голосом громко ответил:"

  greneclyf_redux.2.a:0 "«Благодарю за предоставленную возможность, Ваше Величество Гита и Ваше Превосходительство Ойрен»"

  # Gytha Jorney #
  greneclyf_redux.3.t:0 "Начало пути"
  greneclyf_redux.3.d:0 "Префект Кэррион специально для сегодняшнего дня собрал часть городской стражи для проведения парада, чтобы показать Гите, как проходят дела в Блосмпорте. Генерал был крайне горд собой, вытягивая шею и оскалом улыбаясь марширующим гвардейцам.\n\nСегодня Гита не просто осматривала город, но объявила о начале королевского тура по всему острову, что префект решил отметить городским праздником. Подданные короны целыми семьями сновали от одного уличного торговца к другому, пока толпа с восторгом смотрела на офицеров и наслаждалась живой музыкой.\n\n«Как вам парад, Ваше Величество?» - спросил Кэррион Гиту, машущую копытом толпе.\n\n«Должна признать», - начала она – «То, как обновился Блосмпорт со времён моего детства – просто поражает воображение. Когда я была жеребенком, то на нашей пристани были лишь деревянные лодки, и посмотри на неё сегодня – это целая верфь, где меня ждёт наш первый корабль!»\n\nКэррион поправил монокль, одобрительно оглядывая стального левиафана. «Да, Её Величество Энья действительно великая, что смогла познакомить наш народ с этими чудесами. Но вынужден предупредить, моя Королева, другие части нашего нации...не столь продвинуты. Быть может, вас даже ждёт шок от того, насколько разительно отличаются столица и другие места страны» - произнес Кэррион, хмуря брови.\n\nГита пожала плечами – «Что ж, тогда я это и увижу, префект. В конце концов, это мне вытягивать нашу страну на совершенно новый уровень, а не кому-то другому. И я к этому готова»\n\nПрефект еле заметно улыбнулся, явно наслаждаясь силой воли королевы. Может быть она и наивна, но в ней явно есть потенциал для великих дел при более прагматичном подходе."

  greneclyf_redux.3.a:0 "«Желаю удачи в пути, Ваше Величество»"

  greneclyf_redux.4.t:0 "Вне Золотой Клетки"
  greneclyf_redux.4.d:0 "Впервые оказавшись в Эйслинге, Гита удивленно ахнула, пока сходила по тропу с корабля. Это тоже её страна? Это захолустье?\n\nИз мыслей её вывела скромно организованная церемония приветствия, которая сразу наполнила её сердце радостью, когда она увидела своих чумазых подданных, счастливо приветствующих королеву. Центральной фигурой среди них был рослый чейнджлинг с серьезным выражением лица, которое сразу приняло вид усталой улыбки при виде двух самых важных фигур в королевстве.\n\n«Ваше Величество, Ваше Превосходительство – да осветит мудрость Матроны ваши пути», - чейнджлинг низко полконился.\n\«Рада видеть тебя, претор Онихион. Или ты предпочитаешь, когда тебя зовут по светской должности префекта?», - спросила его Ойрен.\n\nГита изучала фигуру: «Онихион? Вы так...постарели с того момента, как мы виделись последний раз. Мне трудно поверить, что вы тот же чейнджлинг, который проводил с нами обряд посвящения годы назад»\n\n«Время течет, моя Королева. Теперь столичный претор и наиболее вероятный кардинал – это Актино. Я же нашёл свою силу в служении здесь, где я нужен нашим братьям и сёстрам по вере как префект, не только как духовное лицо», - Онихион перевёл глаза на жителей Эйслинга.\n\nСледующие пару дней Гита и Ойрен провели на практике изучая, как выглядит жизнь в этом крае. Ежедневные беседы с Онихионом открывали глаза на то, насколько неравно распределилась модернизация острова: некоторые чейнджлинги здесь даже не умеют читать, а грамотная работа чиновников началась только при Энье с назначением священника префектом.\n\nПопрощавшись с Эйслингом, королева и сопровождающие её особы отправились в дальнейший пункт назначения"

  greneclyf_redux.4.a:0 "Жукомир ждёт!"

  greneclyf_redux.5.t:0 "Стальной город"
  greneclyf_redux.5.d:0 "Когда Гита появилась в Жукомире, картина города оказалась для неё совершенно неожиданной: посреди площади толпа окружила плотную чейнджлинга, которая, потея, просила всех успокоиться. Увидев королеву, её глаза округлились, и она снова заговорила в микрофон: «Ваше Величество! Жукомир приветствует вас!»\n\nТолпа замерла, поворачиваясь на 180 градусов, и устремляя глаза на Гиту. Она неловко улыбнулась, помахав своим подданным, и через несколько минут они начали заваливать её бесконечными жалобами: «Королева, у нас отняли работу!», «Нам становится не на что есть, ваше Величество!», «Матрона, помилуй нас!».\n\nВперёд ошалевшей Гиты сделала шаг Ойрен, громко крикнув в толпу «ПОРЯДОК!», заткнув подданных. «Я так понимаю, мой родной улей переживает не лучшие дни. Что ж, возрадуйтесь – с инспекцией прибыла не только Её Величество, но и ваша Верховная Судья, и я с радостью выслушаю ваши претензии, чтобы определить курс действий далее. И наш уважаемый префект Берилла мне в этом посодействует, не так ли?» - Ойрен оскалилась на нервно сглатывающую чиновницу посреди площади.\n\nВ течение следующих нескольких дней королева и верховная судья проводили инспекции мануфактур и шахт, то и дело слушая о рабочей ситуации от рабочих, владельцев фабрик, префектов, шахтеров и даже от луддитов, с лидером которых Гита выпила чай под строгим взглядом лорда Шоу.\n\nВозможно, по Ойрен не было это видно, но её сердце пребывало в печали от зрелища того, чем стал её дом. Базальт ощутил её скорбь, взвалив на себя часть дел и общение с гражданами, помогая судье избежать тоски.\n\nКогда Берилла и представители самых разных сословий города проводили первых лиц государства, в сердце каждого из них зарождалась надежда, что именно Гите под силу исправить кризисную ситуацию не только дошедшего до трущоб Жукомира, но и всего королевства."

  greneclyf_redux.5.a:0 "Гул поезда удалялся от города..."

  greneclyf_redux.6.t:0 "Дорога домой"
  greneclyf_redux.6.d:0 "«Я всё ещё удивлена, что для обеспечения безопасности ты взяла только Базальта и пару гвардейцев, Гита» - фыркнула Ойрен, глядя из окна локомотива на леса Гринклифа. «Как видишь, жизнь дронов далека от идеала, и всего одного озлобленного фанатика хватит, чтобы устроить этой стране такой кризис, который ей и не снился»\n\nГита в ответ лишь улыбнулась, читая один из документов из Эйслинг : «Ойрен, я ценю обеспокоенность, но я уверена, что мои подданные не будут пытаться убить меня. Я не боюсь их, я люблю каждого из них и хочу, чтобы они это видели. К тому же, даже если среди них и объявится некий...особый элемент, то наш неустанный лорд-протектор вмиг с ним разделается!»\n\nЛицо Ойрен омрачила тень неуверенности, пока она думала, что ответить. В конце концов, она лишь громко выдохнула\n\n«Гита...помнишь дронов из Эйслинга? Пока ты разговаривала с Онихионом об их жизни, я побеседовала с молодёжью – безграмотность поголовная. Образовательная система не справляется, нас теперь слишком много»\n\n«Добавь это в список наших проблем, которые предстоит решить» - горько усмехнулась Гита. «Или вспомни, как теперь выглядит Жукомир... Мне жаль видеть, чем он стал. Подумать только, некогда первый город нашего народа стал пыльным бетонным мешком»\n\nОйрен вздохнула, впервые открыто показав грусть по состоянию своего родного улья, отреченно глянув в окно.\n\n«Я рада, что ты рядом, Ойрен. Это правда много для меня значит» - сказала королева.\n\n«Я знаю. Мы и так неразлучны с детства, даже в королевской мантии ты от меня не отвяжишься, Леманка» - слабо ухмыльнулась судья.\n\n«Да...» – мечтательно протянула Гита, поудобнее располагаясь рядом и прикрывая глаза от усталости – «и пусть так будет вечно»\n\nОйрен чуть улыбнулась, после чего снова глянула в окно на активно заходящее солнце и погрузилась в мысли о том, что она любой ценой поможет сопящей рядом королевской особе достигнуть того, чтобы в Гринклифе было приятно жить."

  greneclyf_redux.6.a:0 "«Спи спокойно, ты заслужила немного отдыха»"

  greneclyf_redux.7.t:0 "Отчет выпускников 277"
  greneclyf_redux.7.d:0 "«### Совершенно секретно, исключительно для глаз Её Величества», – Гита поморщилась от официоза, но продолжила читать желтый пергамент.\n\nЧерез некоторое время она мягко положила лист своим рогом на стол, задумавшись. Выходит, рынок не регулирует себя сам, и республиканцы Кемерская ошибались, а иногда государственное вмешательство – это не так уж и плохо?\n\n«Этот Бикколини – определенно эксцентричен, но что-то в этом есть», – протянула Гита, разглядывая привезенного из Депонии паука в стекле."

  greneclyf_redux.7.a:0 "«Возможно, нам следует адаптировать часть его методов»"

  greneclyf_redux.8.t:0 "Квартира будущего"
  greneclyf_redux.8.d:0 "Когда пришло время демонстрировать её проект, чейнджлинг с голубыми глазами радостно улыбнулась во всю свою челюсть, поприветствовал королеву с сильным аквелийским акцентом:\n\n«Bonjour, Votre Majesté! Я невероятно рада продемонстрировать вам миниатюрный проект жилища, которое в будущем будет находиться в каждом уголке нашей славной родины: дешево, практично и миленько, oui!» – чуть не подпрыгнув прощебетала юная архитектор.\n\n«Oui, oui! Прошу!» – Вальга сняла магией бархатное полотно, демонстрируя небольшой макет здания. Гита подошла поближе, разглядывая его.\n\n«Это...что, дорогая Вальга?»\n\n«Это, Ваше Величество, то, что в Аквелии называется «construction modulaire». Смысл в том, что такое здание не строится на месте, но вместо этого собирается из панельных блоков, заранее изготовленных на фабриках! Экономия просто невероятная, и смотрите!» – Ксилокопа подошла поближе, с горящими глазами снимая с макета здания крышку, демонстрируя внутреннее убранство.\n\n«Вот, вот, ma Reine, видите? Это пространство полностью оптимизировано таким образом, чтобы будущим жильцам было максимально удобно заниматься всеми домашними делами. Вы представляете, какой километраж набегает средняя домохозяйка, пока она готовит похлебку и ухаживает за потомством? Разумеется, это утомляет, но не в таком проекте жилья, где всё рядом», – она положила чертеж, показывая метраж типовой квартиры.\n\n«Пространство кажется довольно небольшим. Я бы даже сказала, что на грани неудобства» – заметила Верховная Судья. «Ты уверена, что это не перебор?»\n\n«Non, non, non, что вы! Всё специально рассчитано, я ведь не просто защитила дипломную работу по этой теме, но жила в подобном здании. Это называется рациональной экономией, то есть как раз тем, что нужно нашему острову в такое сложное время» – Ксилокопа вновь ослепительно улыбнулась.\n\nПосле недолгих переговоров и кивка Ойрен, Гита ответила:"

  greneclyf_redux.8.a:0 "«Мисс Вальга, поздравляю вас, ваш проект утверждён»"

  greneclyf_redux.9.t:0 "Письмо от баронессы"
  greneclyf_redux.9.d:0 "Обливаясь потом, Гита читала красиво написанное письмо с пошлым следом от поцелуя на бумаге – очевидно, от кого оно.\n\n«Уважаемая королева и дорогая племянница,\n\nК превеликому несчастью, проблемы с урожаем начались даже ранее, чем я ожидала. Из-за неожиданного северного шторма были перебиты те скудные посевы, что у нас уже были. Святая Роща вынуждена перейти на систему талонов на пропитание, а своим указом префекта я объявляю на улицах комендантский час, дабы пресечь беспорядки на корню. Сердечно прошу вас принять меры и всегда готова к содействию.\n\nВсегда ваша,\n\nБаронесса Виксит Леманн, префект Ллир»"

  greneclyf_redux.9.a:0 "Проклятье..."

  greneclyf_redux.10.t:0 "Случилась реальность"
  greneclyf_redux.10.d:0 "«Прости, не мог бы ты повторить?» – с дергающимся глазом обратилась Гита к своему лорду-протектору.\n\n«Голод, Ваше Величество. В Фарбруке был неудачный сезон рыбной ловли. Мы надеялись закупить того, чего нам не хватило, у Бакары, но пошлины Речной Коалиции наша казна потянуть не способна. Я боюсь, страна стоит на пороге того, что случилось 800 лет назад...»\n\nГита ударила копытами стол, гневно пыхтя: «У нас всё ещё есть время! Есть шанс для манёвра! Шоу, созови Эряхтас немедленно! Позови Ойрен!»\n\nБазальт нахмурил брови, понимая серьезность ситуации, и, откланявшись, поспешил связываться с первыми лицами государства.\n\nГита увалилась в кресло, смотря на свои трясущиеся копыта. Она знает, что такое голод, весь остров хорошо усвоил урок Первого Великого Голода 800 лет назад, убедившись, что потомки не забудут ужасные картины истощенных дронов, поедающих друг друга с отвращением на их лицах. Одна мысль о подобном заставила Гиту пролить слезу, жадно хватая воздух в панике, пока она не сделала большой вдох и выдох.\n\n«Я не дам этому ужасу повториться. Чего бы то ни стоило, мои маленькие подданные не будут свидетелями второго кошмара»"

  greneclyf_redux.10.a:0 "«Или я не королева из рода Леманн!» «Второй Великий Голод начался...»"
  greneclyf_redux.10.b:0 "§R«Возможно, сдаться не самый худший вариант?»"

  #greneclyf_redux.9.a:0 "Проклятье..."
  #greneclyf_redux.9.a:0 "Проклятье..."

  #greneclyf_redux.9.a:0 "Проклятье..."

  greneclyf_redux.16.t:0 "Зона Греха"
  greneclyf_redux.16.d:0 "Подписав бесчисленное множество кабальных контрактов и договоров, Гита остановилась на последнем, глядя на представителя речного капитала так, будто та только что рассказала ей самую несмешную шутку за долгое время.\n\n«Игорная зона? Что это вообще значит?» — королева бросила вопрошающий взгляд на мнущуюся пони из Бакары.\n\n«Видите ли, Ваше Величество,» — та кашлянула и заговорила осторожно, — «во многих странах речных земель казино запрещены или не контролируются, превращаясь в рассадники различного сброда. И вот... мои патроны предлагают вам открыть первое легальное казино в Саоре, куда бы стекались деньги со всех земель».\n\nОнихион, присутствующий на встрече как префект Эйслинга, вскочил в гневе.\n\n«Вы хотите открыть в нашей религиозной стране этот рассадник блуда и греха?!» — рявкнул он, уставившись на торгового представителя, которая ещё сильнее вжалась в кресло.\n\n«Ваше Величество, даже будучи представителем раскольников, я не могу это никак одобрить. Это омерзительно!»\n\n«А ты думаешь, я не знаю?!» — уже сама Гита гневно выкрикнула в ответ, ударив копытом по столу. — «Избавь меня от слов о Матроне, Онихион, наш народ может докатиться до того, что начнёт есть друг друга! Чем они будут питаться?! Твоими речами?!» — резко добавила она, вновь опускаясь в кресло.\n\n«Е-если позволите...» — нервно подняла копытце представительница, натянуто улыбаясь. — «За счёт сборов ваша казна получит очень много денег, я гарантирую, что спрос будет огромный. Да-да, это же ещё и повысит инвестиционную привлекательность для туризма!»\n\nОнихион выглядел как расстроенный ребёнок и тяжело выдохнул. Тем временем Гита быстрым росчерком пера позволила открытие бизнеса, а затем резко подняла взгляд на пони.\n\n«Как тебя зовут?»\n\n«С-Свит Спринкл», — поправила она очки, заикаясь.\n\n«Теперь, мисс Спринкл, за всё, что будет происходить в Саоре, вы будете подотчётны лично мне. Ясно? Свободны».\n\nКоролева отвернулась, явно не желая продолжать разговор.\n\nГлаза бакарки округлились. Она коротко поклонилась, развернулась и поспешила выйти, аккуратно закрыв за собой дверь."

  greneclyf_redux.16.a:0 "«Я ведь всего лишь брокер...»"

  greneclyf_redux.17.a:0 "Скучающий капитан"
  greneclyf_redux.17.a:0 "Пони в фуражке довольно ухмыльнулся, заметив приближающегося к нему лорда-протектора Её Величества. Он допил сидр, снял головной убор и приветливо кивнул.\n\n«Лорд-протектор! Большая честь встретить вас. Чем могу помочь?»\n\nБазальт скептически оглядел его, но всё же перешёл к делу:\n\n«Приветствую, капитан Батлер. Я здесь по поручению Её Превосходительства Верховной Судьи. Она хочет знать, зачем ОРК отправила сюда свой полицейский полк, вместо того чтобы положиться на Гвардию».\n\nУлыбка капитана слегка померкла.\n\n«Если честно, лорд, они просто не доверяют вам», — произнёс он, глядя на чейнджлинга. — «Формальная причина — обеспечение безопасности всех международных гостей и прочие размытые формулировки. Но по сути всё дело в доверии. Ну, его отсутствии, и-хи-хи-хи».\n\n«Вы... весьма откровенны, капитан. Хотя это и заслуживает уважения, сама ситуация удручает».\n\nПони понимающе кивнул, лениво оглядывая крупы проходящих мимо гражданок, затем снова посмотрел на лорда Шоу.\n\n«Ваше благородие, буду честен: плевал я на политику. В моей жизни три страсти — выпивка, кобылки и военная отвага. Все три вещи я с лёгкостью найду здесь. И предлагаю вам, как представителю последней, дружбу. Я уважаю вас как офицер уважает главнокомандующего и гарантирую, что буду втихаря от генштаба держать вас в курсе происходящего в Саоре. Если, конечно, вы не будете вмешиваться в дела зоны напрямую — дабы не спугнуть торгашей, и-хи-хи. Согласны?»\n\nПони вновь ухмыльнулся, но в этом оскале Шоу не увидел угрозы. Перед ним сидел скорее озорной жеребёнок, жаждущий немного напакостить своему начальству по неведомым ему причинам.\n\nБазальт выдохнул.\n\n«Что ж, раз альтернативой будет лишь штурм этой так называемой зоны Гвардией и разрыв связей с Коалицией, у меня нет выбора. Но я жду предельной честности, капитан»."

  greneclyf_redux.17.a:0 "«Отныне здесь будут как явный, так и тайный закон»"

  greneclyf_redux.32.t:0 "Сообщения из родового гнезда"
  greneclyf_redux.32.d:0 "«Да ты издеваешься!» — рявкнула Ойрен на племянника. «Как вы умудрились допустить забастовку?!»\n\n«Криками делу не поможешь, Ойри» — Кианит с распущенным галстуком пил кофе, постукивая копытом по столу. «Рабочие были на пределе, после вашего визита так вообще начали считать, что все их проблемы магически решены. Бедолага Берилла там уже в больницу слегла от стресса, так что я пока и.о. префекта стал. Работенка, скажу я тебе...»\n\nОйрен погрузила морду в копыта, громко выдохнув. Совсем ведь немного оставалось до того, чтобы жизнь начала быть нормальной, и, разумеется, всё нужно испортить в последний момент.\n\n«Будь готов к введению военного положения»\n\nКианит икнул от неожиданности. «Ты уверена? А что скажет Гита?»"

  greneclyf_redux.32.a:0 "«Я что-нибудь придумаю»"
  
  greneclyf_redux.26.t:0 "Святое место"
  greneclyf_redux.26.d:0 "По пути в Ллир Гита заметно нервничала. Когда она была маленькой, то чуть не сорвала там своё посвящение в церковь Матроны, чихнув на священника. От одного только воспоминания его взгляда и звонкого хохота её тётушки щёки Гиты порозовели, и она вышла в тамбур поезда, чтобы проветрить голову\n\nБазальт Шоу также стоял там, читая зашифрованное сообщение о статусе безопасности в регионе, и, не отрывая глаз, произнёс: «Нервничаете, госпожа?»\n\nГита вздохнула, с поражением ответив: «Я уже монарх, но всё равно до сих пор боюсь смеха Виксит. И надо было Энье утверждать её префектом?»\n\nШоу задумчиво ответил: «Если я помню верно, то эта ветвь вашего рода Леманн владеет этими землями практически с момента экспедиции Улисса века назад. Ничего удивительного, что префектом избрана одна из ваших родственниц.»\n\n«Да, да... всезнайка» — надулась королева.\n\nПосле прибытия первых лиц государства сопроводили расшито одетые стражники мимо обширных полей, на которых работали крестьяне, до большого белого особняка. Со стороны казалось, что это скорее феодальная вотчина с рабами, но в действительности сам город — аграрный центр королевства — был расположен чуть ниже. Особняк же представлял собой одновременно администрацию и место жительства его префекта — баронессы Виксит дома Леманн, известную своей эксцентричностью и любовью к изобретениям. Внутри здания Гита попросила свою свиту подождать её, отправившись на разговор с баронессой одна через странные механические двери.\n\n«Давно же я не видела твою очаровательную мордочку, душенька», — бархатисто произнесла худая чейнджлинг с нехарактерными для дома Леманн длинными чёрными волосами, лицо которой закрывал красный расшитый веер из Кирии. «Какими судьбами?»\n\nГита нервно усмехнулась: «Проверка королевства перед началом реформ, тётушка. Ваша префектура осталась последней, так что...» — Гита села напротив пары изучающих её розовых глаз — «давайте обсудим, какова наша ситуация».\n\n"

  greneclyf_redux.26.a:0 "Следующая страница"

  greneclyf_redux.30.t:0 "Святое место"
  greneclyf_redux.30.d:0 "Виксит оживилась, изящно изогнув брови: «Отрадно видеть такой настрой. Что же, новостей две, и обе не хорошие». Баронесса положила на стол распечатанные списки, числа в которых становились всё меньше и меньше.\n\n«Урожайность падает? Но почему?» — спросила Гита.\n\n«Эксперименты аграриев, живших в Бродфельде», — протянула Виксит. «Провал за провалом. Не волнуйся, моя дорогая королева, я уже казнила их».\n\n«Ка-» — поперхнулась Гита. «Н-не слишком ли радикально, дорогая баронесса?»\n\n«Ни в коем случае. Они поставили нас перед лицом голода, который может повлечь тысячи смертей из-за безалаберности. И они обязаны были отплатить», — лицо баронессы стало суровее. — «Ошибки такого масштаба никогда не должны прощаться, мой монарх. Прошу вас помнить об этом всё ваше правление».\n\nРой мыслей шумел в голове Гиты: с одной стороны, в словах Виксит есть доля истины, но с другой — казнь за то, что они просто хотели помочь стране и провалились?\n\nПрефект положила веер, закурив через длинный мундштук тонкую сигарету. «Власть — это ответственность. И ответственность за будущую трагедию лежит на них. Я понесу любое ваше наказание за то, что допустила это, моя королева».\n\nГита сильно ударила копытами по столу, крикнув на свою родственницу: «Прекрати! Мы живём в новом времени, где нет дворянского произвола — у тебя в коридоре сидит верховная судья, которая формирует нам систему закона, перед которым равны все! Чтобы больше я не слышала ни про какое самоуправство и внесудебные расправы, Виксит!» — выпалила Гита, слегка трясясь.\n\nВиксит ничего не ответила, медленно втягивая сизый дым сигареты и кладя на стол ещё одну бумагу — некий нарисованный символ. «А это вторая новость», — произнесла она с закрытыми глазами. «Крестьяне говорят, что в Святой Роще поселился шабаш ведьм. Байки, вероятно, но стража нашла эти символы в некоторых местах по всему Ллиру. Я приложу усилия для выявления, но, сдаётся мне, это трата времени. Просто нужно успокоить крестьян, что в святом месте нет хулы на Матрону».\n\nКоролева рассмотрела причудливый символ, забрав его к остальным документам в свою сумку. Баронесса вновь открыла глаза, смотря на Гиту с уважением и строгостью.\n\n«Если ты хочешь править действительно новым королевством, то сначала создай его, Гити»."

  greneclyf_redux.30.a:0 "«Я буду здесь, наблюдать за тем, что ты дашь нам»"

