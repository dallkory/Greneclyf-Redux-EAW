  NCH_Basalt_Shaw:0 "Лорд-протектор Базальт Шоу"
  NCH_Basalt_Shaw_desc:0 "Живой символ единства знатных родов Гринклифа. Его происхождение идёт одновременно из обоих веток. Смелый кадровый офицер и опасный дуэлянт. Он зарекомендовал себя как лучший фехтовальщик страны, но главное его достоинство - это беззаветная преданность королевским семьям Ойр и Леманн. Личный телохранитель королевы."

