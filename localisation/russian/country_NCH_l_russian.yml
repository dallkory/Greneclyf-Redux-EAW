  greneclyf_redux.33.t:0 "Рассвет над Островом"
  greneclyf_redux.33.d:0 "Королева наслаждалась ранним рассветом в своём саду, когда дверь скрипнула и её нашла Леди Судья. Ойрен не сказала ни слова, просто сев рядом и разделив покой со своей названной сестрой.\n\nОбе понимали, что времена впереди, быть может, будут даже сложнее пережитого ими кризиса. Что таких спокойных моментов, как этот, будет всё меньше, так что ни к чему портить его разговорами. Тем не менее, Ойрен не могла не посмотреть на Гиту. Ветер слегка развевал её розовые волосы, а взгляд выражал твёрдость и уверенность. Она уже не та, кем была ещё до начала голода; теперь перед Судьёй сильный, повзрослевший монарх, готовый вести за собой целую нацию.\n\nВнезапно из открытой двери послышались удары больших часов, провозгласившие наступление пяти утра. Гита медленно встала, улыбнулась Ойрен и ушла обратно во дворец, оставив Её Превосходительство в саду одну."

  greneclyf_redux.33.a:0 "«Дела не ждут»"

  greneclyf_redux.700.t:0 "Капля чернил, что меняет мир"
  greneclyf_redux.700.d:0 "«Странное же ты выбрал место, Гагат», – произнёс Шоу, осматривая то, что некогда было пекарским цехом, а теперь превратилось в рупор королевства под названием «типография». Он слегка поморщился, оценивая обстановку: запах теста ещё висел в воздухе, а старые деревянные балки создавали атмосферу чего-то устаревшего и неприспособленного к амбициозным планам.\n\nПолный чейнджлинг, пыхтя сигарой, смотрел на здание с зачарованными глазами, и только с задержкой услышав лорда-протектора короны, ответил: «Базальт, какая разница, где она находится? Это же будущее, понимаешь? Это не просто золотая жила, это настоящий способ формировать мнение населения!» Гагат начал заливаться блаженным смехом, так сильно, что даже слёзы полились из его глаз, но он не мог остановиться.\n\n«А ты, я вижу, горишь идеей. Хорошо, что Баронесса Виксит любит инновации, и тебе повезло найти у неё покровительство», – добавил он, тщательно изучая здания вокруг. «Двор подумывает создать новое отделение по работе с населением. Быть может, я его даже возглавлю. Так что, дружище, мы будем поддерживать контакт и по поводу материалов печати.»\n\nГагат расплылся в улыбке. «Ну разумеется! Знал бы ты, как внутренний жеребёнок во мне сейчас радуется! Я ведь прилагаю своё копыто к чему-то действительно великому, будучи директором первой типографии в стране» – он сделал очередную глубокую затяжку, крикнув рабочим, чтобы они бережнее несли печатные станки.\n\nШоу удовлетворился процессом, заполнив со своим старым товарищем бумаги, после чего спросил Гагата: «А как ты назовешь газету?»\n\nГагат подошел к Базальту, медленно проведя копытом в воздухе:"

  greneclyf_redux.700.a:0 "«Crónán na Fírinne»  (прим. «Глашатай Правды»)"
 
