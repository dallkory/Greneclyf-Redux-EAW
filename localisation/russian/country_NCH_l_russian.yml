  greneclyf_redux.16.t:0 "Зона Греха"
  greneclyf_redux.16.d:0 "Подписав бесчисленное множество кабальных контрактов и договоров, Гита остановилась на последнем, глядя на представителя речного капитала так, будто та только что рассказала ей самую несмешную шутку за долгое время.\n\n«Игорная зона? Что это вообще значит?» – королева бросила вопрошающий взгляд на мнущуюся пони из Бакары.\n\n«Видите ли, Ваше Величество,» – та кашлянула и заговорила осторожно, – «во многих странах речных земель казино запрещены или не контролируются, превращаясь в рассадники различного сброда. И вот... мои патроны предлагают вам открыть первое легальное казино в Саоре, куда бы стекались деньги со всех земель».\n\nОнихион, присутствующий на встрече как префект Эйслинга, вскочил в гневе.\n\n«Вы хотите открыть в нашей религиозной стране этот рассадник блуда и греха?!» – рявкнул он, уставившись на торгового представителя, которая ещё сильнее вжалась в кресло.\n\n«Ваше Величество, даже будучи представителем раскольников, я не могу это никак одобрить. Это омерзительно!»\n\n«А ты думаешь, я не знаю?!» – уже сама Гита гневно выкрикнула в ответ, ударив копытом по столу. – «Избавь меня от слов о Матроне, Онихион, наш народ может докатиться до того, что начнёт есть друг друга! Чем они будут питаться?! Твоими речами?!» – резко добавила она, вновь опускаясь в кресло.\n\n«Е-если позволите...» – нервно подняла копытце представительница, натянуто улыбаясь. – «За счёт сборов ваша казна получит очень много денег, я гарантирую, что спрос будет огромный. Да-да, это же ещё и повысит инвестиционную привлекательность для туризма!»\n\nОнихион выглядел как расстроенный ребёнок и тяжело выдохнул. Тем временем Гита быстрым росчерком пера позволила открытие бизнеса, а затем резко подняла взгляд на пони.\n\n«Как тебя зовут?»\n\n«С-Свит Спринкл», – поправила она очки, заикаясь.\n\n«Теперь, мисс Спринкл, за всё, что будет происходить в Саоре, вы будете подотчётны лично мне. Ясно? Свободны».\n\nКоролева отвернулась, явно не желая продолжать разговор.\n\nГлаза бакарки округлились. Она коротко поклонилась, развернулась и поспешила выйти, аккуратно закрыв за собой дверь."

  greneclyf_redux.16.a:0 "«Я ведь всего лишь брокер...»"

  greneclyf_redux.17.a:0 "Скучающий капитан"
  greneclyf_redux.17.a:0 "Пони в фуражке довольно ухмыльнулся, заметив приближающегося к нему лорда-протектора Её Величества. Он допил сидр, снял головной убор и приветливо кивнул.\n\n«Лорд-протектор! Большая честь встретить вас. Чем могу помочь?»\n\nБазальт скептически оглядел его, но всё же перешёл к делу:\n\n«Приветствую, капитан Батлер. Я здесь по поручению Её Превосходительства Верховной Судьи. Она хочет знать, зачем ОРК отправила сюда свой полицейский полк, вместо того чтобы положиться на Гвардию».\n\nУлыбка капитана слегка померкла.\n\n«Если честно, лорд, они просто не доверяют вам», – произнёс он, глядя на чейнджлинга. – «Формальная причина – обеспечение безопасности всех международных гостей и прочие размытые формулировки. Но по сути всё дело в доверии. Ну, его отсутствии, и-хи-хи-хи».\n\n«Вы... весьма откровенны, капитан. Хотя это и заслуживает уважения, сама ситуация удручает».\n\nПони понимающе кивнул, лениво оглядывая крупы проходящих мимо гражданок, затем снова посмотрел на лорда Шоу.\n\n«Ваше благородие, буду честен: плевал я на политику. В моей жизни три страсти – выпивка, кобылки и военная отвага. Все три вещи я с лёгкостью найду здесь. И предлагаю вам, как представителю последней, дружбу. Я уважаю вас как офицер уважает главнокомандующего и гарантирую, что буду втихаря от генштаба держать вас в курсе происходящего в Саоре. Если, конечно, вы не будете вмешиваться в дела зоны напрямую – дабы не спугнуть торгашей, и-хи-хи. Согласны?»\n\nПони вновь ухмыльнулся, но в этом оскале Шоу не увидел угрозы. Перед ним сидел скорее озорной жеребёнок, жаждущий немного напакостить своему начальству по неведомым ему причинам.\n\nБазальт выдохнул.\n\n«Что ж, раз альтернативой будет лишь штурм этой так называемой зоны Гвардией и разрыв связей с Коалицией, у меня нет выбора. Но я жду предельной честности, капитан»."

  greneclyf_redux.17.a:0 "«Отныне здесь будут как явный, так и тайный закон»"

  greneclyf_redux.32.t:0 "Сообщения из родового гнезда"
  greneclyf_redux.32.d:0 "«Да ты издеваешься!» – рявкнула Ойрен на племянника. «Как вы умудрились допустить забастовку?!»\n\n«Криками делу не поможешь, Ойри» – Кианит с распущенным галстуком пил кофе, постукивая копытом по столу. «Рабочие были на пределе, после вашего визита так вообще начали считать, что все их проблемы магически решены. Бедолага Берилла там уже в больницу слегла от стресса, так что я пока и.о. префекта стал. Работенка, скажу я тебе...»\n\nОйрен погрузила морду в копыта, громко выдохнув. Совсем ведь немного оставалось до того, чтобы жизнь начала быть нормальной, и, разумеется, всё нужно испортить в последний момент.\n\n«Будь готов к введению военного положения»\n\nКианит икнул от неожиданности. «Ты уверена? А что скажет Гита?»"

  greneclyf_redux.32.a:0 "«Я что-нибудь придумаю»"
  
  greneclyf_redux.26.t:0 "Святое место"
  greneclyf_redux.26.d:0 "По пути в Ллир Гита заметно нервничала. Когда она была маленькой, то чуть не сорвала там своё посвящение в церковь Матроны, чихнув на священника. От одного только воспоминания его взгляда и звонкого хохота её тётушки щёки Гиты порозовели, и она вышла в тамбур поезда, чтобы проветрить голову\n\nБазальт Шоу также стоял там, читая зашифрованное сообщение о статусе безопасности в регионе, и, не отрывая глаз, произнёс: «Нервничаете, госпожа?»\n\nГита вздохнула, с поражением ответив: «Я уже монарх, но всё равно до сих пор боюсь смеха Виксит. И надо было Энье утверждать её префектом?»\n\nШоу задумчиво ответил: «Если я помню верно, то эта ветвь вашего рода Леманн владеет этими землями практически с момента экспедиции Улисса века назад. Ничего удивительного, что префектом избрана одна из ваших родственниц.»\n\n«Да, да... всезнайка» – надулась королева.\n\nПосле прибытия первых лиц государства сопроводили расшито одетые стражники мимо обширных полей, на которых работали крестьяне, до большого белого особняка. Со стороны казалось, что это скорее феодальная вотчина с рабами, но в действительности сам город – аграрный центр королевства – был расположен чуть ниже. Особняк же представлял собой одновременно администрацию и место жительства его префекта – баронессы Виксит дома Леманн, известную своей эксцентричностью и любовью к изобретениям. Внутри здания Гита попросила свою свиту подождать её, отправившись на разговор с баронессой одна через странные механические двери.\n\n«Давно же я не видела твою очаровательную мордочку, душенька», – бархатисто произнесла худая чейнджлинг с нехарактерными для дома Леманн длинными чёрными волосами, лицо которой закрывал красный расшитый веер из Кирии. «Какими судьбами?»\n\nГита нервно усмехнулась: «Проверка королевства перед началом реформ, тётушка. Ваша префектура осталась последней, так что...» – Гита села напротив пары изучающих её розовых глаз:\n\n"

  greneclyf_redux.26.a:0 "«Давайте обсудим, какова наша ситуация»"

  greneclyf_redux.30.t:0 "Святое место"
  greneclyf_redux.30.d:0 "Виксит оживилась, изящно изогнув брови: «Отрадно видеть такой настрой. Что же, новостей две, и обе не хорошие». Баронесса положила на стол распечатанные списки, числа в которых становились всё меньше и меньше.\n\n«Урожайность падает? Но почему?» – спросила Гита.\n\n«Эксперименты аграриев, живших в Бродфельде», – протянула Виксит. «Провал за провалом. Не волнуйся, моя дорогая королева, я уже казнила их».\n\n«Ка-» – поперхнулась Гита. «Н-не слишком ли радикально, дорогая баронесса?»\n\n«Ни в коем случае. Они поставили нас перед лицом голода, который может повлечь тысячи смертей из-за безалаберности. И они обязаны были отплатить», – лицо баронессы стало суровее. – «Ошибки такого масштаба никогда не должны прощаться, мой монарх. Прошу вас помнить об этом всё ваше правление».\n\nРой мыслей шумел в голове Гиты: с одной стороны, в словах Виксит есть доля истины, но с другой – казнь за то, что они просто хотели помочь стране и провалились?\n\nПрефект положила веер, закурив через длинный мундштук тонкую сигарету. «Власть – это ответственность. И ответственность за будущую трагедию лежит на них. Я понесу любое ваше наказание за то, что допустила это, моя королева».\n\nГита сильно ударила копытами по столу, крикнув на свою родственницу: «Прекрати! Мы живём в новом времени, где нет дворянского произвола – у тебя в коридоре сидит верховная судья, которая формирует нам систему закона, перед которым равны все! Чтобы больше я не слышала ни про какое самоуправство и внесудебные расправы, Виксит!» – выпалила Гита, слегка трясясь.\n\nВиксит ничего не ответила, медленно втягивая сизый дым сигареты и кладя на стол ещё одну бумагу – некий нарисованный символ. «А это вторая новость», – произнесла она с закрытыми глазами. «Крестьяне говорят, что в Святой Роще поселился шабаш ведьм. Байки, вероятно, но стража нашла эти символы в некоторых местах по всему Ллиру. Я приложу усилия для выявления, но, сдаётся мне, это трата времени. Просто нужно успокоить крестьян, что в святом месте нет хулы на Матрону».\n\nКоролева рассмотрела причудливый символ, забрав его к остальным документам в свою сумку. Баронесса вновь открыла глаза, смотря на Гиту с уважением и строгостью.\n\n«Если ты хочешь править действительно новым королевством, то сначала создай его, Гити»."

  greneclyf_redux.30.a:0 "«Я буду здесь, наблюдать за тем, что ты дашь нам»"

